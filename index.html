<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="accelerator-build" content="V52.1-reference-ui-v75">
<title>Accelerator OS V52.1</title>
<style>
html,body{margin:0;min-height:100%;background:#0D1117;color:#E6EDF3;font-family:Inter,system-ui,sans-serif}
body{display:grid;place-items:center}.load{text-align:center;padding:24px}.load p{color:#8B949E}
</style>
</head>
<body>
<div class="load"><h1>Accelerator OS</h1><p>Loading the V75 workspace…</p></div>
<script>
(async()=>{
  try{
    const response=await fetch('/api/source',{cache:'no-store'});
    if(!response.ok)throw new Error(`Source request failed: ${response.status}`);
    const html=await response.text();
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="load"><h1>Accelerator OS could not load</h1><p>Please refresh the page.</p></div>';
  }
})();
</script>
</body>
</html>
