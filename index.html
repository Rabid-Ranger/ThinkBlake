<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="accelerator-build" content="V179-protocol-focus-flow-cloud-renderfix">
<title>Accelerator OS V179</title>
<style>html,body{margin:0;min-height:100%;background:#0D1117;color:#E6EDF3;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center}.load{text-align:center;padding:24px}.load p{color:#8B949E}</style>
</head>
<body>
<div class="load"><h1>Accelerator OS</h1><p>Loading your V179 workspace…</p></div>
<script>
(async()=>{try{const r=await fetch('/api/source',{cache:'no-store'});if(!r.ok)throw new Error(`Source request failed: ${r.status}`);const html=await r.text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="load"><h1>Accelerator OS could not load</h1><p>Please refresh the page.</p></div>'}})();
</script>
</body>
</html>
