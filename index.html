<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171f27"><meta name="referrer" content="no-referrer"><script>if(new URLSearchParams(location.search).has("creatorPortalToken"))document.documentElement.setAttribute("data-creator-loading","");</script><style>html[data-creator-loading] body{visibility:hidden}html[data-creator-loading]::before{content:"Opening your video workspace…";display:block;position:fixed;inset:0;padding:25vh 24px;text-align:center;background:#f6f8fa;color:#17212b;font:16px system-ui;z-index:2147483647}</style>
<meta name="accelerator-build" content="V16.3.15">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Accelerator OS V16.3.15</title>
<style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center}.load{text-align:center;padding:24px}.load p{color:#8b949e}</style>
</head>
<body>
<div class="load"><h1>Accelerator OS</h1><p>Loading your workspace...</p></div>
<script>
(async()=>{try{
  const creatorToken=new URLSearchParams(location.search).get('creatorPortalToken');
  const r=await fetch('/api/source?build=v16315',{cache:'no-store'});
  if(!r.ok)throw new Error(`Source request failed: ${r.status}`);
  let html=await r.text();

  // Framework is added by the V16.3 extension after the base app is defined.
  // The base normalizer's view allow-list predates that extension, so the
  // persistence safety normalizer was resetting "framework" back to "home".
  // Add the V16.3 view to the canonical allow-list before the app executes.
  const baseViews="const VIEWS=['home','creators','strategy','plan','videos','planner','calendar','learn','library'];";
  const currentViews="const VIEWS=['home','creators','strategy','plan','videos','planner','calendar','learn','library','framework'];";
  if(html.includes(baseViews)) html=html.replace(baseViews,currentViews);

  // Client-resource hotfix: use native links for saved resources instead of
  // popup-style window.open calls, and keep the toolbar Resources control as
  // the chain icon instead of showing a numeric badge when links are saved.
  const drawerResourceButton='<button class="tinybtn" data-action="v152-open-resource" data-id="${r.id}">Open ↗</button>';
  const drawerResourceLink='<a class="tinybtn" href="${esc(v152SafeUrl(r.url)||"#")}" target="_blank" rel="noopener noreferrer">Open ↗</a>';
  const homeResourceButton='<button class="v152-open-link" data-action="v152-open-resource" data-id="${r.id}">Open ↗</button>';
  const homeResourceLink='<a class="v152-open-link" href="${esc(v152SafeUrl(r.url)||"#")}" target="_blank" rel="noopener noreferrer">Open ↗</a>';
  html=html.split(drawerResourceButton).join(drawerResourceLink);
  html=html.split(homeResourceButton).join(homeResourceLink);
  html=html.replace('</head>','<style id="accelerator-resource-hotfix">.v152-badge{display:none!important}.v152-open-link,.v152-resource-row a.tinybtn{text-decoration:none}</style></head>');

  // A creator link uses the real planner, but must never load or replace the
  // coach's browser or cloud workspace. Keep its short-lived draft in session
  // storage before the app source runs.
  if(creatorToken){
    html=html.replace('<html','<html data-creator-loading');
    html=html.replace('</head>',"<meta name=\"referrer\" content=\"no-referrer\"><style>html[data-creator-loading] body{visibility:hidden}html[data-creator-loading]::before{content:\"Opening your video workspace…\";display:block;position:fixed;inset:0;padding:25vh 24px;text-align:center;background:#f6f8fa;color:#17212b;font:16px system-ui;z-index:2147483647}</style>"+'</head>');
    const preflight=`<script>(function(){var k='accelerator.mainline.v11.cleancore',shadow=null;window.__acceleratorCreatorPlannerMode=true;var p=Storage.prototype,g=p.getItem,s=p.setItem,r=p.removeItem;p.getItem=function(key){return String(key)===k?shadow:g.call(this,key)};p.setItem=function(key,value){return String(key)===k?(shadow=String(value)):s.call(this,key,value)};p.removeItem=function(key){return String(key)===k?(shadow=null):r.call(this,key)};})();<\/script>`;
    html=html.replace('</head>',preflight+'</head>');
  }

  if(creatorToken)html=html.replace('</body>','<script src="/ui/plain-language.js"><\/script><script src="/ui/creator-save-queue.js"><\/script><script src="/ui/creator-planner-mode.js"><\/script></body>');
  else html=html.replace('</body>','<script src="/analytics/measurement.js"><\/script><script src="/analytics/engine.js"><\/script><script src="/analytics/import.js"><\/script><script src="/analytics/page.js"><\/script><script src="/analytics/workspace.js"><\/script><script src="/analytics/legacy-baseline-compat.js"><\/script><script src="/analytics/live.js"><\/script><script src="/analytics/clarity.js"><\/script><script src="/analytics/decision-context.js"><\/script><script src="/analytics/workflow-context.js"><\/script><script src="/analytics/richness.js"><\/script><script src="/analytics/usability-v3.js"><\/script><script src="/analytics/program-bridge.js"><\/script><script src="/ai/review-reminders.js"><\/script><script src="/ai/review-ui.js"><\/script><script src="/ui/plain-language.js"><\/script><script src="/ui/client-documents.js"><\/script><script src="/ui/creator-sharing.js"><\/script><script src="/ui/creator-save-queue.js"><\/script><script src="/ui/creator-planner-mode.js"><\/script></body>');
  html=html.replace('</body>','<script src="/ui/reference-media.js"><\/script><script src="/ui/video-guidance.js"><\/script><script src="/ui/creator-workbench.js"><\/script><script src="/ui/research-progress.js"><\/script><script src="/ui/ai-planning.js"><\/script></body>');
  html=html.replace('</head>','<link rel="stylesheet" href="/ui/navigation.css"></head>');
  document.open();
  document.write(html);
  document.close();
}catch(e){
  document.documentElement.removeAttribute("data-creator-loading");
  console.error(e);
  document.body.innerHTML='<div class="load"><h1>Accelerator OS could not load</h1><p>Please refresh the page.</p></div>';
}})();
</script>
</body>
</html>
