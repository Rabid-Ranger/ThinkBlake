# V75 verification gate. This existing workflow path is retained so pull request synchronization triggers reliably.
name: Verify V75 full reference UI rebuild

on:
  workflow_dispatch:
  push:
    branches: [agent/v75-full-reference-ui-rebuild]
    paths:
      - .github/workflows/verify-v72-reference-ui.yml
      - patches/v75-reference-system.css
      - patches/v75-reference-system.js
      - scripts/build-v72-reference.js
      - tests/v75-full-reference-ui.js
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-v72-reference-ui.yml
      - patches/v75-reference-system.css
      - patches/v75-reference-system.js
      - scripts/build-v72-reference.js
      - tests/v75-full-reference-ui.js

permissions:
  contents: write

concurrency:
  group: verify-v75-full-reference-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'agent/v75-full-reference-ui-rebuild' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the V75 dashboard
        run: node scripts/build-v72-reference.js
      - name: Validate embedded scripts
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),os=require('os'),path=require('path');
          const html=fs.readFileSync('decoded-source.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match=>match[1]).filter(code=>code.trim());
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'accelerator-v75-'));
          scripts.forEach((code,index)=>{const file=path.join(dir,`script-${index}.js`);fs.writeFileSync(file,code);cp.execFileSync(process.execPath,['--check',file],{stdio:'inherit'})});
          console.log(`Validated ${scripts.length} embedded scripts.`);
          NODE
      - name: Install browser verification
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the rebuilt dashboard
        run: |
          python3 -m http.server 4173 >/tmp/v75-server.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/decoded-source.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v75-server.log
          exit 1
      - name: Verify the full reference-system rebuild
        run: node tests/v75-full-reference-ui.js
      - name: Commit the verified V75 preview and evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decoded-source.html index.html qa/v75-full-reference-ui-report.json qa/v75-*.png
          if git diff --cached --quiet; then
            echo "Verified V75 preview is already current."
          else
            git commit -m "Publish verified V75 full reference UI preview"
            git push origin HEAD:agent/v75-full-reference-ui-rebuild
          fi
