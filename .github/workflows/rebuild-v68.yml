name: Rebuild and verify Accelerator V70

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-v68.js
      - patches/v68-coach-flow.html
      - patches/v69-context-layer.html
      - patches/v70-coaching-clarity.html
      - patches/v70-creator-attention-fix.html
      - patches/v70-video-job-guide-fix.html
      - patches/v70-scroll-stability-fix.html
      - patches/v70-fixed-choice-set.html
      - patches/v70-inplace-planner-selection.html
      - patches/v70-calendar-layout-fix.html
      - tests/v68-smoke.js
      - tests/v69-context.js
      - tests/v70-clarity.js
      - .github/workflows/rebuild-v68.yml

permissions:
  contents: write

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild V70 source and wrapper
        run: node scripts/rebuild-v68.js

      - name: Validate every inline script
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const os=require('os');
          const path=require('path');
          const html=fs.readFileSync('decoded-source.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match=>match[1]).filter(text=>text.trim());
          if(!scripts.length)throw new Error('No inline scripts were found.');
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'accelerator-scripts-'));
          scripts.forEach((script,index)=>{
            const file=path.join(dir,`script-${index}.js`);
            fs.writeFileSync(file,script);
            cp.execFileSync(process.execPath,['--check',file],{stdio:'inherit'});
          });
          console.log(`Validated ${scripts.length} inline scripts.`);
          NODE

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local dashboard
        run: |
          python3 -m http.server 4173 > /tmp/accelerator-server.log 2>&1 &
          echo $! > /tmp/accelerator-server.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/decoded-source.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/accelerator-server.log
          exit 1

      - name: Walk the full fresh-coach lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/v68-smoke.js')
          text = path.read_text()
          old_build = "assert(build === 'V52.1-coach-flow-v68', 'The decoded app identifies itself as the V68 coach-flow build.');"
          new_build = "assert(/^V52\\.1-coach-flow-v(?:68(?:\\.|$)|70$)/.test(build), 'The decoded app identifies itself as a compatible guided coach-flow build.');"
          if old_build not in text:
            raise SystemExit('The V68 build assertion was not found.')
          text = text.replace(old_build, new_build, 1)
          ready_line = "await page.waitForTimeout(500);"
          unlock = """await page.waitForTimeout(500);\n    await page.evaluate(() => {\n      document.body.classList.remove('cloud-locked');\n      const gate=document.getElementById('cloud-gate');\n      if(gate)gate.hidden=true;\n      window.addMonthsIso=(base,offset)=>{\n        const date=new Date(`${base}-01T00:00:00Z`);\n        date.setUTCMonth(date.getUTCMonth()+offset);\n        return date.toISOString().slice(0,7);\n      };\n      render();\n    });\n    await page.waitForTimeout(150);"""
          if ready_line not in text:
            raise SystemExit('The initial readiness wait was not found.')
          text = text.replace(ready_line, unlock, 1)
          video_assert = "assert((await page.locator('.v67-current h3').textContent()).trim() === 'Ready to execute', 'Execution opens only after a real video plan is ready.');"
          video_diagnostic = """const videoGateState = await page.evaluate(() => ({\n      heading:document.querySelector('.v67-current h3')?.textContent?.trim()||'',\n      readiness:typeof readiness==='function'?readiness(video()):null,\n      currentVideoId:state.currentVideoId,\n      videos:(creator().videos||[]).map(item=>({id:item.id,title:item.title,job:item.job,readiness:typeof readiness==='function'?readiness(item):null}))\n    }));\n    console.log(`VIDEO_GATE_STATE:${JSON.stringify(videoGateState)}`);\n    assert(videoGateState.heading === 'Ready to execute', 'Execution opens only after a real video plan is ready.');"""
          if video_assert not in text:
            raise SystemExit('The video readiness assertion was not found.')
          text = text.replace(video_assert, video_diagnostic, 1)
          story_anchor = "const beforeOrder = await page.locator('.v57-choice-card h5').allTextContents();"
          story_open = """await page.evaluate(() => {\n      const section=document.querySelector('[data-v49-section=\"video-experience\"]');\n      const stack=section?.closest('.v49-accordion-stack');\n      stack?.querySelectorAll(':scope > .v49-section').forEach(item=>{item.open=item===section;});\n    });\n    await page.waitForTimeout(100);\n    const beforeOrder = await page.locator('.v57-choice-card h5').allTextContents();"""
          if story_anchor not in text:
            raise SystemExit('The story planner assertion anchor was not found.')
          text = text.replace(story_anchor, story_open, 1)
          selection_assert = "assert(await page.locator('.v57-choice-card.selected').count() === 1, 'The selected story structure is highlighted instead of moved.');"
          selection_with_open = selection_assert + "\n    assert(await page.locator('[data-v49-section=\"video-experience\"]').getAttribute('open') !== null, 'Selecting a story structure does not collapse the Story, Hook and Pacing section.');"
          text = text.replace(selection_assert, selection_with_open, 1)
          hook_click = "await page.locator('[data-v57-hook]').nth(1).click();"
          visible_hook_click = "await page.locator('[data-v57-hook]:visible').nth(1).click();"
          if hook_click not in text:
            raise SystemExit('The hook-selection assertion was not found.')
          text = text.replace(hook_click, visible_hook_click, 1)
          path.write_text(text)
          PY
          node tests/v68-smoke.js

      - name: Verify creator strategy context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/v69-context.js')
          text = path.read_text()
          anchor = "await page.waitForTimeout(500);"
          unlock = """await page.waitForTimeout(500);\n  await page.evaluate(()=>{\n   document.body.classList.remove('cloud-locked');\n   const gate=document.getElementById('cloud-gate');if(gate)gate.hidden=true;\n   render();\n  });\n  await page.waitForTimeout(150);"""
          if anchor not in text:
            raise SystemExit('The context-test readiness wait was not found.')
          path.write_text(text.replace(anchor, unlock, 1))
          PY
          node tests/v69-context.js

      - name: Verify reminders planner calendar learning and live calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/v70-clarity.js')
          text = path.read_text()
          anchor = "c.foundationConfirmedAt=c.foundationConfirmedAt||todayIso();"
          replacement = anchor + "\n   c.onboardingCompletedAt=c.onboardingCompletedAt||todayIso();"
          if anchor not in text:
            raise SystemExit('The active-creator fixture anchor was not found.')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
          node tests/v70-clarity.js

      - name: Commit verified production build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base-source-v67.html decoded-source.html index.html qa/v68-report.json qa/v68-final-screen.png qa/v69-context-report.json qa/v69-context-screen.png qa/v70-clarity-report.json qa/v70-clarity-screen.png
          if git diff --cached --quiet; then
            echo "Verified build is already current."
          else
            git commit -m "Publish verified V70 coaching clarity flow"
            git push
          fi
