<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17212b">
<title>Creator Workspace</title>
<style>
:root{color-scheme:light;--ink:#17212b;--muted:#65717a;--line:#dce3e6;--soft:#f4f7f8;--accent:#234f52;--good:#2f8464}
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:0 auto;padding:28px 0 80px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.brand{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.04em;line-height:1;margin:7px 0 9px}h2{font-size:22px;letter-spacing:-.025em;margin:0}.muted,.save-state{color:var(--muted)}.save-state{font-size:13px;text-align:right}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(23,33,43,.03)}.instructions{border-left:5px solid var(--accent)}.video-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.video-head small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.pill.ready{border-color:#8fcab2;background:#eef8f3;color:#23664d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#41505a}input,textarea,select{width:100%;border:1px solid #cfd9dd;border-radius:10px;background:#fff;color:var(--ink);padding:10px 11px;outline:none}textarea{min-height:92px;resize:vertical}textarea.tall{min-height:150px}input:focus,textarea:focus,select:focus{border-color:#557b7e;box-shadow:0 0 0 3px rgba(85,123,126,.12)}.coach{background:var(--soft);border-radius:12px;padding:13px;margin:14px 0}.coach b{display:block;margin-bottom:4px}.tasks{display:grid;gap:8px}.task{display:flex;gap:9px;align-items:flex-start;font-weight:500;color:var(--ink)}.task input{width:auto;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:800;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.good{background:var(--good);color:#fff;border-color:var(--good)}.btn:disabled{opacity:.5;cursor:not-allowed}.empty,.error{padding:34px 20px;text-align:center}.error h1{font-size:30px}.error p{max-width:580px;margin:8px auto;color:var(--muted)}.notice{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:20}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:16px 0}.flow-step{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:3px}.flow-step b{font-size:12px}.flow-step small{color:var(--muted);line-height:1.35}.flow-step.active{border-color:var(--accent);box-shadow:inset 0 3px var(--accent)}.context{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.context div{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.context span{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.context b{display:block;margin-top:4px;font-size:13px}.feedback{border-left:5px solid var(--accent);background:#edf5f5}.feedback time{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
@media(max-width:700px){.shell{width:min(100% - 20px,980px);padding-top:18px}.top{display:block}.save-state{text-align:left;margin-top:10px}.grid,.context{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.full{grid-column:auto}.video-head{display:block}.pill{margin-top:8px}.actions .btn{flex:1 1 160px}}
 .chapter{border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0;background:#fbfcfc}.chapter-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:14px}.chapter-head span{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}.chapter-head h3{margin:4px 0;font-size:22px;letter-spacing:-.025em}.chapter-head p{margin:0;color:var(--muted);max-width:620px}.field small{font-weight:500;color:var(--muted);line-height:1.35}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px 0}.checks label{display:flex;align-items:center;gap:7px;font-weight:500;color:var(--ink)}.checks input{width:auto}.flow{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.flow-step{background:transparent;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.flow-step span{display:block;font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.08em}.flow-step.active{background:#edf5f5}.flow-step:hover{border-color:#557b7e}@media(max-width:700px){.chapter-head{display:block}.chapter-head .btn{margin-top:10px}.checks{grid-template-columns:1fr}}
.guide{margin:16px 0 20px}.guide-head{display:grid;gap:2px;margin:0 0 10px}.guide-head span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:900;color:var(--accent)}.guide-head b{font-size:15px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.choice:hover{border-color:#557b7e;box-shadow:0 2px 10px rgba(35,79,82,.08)}.choice.selected{border:2px solid var(--accent);background:#edf5f5}.choice>div{display:flex;justify-content:space-between;gap:10px}.choice strong{font-size:14px}.choice em{font-size:10px;font-style:normal;font-weight:900;color:var(--accent);white-space:nowrap}.choice p{font-size:12px;line-height:1.4;margin:7px 0;color:var(--muted)}.choice small{display:block;font-size:11px;line-height:1.38;margin:6px 0}.choice details{font-size:11px;margin-top:8px}.choice summary{font-weight:800;color:var(--accent)}.choice ol{padding-left:18px;margin:7px 0 0}.package-block>h4{font-size:16px;margin:22px 0 5px}
@media(max-width:700px){.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="creator-portal" class="shell"><div class="card empty"><b>Loading your creator workspace…</b></div></main>
<script src="/ui/creator-portal.js" defer></script>
</body>
</html>
