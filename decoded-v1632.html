viewers respond to vs returning viewers?","What else does this audience watch?","What do they ask for next?"],"steps":["Collect audience language into a living bank.","Cluster questions into problems, desires, beliefs and decisions.","Separate surface questions from deeper motivations.","Compare new/returning audience behavior where available.","Use polls or direct questions to test uncertain assumptions."],"output":"Audience-language bank, problem/desire clusters, belief map, next-question map and evidence for content/offer decisions.","change":"Can change exact viewer, topic, title wording, hook, Trust angle, lead magnet, CTA or offer positioning.","avoid":"Treating vocal commenters as the whole audience or rewriting their language into internal marketing jargon.","lens":"Colin & Samir · Tim Schmoyer · YouTube"},"Direct-niche outliers":{"what":"Find videos in the same niche that dramatically outperform the normal baseline of the channel that published them.","use":"Use for Reach ideation, topic validation, packaging research and finding proven formats for the same audience.","questions":["Which videos are genuinely abnormal for that channel?","What changed: topic, promise, format, timing, guest or package?","What patterns repeat across several outliers?","What is transferable vs unique to that creator?"],"steps":["Build a list of relevant channels.","Compare each candidate to that channel’s usual performance.","Capture topic, title, thumbnail, promise, structure and opening.","Cluster repeated winning patterns.","Translate the underlying mechanism instead of copying the surface execution."],"output":"A shortlist of validated topic and format opportunities, each with evidence and a clear reason it may transfer.","change":"Can change idea priority, archetype, title direction, thumbnail strategy and whether an idea deserves production resources.","avoid":"Using absolute views instead of relative outlier performance or assuming every outlier is repeatable.","lens":"Paddy Galloway · Richard Do / 1of10 · Nate Black"},"Adjacent-niche formats":{"what":"Study proven formats in nearby categories whose audiences share similar motivations, problems, status goals or viewing behavior.","use":"Use when direct competitors feel repetitive and you need a fresh but still audience-relevant format.","questions":["Which neighboring audiences share our viewer psychology?","What repeatable formats work there?","What is the format after removing the topic?","How can that format express our creator’s topic and voice?"],"steps":["Map several adjacent categories.","Collect their outliers and repeatable shows.","Name the underlying format independently of topic.","Remix that format around a topic already validated for our audience.","Pressure-test whether the result still feels native to the creator."],"output":"A transferable format library plus remixed concepts that feel familiar enough to click and fresh enough to stand out.","change":"Can change archetype, packaging, structure, series design and production layout.","avoid":"Importing formats just because they look cool or copying aesthetics without the viewing mechanism.","lens":"Paddy Galloway · Richard Do · Jake Thomas"},"Outside-niche inspiration":{"what":"Study successful videos far outside the niche to identify transferable curiosity, tension, proof and storytelling mechanisms.","use":"Use for browse-led Reach, creative expansion, format innovation and differentiated series concepts.","questions":["What makes this video interesting before considering the topic?","Is the engine challenge, access, transformation, experiment, ranking, mystery, investigation or comparison?","What survives if we transplant that engine into our audience’s world?"],"steps":["Collect breakout videos across unrelated categories.","Describe each in abstract format language.","Identify its emotional engine and proof requirement.","Rebuild the concept around our audience problem/desire.","Validate the remix with niche and audience evidence before production."],"output":"A bank of transferable format mechanisms and high-novelty concepts grounded back into audience relevance.","change":"Can create new series, browse concepts, thumbnail language and fresh production approaches.","avoid":"Random inspiration with no audience fit or imitating spectacle the creator cannot credibly execute.","lens":"Paddy Galloway · Richard Do"},"Search / explicit intent":{"what":"Research exact questions, problems and decisions viewers already express through search and high-intent language.","use":"Use for problem-aware Reach, evergreen discovery, beginner content, FAQs and evergreen lead assets.","questions":["What would the viewer literally type?","What stage of awareness does the query imply?","What outcome sits behind the words?","Where are current results weak, old, vague or poorly packaged?","Does this query naturally connect to the next problem or offer?"],"steps":["Collect search suggestions, recurring queries and audience wording.","Review current results for promise, format, freshness and gaps.","Separate informational intent from buyer intent.","Choose search-led vs search+curiosity packaging.","Answer the query quickly before expanding."],"output":"Validated query, intent, content gap, package direction and natural continuation.","change":"Can change wording, title structure, hook, depth, CTA and whether the asset is Reach-only or Reach+Convert.","avoid":"Keyword stuffing, chasing volume with wrong audience fit, or withholding the answer too long.","lens":"Sean Cannell · Aprilynne Alter · Anthony Ambriz"},"Packaging-pattern research":{"what":"Study topic demand, title formulas and thumbnail concepts as separate variables so packaging is built from evidence rather than taste.","use":"Use before scripting/filming competitive videos, especially Reach and browse-led concepts.","questions":["Is the topic itself proven?","Which title formulas repeatedly work?","Which visuals communicate the promise in one glance?","What emotion drives the click?","What assets must be captured during production?"],"steps":["Collect a broad reference set instead of one thumbnail to copy.","Separate topic evidence from title formula and visual concept.","Generate multiple title directions and thumbnail concepts.","Check title-thumbnail complement and promise integrity.","Define a test hypothesis and production asset list."],"output":"Chosen package direction, alternates, visual asset list, title rationale and test hypothesis.","change":"Can change the idea, filming plan, opening, promise and A/B testing plan.","avoid":"Designing packaging after filming, copying literally, or optimizing CTR without delivering the promise.","lens":"Jake Thomas · Paddy Galloway · Seb Losardo · Chucky Appleby"},"Story / proof research":{"what":"Collect the stories, examples, receipts, demonstrations, mechanisms and visual evidence needed to make the video believable and satisfying.","use":"Use heavily for Trust, case studies, POV, transformations, investigations, masterclasses and high-consideration Convert videos.","questions":["What claims require proof?","What story makes the idea human?","What can be shown instead of explained?","Which example makes the contrast obvious?","Where are the turns and payoffs?","What would a skeptical viewer need to see?"],"steps":["List each major claim.","Attach proof, example or demonstration where useful.","Collect stories with stakes and turns.","Identify visual evidence and required footage/screens.","Sequence evidence so it unfolds instead of becoming a data dump."],"output":"Proof map, story bank, evidence assets, reveals and payoff sequence.","change":"Can change hook, structure, production plan, retention, credibility and CTA timing.","avoid":"Claims without receipts, generic anecdotes, proof dumping or using editing as a substitute for substance.","lens":"Ed Lawrence · George Blackman · Hayden Hillier-Smith · Mario Joos"},"Buyer research":{"what":"Research the uncertainties, objections and decision criteria that stop an interested viewer from taking a business action.","use":"Use for Convert videos, buyer FAQs, comparisons, pricing/ROI, case studies, webinars and service/product walkthroughs.","questions":["What does a qualified buyer ask right before acting?","Why do deals stall or get lost?","What alternatives are they comparing?","What are they afraid will go wrong?","What proof reduces risk?","Who is genuinely a bad fit?"],"steps":["Mine sales calls, support, DMs, comments, surveys and lost-deal notes.","Cluster objections by price, time, risk, trust, fit, complexity and alternatives.","Separate valid concerns from misunderstandings.","Attach evidence/process transparency to each.","Map each objection to a video archetype and next action."],"output":"Buyer-question library, objection map, proof requirements, fit criteria and a conversion-content backlog.","change":"Can change Convert topics, offer positioning, service explanation, CTA, sales enablement and lead quality.","avoid":"Inventing objections internally, arguing with buyers or turning every answer into a hard pitch.","lens":"Tim Schmoyer · Sean Cannell · Tintin Smith"},"Catalogue / post-publish evidence":{"what":"Study how published videos behave over time and convert performance evidence into future decisions.","use":"Use in Learn, Diagnosis and monthly reviews, especially once a channel has a meaningful back catalogue.","questions":["Which old videos still acquire new viewers?","Which create returning behavior?","Which assist leads or sales?","What do intro retention, top moments, spikes and dips reveal?","Which winners deserve follow-up or repackage?","Which packaging hypotheses actually won?"],"steps":["Review at defined checkpoints rather than constantly.","Compare by job, format, traffic source and realistic baseline.","Record what happened → what it may mean → what changes next.","Route learning to audience, idea, package, structure, CTA, offer or format.","Mine older winners before defaulting to net-new concepts."],"output":"Reusable learning objects, follow-up backlog, packaging learnings, catalogue opportunities and next-decision recommendations.","change":"Can update Creator Strategy, Diagnosis, roadmap, monthly portfolio, next video, packaging rules and business path.","avoid":"Reporting without decisions, overreacting to early noise or ignoring old content because it is not recent.","lens":"Safwaan Mohammed · Dan Lambert · Derral Eves · YouTube"}},"archetypes":{"How-To":{"what":"A problem-solving video that helps the viewer perform a specific task or reach a concrete result.","best":"Clear practical problems, explicit intent, repeatable processes, skill-building, searchable questions.","secondary":"Trust when the teaching reveals expertise; Convert when the tutorial naturally demonstrates a paid solution.","viewer":"Usually new or problem-aware. They already know what they want to accomplish.","research":"Exact query language, audience questions, current top-performing tutorials, common failure points, competing methods, proof your method works.","structure":"Desired result → starting point → steps → common mistake → proof/check → application.","packaging":"Lead with the result or exact problem. Search-led when the viewer knows the phrase; browse-led when a surprising shortcut, mistake, or constraint creates curiosity.","hooks":"Clear goal; problem recognition; proof-first demonstration; contradiction when the usual method is wrong.","formats":"Long-form, Short for one tactic, Live for walkthrough/Q&A, Series for progressive skill-building.","layouts":"Talking head + demo, screen recording, whiteboard, overhead/field demonstration, hybrid.","cta":"Continue into the next problem created by the result, or a practical resource that makes implementation easier.","metrics":"Search/browse discovery, CTR by traffic source, first-30-second match, retention through steps, new viewers, next-video clicks.","avoid":"Generic intros, teaching before relevance, too many steps, hiding the first useful payoff, title promising more than the tutorial delivers.","formula":"How to [RESULT] Without [COMMON PAIN] · [TASK] Step by Step · The [METHOD] I Use to [RESULT]"},"Start Here":{"what":"An orientation video for someone entering a topic, problem, diagnosis, skill, or category for the first time.","best":"Beginners, newly problem-aware viewers, confusing categories, channels that need a clear entry point.","secondary":"Trust because good orientation demonstrates judgment and reduces overwhelm.","viewer":"Cold/new and often overwhelmed. They need sequence more than depth.","research":"First questions, confusing terminology, early mistakes, what beginners over-focus on, what experts wish beginners knew first.","structure":"Where you are → what matters first → what to ignore → first 3–5 moves → first milestone → what comes next.","packaging":"Signal the starting point explicitly: Start Here, Beginner, First, Before You…, Newly Diagnosed, New to….","hooks":"“You do not need to learn everything yet”; clear first milestone; remove overwhelm immediately.","formats":"Long-form orientation, Short checklist, playlist opener, Live beginner workshop.","layouts":"Talking head + simple graphics, checklist, whiteboard roadmap, screen examples.","cta":"Next lesson in sequence, beginner checklist, starter playlist, onboarding resource.","metrics":"New viewers, search/browse discovery, retention through orientation, playlist continuation, returning-viewer conversion.","avoid":"Dumping the entire field into one video, jargon, advanced tangents, giving ten equal priorities.","formula":"If You’re New to [TOPIC], Start Here · The Beginner Roadmap to [RESULT] · Before You [ACTION], Understand These 3 Things"},"Mistakes":{"what":"A tension-led teaching format built around errors the viewer may already be making and the consequences of those errors.","best":"Avoidable risk, beginner/intermediate education, audits, costly errors, behavioral correction.","secondary":"Trust through diagnosis; Convert when the mistakes reveal a need for a better process, tool, or service.","viewer":"Problem-aware and often unaware that their current behavior is the cause.","research":"Recurring errors in comments, coaching, support, sales calls, forums, competitor videos; actual consequence and correction for each.","structure":"Mistake → consequence → why it happens → correction → priority.","packaging":"Specific mistake + real consequence. “5 Mistakes” works better when the audience and stakes are explicit.","hooks":"Call out the recognizable behavior; show the consequence; reveal that a common “best practice” is causing the issue.","formats":"Long-form list, Short single mistake, audit/teardown, Live review.","layouts":"Talking head + examples, before/after, red/green comparisons, screen/field teardown.","cta":"Correct process, checklist, deeper tutorial, or next mistake in the sequence.","metrics":"CTR, first-30-second retention, chapter dips, comments/self-identification, next-video movement.","avoid":"Fear without evidence, vague mistakes, equal weighting of trivial and serious errors, shaming the viewer.","formula":"[NUMBER] Mistakes [AUDIENCE] Make With [TOPIC] · Stop Doing This If You Want [RESULT] · The [MISTAKE] Costing You [STAKE]"},"Explainer":{"what":"A mechanism-first video that answers why something happens or how a system works.","best":"Complex topics, misunderstood mechanisms, conceptual education, technical/business/health explanations.","secondary":"Trust when the creator’s model is clearer than generic advice.","viewer":"Curious/problem-aware and looking for understanding before action.","research":"Primary/credible sources, mechanism, misconceptions, analogies, competing explanations, real examples.","structure":"Observation/problem → mechanism → example → implication → what to do.","packaging":"Use the surprising mechanism or consequence as the click reason rather than “Explained.”","hooks":"Contradiction; surprising cause; visible symptom with hidden mechanism.","formats":"Long-form, animated Short, whiteboard, documentary explainer.","layouts":"Whiteboard, diagrams, animation, talking head + graphics, voiceover essay.","cta":"Application video, deeper framework, or next implication of the mechanism.","metrics":"Discovery, retention through explanation, spikes/rewatches, comments indicating understanding.","avoid":"Academic dumping, weak analogies, too much context before the central mechanism.","formula":"Why [PROBLEM] Actually Happens · The Real Reason [OUTCOME] Keeps Happening · [SYSTEM] Explained Without the Jargon"},"Myth/Reframe":{"what":"A belief-change video that challenges a dominant assumption and replaces it with a more useful model.","best":"Outdated advice, misconceptions, counterintuitive expertise, category education, POV differentiation.","secondary":"Trust because belief change reveals judgment and worldview.","viewer":"Problem-aware, often carrying a strong existing belief.","research":"Dominant belief, why it persists, evidence against it, counterarguments, edge cases, replacement model.","structure":"Common belief → contradiction → evidence → better model → implications/application.","packaging":"Make the old belief and new tension obvious without overstating certainty.","hooks":"“Everyone tells you X, but…”; proof that the old model breaks; unexpected result.","formats":"Long-form, Short myth-bust, commentary, whiteboard.","layouts":"Talking head, evidence/screens, whiteboard, side-by-side examples.","cta":"Behavior/framework that follows from the new belief.","metrics":"CTR, retention through reveal, comments/debate quality, shares, returning viewers.","avoid":"Contrarianism for its own sake, straw-man arguments, certainty beyond the evidence.","formula":"[COMMON ADVICE] Is Wrong for [AUDIENCE] · Stop Thinking About [TOPIC] Like This · The Truth About [BELIEF]"},"Comparison":{"what":"A decision-support video that evaluates two or more options against meaningful criteria.","best":"Tools, methods, strategies, services, products, career/business choices.","secondary":"Convert for high-intent buyers; Trust when the creator’s judgment is the value.","viewer":"Problem-aware and choosing between options.","research":"Real decision criteria, cost, constraints, hands-on evidence, use cases, who each option is actually for.","structure":"Options → criteria → evidence → trade-offs → recommendation by fit.","packaging":"Name the real decision and the dimension that changes the answer. Avoid fake universal winners.","hooks":"Decision callout; surprising trade-off; show where the obvious winner loses.","formats":"Long-form, Short verdict, Live comparison/demo.","layouts":"Side-by-side demo, table/whiteboard, screen recording, talking head.","cta":"Next decision or fit-based product/service path.","metrics":"High-intent search, CTR, retention at verdict, clicks, qualified actions.","avoid":"Biased criteria, hidden sponsorship logic, superficial pros/cons, universal recommendations.","formula":"[A] vs [B]: Which Is Better for [AUDIENCE]? · I Tested [A] and [B] — Here’s Who Should Choose Each"},"Ranking":{"what":"A prioritized evaluation of multiple options, usually organized around a clear scoring or use-case system.","best":"Tools, resources, options, tactics, products, “best for” discovery.","secondary":"Convert when the audience is actively selecting a purchase.","viewer":"New or high-intent depending on topic.","research":"Current options, criteria, real testing, exclusions, price/features, audience-specific use cases.","structure":"Criteria → shortlist → ranked evaluation → best by use case → recommendation.","packaging":"Specific audience + result beats generic “Top 10.”","hooks":"Reveal criteria; tease an unexpected winner/loser; show why common rankings are misleading.","formats":"Long-form, Short top-3, recurring annual/update series.","layouts":"Host + scorecards, demos, visual tier list, screen/product footage.","cta":"Deep review/comparison or best-fit next step.","metrics":"Search/browse views, retention through rank progression, product/resource clicks.","avoid":"Arbitrary ranking, filler items, ranking without a viewer use case.","formula":"The Best [TOOLS] for [AUDIENCE] Ranked · I Tested [NUMBER] [OPTIONS] — Only These Are Worth It"},"Review":{"what":"An evidence-based evaluation of a product, service, tool, book, course, or experience after use/testing.","best":"Purchase research, new releases, tools/products with real usage differences.","secondary":"Convert and Trust.","viewer":"Problem-aware to high-intent.","research":"Buyer criteria, specs vs lived use, alternatives, current price/features, common questions.","structure":"Expectation → test/use → strengths → weaknesses → fit → verdict.","packaging":"Lead with the decision, surprise, or real-world outcome, not just “Review.”","hooks":"Unexpected limitation; proof-first result; “who should not buy this.”","formats":"Long-form, Short verdict, Live hands-on.","layouts":"Hands-on demo, screen capture, B-roll, talking head.","cta":"Comparison/watch-next for colder viewers; transparent purchase path for high intent.","metrics":"Search discovery, verdict retention, affiliate/product clicks, qualified comments.","avoid":"Spec-sheet reading, no testing, fake positivity, unclear disclosure.","formula":"I Used [PRODUCT] for [TIME] — Here’s the Truth · Is [PRODUCT] Actually Worth It for [AUDIENCE]?"},"Reaction":{"what":"A timely or familiar source is used as the entry point for expert interpretation, diagnosis, or commentary.","best":"Trends, public examples, industry claims, viral clips, mistakes, new developments.","secondary":"Trust when the expert lens is the real value.","viewer":"New or warm depending on source familiarity.","research":"Original source, factual verification, audience reactions, creator expertise, counterarguments.","structure":"Claim/example → reaction → diagnosis → evidence → better interpretation/action.","packaging":"The source creates familiarity; the creator’s lens creates differentiation.","hooks":"Strong clip/claim first; immediate expert diagnosis; contradiction.","formats":"Long-form, Short, Live reaction.","layouts":"Picture-in-picture, screen share, clips + commentary, talking head.","cta":"Deeper framework or related teaching.","metrics":"Browse/suggested discovery, retention around reaction turns, comments, returning viewers.","avoid":"Reacting without adding expertise, copyright misuse, outrage farming, no synthesis.","formula":"Expert Reacts to [CLAIM/EVENT] · What Everyone Is Missing About [TREND]"},"Experiment":{"what":"A video built around testing a claim, method, routine, product, or assumption and observing what happens.","best":"Curiosity, proof, process, product tests, routines, claims.","secondary":"Trust and Convert when the test establishes credibility or product value.","viewer":"New/curious and outcome-oriented.","research":"Testable question, baseline, method, variables, fairness, proof standard, existing claims.","structure":"Question → method → test → unexpected finding → result → implication.","packaging":"The active question is the click. Do not call informal testing “scientific” unless it is.","hooks":"Start the test immediately; show baseline; tease unexpected result.","formats":"Long-form, Short single test, series of experiments.","layouts":"Documentary/test footage, screen capture, graphs, before/after.","cta":"Application, follow-up test, or winning method/product.","metrics":"Retention around reveals, shares, browse views, product clicks where relevant.","avoid":"No baseline, rigged tests, cherry-picked evidence, weak payoff.","formula":"I Tried [METHOD] for [TIME] — Here’s What Happened · I Tested [CLAIM] So You Don’t Have To"},"Challenge":{"what":"A goal-driven journey with a visible finish line, constraints, obstacles, and a measurable result.","best":"Transformations, builds, skill acquisition, time-bound experiments, public goals.","secondary":"Trust because viewers experience the creator’s process and personality.","viewer":"New or returning; drawn by the outcome and journey.","research":"Goal, rules, baseline, obstacles, stakes, proof criteria, comparable challenges.","structure":"Goal → rules → attempts → obstacle → adjustment → result → lesson.","packaging":"Make the finish line and constraint obvious.","hooks":"State the goal and stakes instantly; show baseline or deadline.","formats":"Long-form, series, Short progress updates.","layouts":"Vlog/documentary, progress graphics, field footage, narration.","cta":"Next challenge, deeper method, series episode.","metrics":"Retention through milestones, browse views, episode continuation, returning viewers.","avoid":"No meaningful stakes, fake obstacles, slow setup, result not proven.","formula":"I Tried to [RESULT] in [TIME] · Can I [GOAL] Without [CONSTRAINT]?"},"Investigation":{"what":"A research-led video that follows evidence toward an answer to a central mystery, contradiction, or complex question.","best":"Industry myths, controversies, mechanisms, business breakdowns, “what is really happening?”","secondary":"Trust through rigorous reasoning.","viewer":"Curious, often broader than the creator’s usual audience.","research":"Primary documents, multiple sources, chronology, competing explanations, interviews/data.","structure":"Question → evidence trail → discoveries → contradictions → conclusion → unresolved implication.","packaging":"Central mystery, contradiction, character, or consequence.","hooks":"Cold-open evidence; provocative question; anomaly that needs explaining.","formats":"Long-form, documentary essay, series.","layouts":"Voiceover essay, documentary, interviews, screen evidence, timeline.","cta":"Related investigation or deeper framework.","metrics":"Long-form retention, spikes, shares, browse/suggested, subscriber lift.","avoid":"Predetermined conclusion, weak sourcing, too much exposition before the mystery.","formula":"What’s Really Happening With [TOPIC]? · I Investigated [CLAIM] — Here’s What I Found"},"Transformation":{"what":"A video centered on a meaningful before-and-after change and the process/mechanism that caused it.","best":"Fitness, business, skill, design, coaching, makeovers, performance, case proof.","secondary":"Trust and Convert.","viewer":"New to high-intent depending on whether the transformation is personal or customer-based.","research":"Baseline, target state, timeline, process, proof, limitations/confounders.","structure":"Before → goal → process → setbacks → after → mechanism → what can be copied.","packaging":"Make the before/after contrast real and verifiable.","hooks":"Show the before and result; state the constraint or timeline.","formats":"Long-form, documentary, Short reveal, series.","layouts":"Matched before/after visuals, data, timeline, B-roll.","cta":"Deeper process for Trust; fit-based offer for Convert.","metrics":"CTR, retention to reveal, comments, leads/sales if offer-linked.","avoid":"Unverifiable claims, hiding timeframe, result-only with no mechanism.","formula":"How [SUBJECT] Went From [BEFORE] to [AFTER] · I Changed [THING] for [TIME] — The Result Surprised Me"},"Documentary":{"what":"A narrative-led, researched viewing experience built around a character, question, transformation, culture, or real-world story.","best":"Big ideas, history, profiles, business stories, investigations, differentiated creator POV.","secondary":"Trust through depth and worldview.","viewer":"Often broad/new when the premise is strong.","research":"Primary/secondary sources, chronology, interviews, visual evidence, thesis, counterarguments.","structure":"Cold open/question → context → escalating evidence → turns → thesis/conclusion → meaning.","packaging":"Compelling question, contradiction, character, result, or consequence.","hooks":"Story in motion; unanswered question; startling evidence.","formats":"Long-form, series, podcast-video hybrid in some cases.","layouts":"Voiceover + B-roll, interviews, archival, motion graphics.","cta":"Soft next-watch continuation or series.","metrics":"Watch time, retention through turns, shares, subscribers, returning viewers.","avoid":"Pretty B-roll without story, weak thesis, slow context, no escalation.","formula":"The Untold Story of [SUBJECT] · How [SUBJECT] Became [OUTCOME] · Inside [WORLD/PROCESS]"},"Collaboration":{"what":"A video designed around two or more creators/experts whose audiences, expertise, or personalities create additional value together.","best":"Audience crossover, complementary expertise, shared challenges, guest authority.","secondary":"Trust through authority transfer and relationship.","viewer":"New viewers from either creator’s audience.","research":"Audience overlap, strongest shared topics, guest’s underused stories/knowledge, proven collab formats.","structure":"Shared problem → contrasting perspectives → proof/stories → synthesis/result.","packaging":"Topic/value first unless the guest name itself creates demand.","hooks":"Immediate joint premise; tension between viewpoints; shared challenge.","formats":"Long-form, Live, podcast, challenge, Short collab.","layouts":"Interview, joint tutorial, on-location challenge, split-screen, roundtable.","cta":"Related episode, collaborator’s adjacent idea, creator’s deeper resource.","metrics":"New viewers, collaborator-sourced discovery, subscribers, cross-channel lift.","avoid":"Guest-only packaging with no premise, audience mismatch, generic conversation.","formula":"I Asked [EXPERT] to Solve [PROBLEM] · [CREATOR A] vs [CREATOR B]: [CHALLENGE] · We Tried [THING] Together"},"Personal Story":{"what":"A real lived story used to create emotional connection, credibility, or a useful lesson.","best":"Turning points, hard-earned lessons, identity, vulnerability with practical relevance.","secondary":"Reach when the stakes/turn are broadly compelling.","viewer":"Warm/returning, though strong story premises can reach cold viewers.","research":"Real conflict, stakes, timeline, what changed, receipts/details, viewer-relevant lesson.","structure":"Normal state → conflict → low point/decision → turn → result → viewer lesson.","packaging":"Lead with tension or transformation, not “my story.”","hooks":"Story in motion; consequential moment; surprising admission.","formats":"Long-form, Short story, podcast segment.","layouts":"Direct-to-camera, cinematic B-roll, archival, locations.","cta":"Next belief/skill the story makes relevant.","metrics":"Retention through turn, comments, shares, subscribers, returning viewers.","avoid":"Self-focused biography, no viewer application, fake vulnerability.","formula":"The Moment I Realized [BELIEF] · I Almost [CONSEQUENCE] — Here’s What Changed"},"Failure/Lesson":{"what":"A credibility-building story that examines what failed, why it failed, and what changed afterward.","best":"Hindsight, mistakes, leadership, business, creative process, “what I’d do differently.”","secondary":"Reach when the failure is high-stakes or surprising.","viewer":"Warm or curious new viewers.","research":"Actual failure, causal factors, evidence, consequences, changed behavior.","structure":"Goal → failure → why → lesson → changed behavior → viewer application.","packaging":"Specific failure + consequence.","hooks":"Admit the failure quickly; show the cost; reveal the mistaken assumption.","formats":"Long-form, Short lesson, podcast/story segment.","layouts":"Talking head + receipts/screens, timeline, examples.","cta":"Corrected process, deeper framework, next lesson.","metrics":"Comment depth, retention at lesson, returning viewers, lead movement.","avoid":"Humblebragging, vague lessons, blaming external factors only.","formula":"I Got [THING] Completely Wrong · The [DECISION] I Regret Most · What [FAILURE] Taught Me About [TOPIC]"},"POV":{"what":"A belief/position video that makes the creator’s judgment and worldview explicit.","best":"Leadership, expert opinion, identity, controversial-but-defensible positions, category differentiation.","secondary":"Reach when the belief tension has broad curiosity.","viewer":"Warm or problem-aware.","research":"Common/old belief, creator experience, evidence, counterarguments, replacement principle.","structure":"Old/common belief → conflict/evidence → new belief → implications.","packaging":"State the tension between the familiar model and the creator’s view.","hooks":"Contradiction; “I used to believe…”; direct thesis with proof tease.","formats":"Long-form, Short, commentary, podcast segment.","layouts":"Talking head, whiteboard, evidence/examples.","cta":"Behavior/framework that follows from the POV.","metrics":"Returning viewers, comments, shares, subscriber conversion.","avoid":"Hot take without evidence, generic motivational opinion, no practical implication.","formula":"I Don’t Believe [COMMON ADVICE] Anymore · The Way We Think About [TOPIC] Is Backwards"},"Behind the Scenes":{"what":"Access-led content showing how work is actually done, including standards, trade-offs, decisions, and friction.","best":"Craft, teams, systems, production, service delivery, creator businesses.","secondary":"Reach when the process/access is unusual.","viewer":"Warm/returning; sometimes new via access curiosity.","research":"Which decisions reveal competence/values, visual moments, tension, what can safely be shown.","structure":"Goal → process → decisions → problem → adjustment → finished result → lesson.","packaging":"Anchor BTS to a result, access, constraint, or hidden process.","hooks":"Show the unusual access/process immediately; state the day/project objective.","formats":"Long-form, vlog, Short peek, series.","layouts":"On-location, screen capture, team footage, voiceover.","cta":"Finished work, process guide, next BTS episode.","metrics":"Returning viewers, watch time, comments, subscriber conversion.","avoid":"Aimless footage, “come hang out” without a premise, hiding all meaningful decisions.","formula":"Inside How We [RESULT] · Behind the Scenes of [PROJECT/EVENT] · What It Actually Takes to [OUTCOME]"},"Day in the Life":{"what":"A day-based narrative where the schedule is a container for a goal, identity, access, or problem-solving journey.","best":"Creator-led brands, routines, lifestyle proof, high-affinity audiences.","secondary":"Reach when the day has unusual access or a compelling goal.","viewer":"Warm/returning.","research":"Viewer-relevant moments, goal/tension for the day, recurring decisions, visual variety.","structure":"Day goal → sequence → friction → decision → outcome → reflection.","packaging":"The day needs a reason to care beyond “a day in my life.”","hooks":"What makes today different? Goal, deadline, event, transformation, access.","formats":"Long-form vlog, Short moments, recurring series.","layouts":"Vlog, on-location, time cards, narration.","cta":"Another episode, routine, resource, community.","metrics":"Returning viewers, AVD, series continuation, comments.","avoid":"No goal/tension, excessive mundane detail, diary without viewer value.","formula":"A Day in My Life While [GOAL/CONSTRAINT] · What My Day Actually Looks Like as a [IDENTITY]"},"Process Breakdown":{"what":"A transparent walkthrough of how the creator actually performs a workflow and makes key decisions.","best":"Systems, expertise, operations, creative process, business workflows.","secondary":"Reach and Convert.","viewer":"Warm/problem-aware.","research":"Actual workflow, artifacts, decision criteria, trade-offs, bottlenecks, before/after.","structure":"Goal → workflow map → critical decisions → example → failure point → result.","packaging":"“How I actually…” works when process transparency is the value.","hooks":"Show finished result or surprising process step first.","formats":"Long-form, screen-led, whiteboard, Live.","layouts":"Talking head + screen, whiteboard, on-location process.","cta":"Template/system, next process, qualified offer.","metrics":"Retention, returning viewers, template opt-ins, qualified leads.","avoid":"Fake “secret sauce,” abstract explanation without artifacts, too much tool detail.","formula":"How I Actually [PROCESS] · Inside My [SYSTEM] for [RESULT] · My Exact Process for [OUTCOME]"},"Masterclass":{"what":"A high-depth teaching asset organized around one meaningful transformation or competency.","best":"Authority, nuanced frameworks, high-value evergreen education, workshop-style content.","secondary":"Reach when topic demand is strong; Convert when it bridges to implementation.","viewer":"Warm/problem-aware and willing to invest time.","research":"Learning outcome, prerequisites, primary sources, examples, misconceptions, exercises.","structure":"Promise → mental model → modules → examples → synthesis → application.","packaging":"One transformation, not “everything about X.”","hooks":"Outcome and why common approaches fail; roadmap preview.","formats":"Long-form, Live workshop, webinar, course module.","layouts":"Talking head + slides, whiteboard, screen demos, chapters.","cta":"Next module, worksheet, workshop, course/offer when qualified.","metrics":"Watch time, chapter retention, returning viewers, opt-ins, downstream conversions.","avoid":"Overlong intro, no progression, information dumping, weak examples.","formula":"The Complete [TOPIC] Masterclass for [AUDIENCE] · Learn [RESULT] From Start to Finish"},"Whiteboard":{"what":"A reasoning-led video that uses a visual model, map, calculation, or diagram to make an abstract idea concrete.","best":"Business, finance, strategy, mechanisms, comparisons, decision frameworks.","secondary":"Reach and Convert.","viewer":"Problem-aware/warm.","research":"Framework logic, examples, edge cases, proof, decision it helps solve.","structure":"Problem → model → components → example → decision rule → application.","packaging":"Sell the decision or transformation, not “whiteboard.”","hooks":"Draw/show the model immediately; expose the surprising relationship.","formats":"Long-form, Live, Short single model.","layouts":"Physical/digital whiteboard, annotation, slides.","cta":"Apply the framework, assessment, resource, offer.","metrics":"Retention/rewatches, comments, leads, qualified actions.","avoid":"Tiny unreadable text, model without application, using the board as a lecture crutch.","formula":"The Simple Framework I Use to [RESULT] · I Drew [PROBLEM] on a Whiteboard — Here’s What It Revealed"},"Case Study":{"what":"A proof-led breakdown of a real situation showing the starting point, decisions/process, result, and what caused it.","best":"Trust when demonstrating reasoning; Convert when proving a mechanism/offer to a qualified buyer.","secondary":"Reach when the result/transformation itself creates broad curiosity.","viewer":"Warm to high-intent.","research":"Before state, goal, constraints, process, interventions, evidence, result, limitations, fit.","structure":"Context → problem → decisions → process → result → mechanism → lesson/fit.","packaging":"Lead with the transformation/result or unusual situation. The mechanism is the reason to stay.","hooks":"Proof first; before/after; “here’s what changed”; unexpected decision.","formats":"Long-form, documentary, interview, webinar proof segment.","layouts":"Talking head + data/screens, customer interview, timeline, whiteboard.","cta":"Trust use: replicate lesson/deeper process. Convert use: clarify fit and next action.","metrics":"Trust: retention, returning viewers, leads. Convert: qualified clicks/bookings/sales and sales-call references.","avoid":"Result with no causality, cherry-picking, making the offer the hero, no limitations.","formula":"How [SUBJECT] Went From [BEFORE] to [AFTER] · Inside the [PROCESS] That Produced [RESULT]"},"Audit":{"what":"An expert evaluation of a real example using explicit criteria, diagnosis, and prioritized fixes.","best":"Channels, websites, funnels, golf swings, businesses, designs, sales e · Ask Me Anything About [SPECIFIC TOPIC]"},"Build in Public":{"what":"A serialized journey where progress, decisions, setbacks, and evidence are shared as the creator builds toward a real goal.","best":"Businesses, products, skills, transformations, long projects.","secondary":"Reach when milestones/results are compelling.","viewer":"Returning/community.","research":"Baseline, milestones, stakes, public scorecard, obstacles, audience questions.","structure":"Current state → milestone → obstacle → decision → result → next milestone.","packaging":"Each episode needs its own tension/result, not just Episode 7.","hooks":"Current milestone/stakes first; what changed since last time.","formats":"Series, vlog, documentary, Shorts updates.","layouts":"Vlog/documentary, dashboards, screen, field footage.","cta":"Next episode, playlist, community/resource.","metrics":"Regular viewers, episode continuation, comments, community growth.","avoid":"Progress reports with no story, hiding failures, episode titles that require prior context.","formula":"Building [THING] From 0 to [GOAL] — Week [X] · We Hit [MILESTONE], Then This Happened"},"Recurring Show":{"what":"A repeatable content container with a recognizable premise, structure, or audience expectation.","best":"Building consistency, series identity, production efficiency, predictable viewer return.","secondary":"Reach or Convert depending on episode job.","viewer":"Returning with room for new viewers if each episode stands alone.","research":"Proven format patterns, episode-level demand, what stays constant vs changes, series continuation data.","structure":"Stable show skeleton + episode-specific tension and payoff.","packaging":"Keep format recognition while making every episode independently clickable.","hooks":"Re-establish premise fast; episode-specific stakes.","formats":"Series playlist, long-form, Live show, podcast.","layouts":"Consistent set/layout with episode-specific proof/visuals.","cta":"Next episode/playlist
