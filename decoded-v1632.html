 return `<section class="page"><div class="hero" style="padding-top:12px"><div><div class="kicker">Videos · ${esc(c.name)}</div><h1>The work for this creator.</h1><div class="actions"><button class="btn dark" data-view="plan">Open current month</button><button class="btn" data-action="add-video">+ Add video</button></div></div><div class="hero-side"><div class="known-row"><label>Current diagnosis</label><strong>${esc(c.currentConstraint||'Not run')}</strong></div><div class="known-row"><label>Active month</label><strong>${ensureQuarterPlan(c)?`Month ${ensureQuarterPlan(c).activeMonth} · ${esc(ensureQuarterPlan(c).months[ensureQuarterPlan(c).activeMonth-1]?.title||'')}`:'Not planned'}</strong></div><div class="known-row"><label>Planned slots</label><strong>${(c.month.slots||[]).filter(s=>s.videoId).length}/${(c.month.slots||[]).length}</strong></div></div></div><div class="rule"></div><div class="section-head"><div><div class="kicker">Current month</div><h2>Planned slots</h2></div></div>${monthSlotTable(c)}<div class="section-head"><div><div class="kicker">All videos</div><h2>${items.length} video${items.length===1?'':'s'}</h2></div></div><div class="subtabs">${['All',...PIPE,...JOBS].map(x=>`<button class="subtab ${filter===x?'active':''}" data-action="video-filter" data-filter="${x}">${x}</button>`).join('')}</div><div class="v12-video-list">${items.map(v=>{const s=VIDEO_FLOW[nextIncompleteVideoStep(v)],isPlanned=planned.has(v.id);return `<div class="v12-video-row" data-action="open-video" data-id="${v.id}"><div class="face">${isPlanned?'✓':'+'}</div><div><h4>${esc(v.package.finalTitle||v.package.workingTitle||v.title)}</h4><p>${esc(v.role||'Role not set')}${isPlanned?' · Current month':''}</p></div><div><span class="job-pill">${esc(v.job)}</span></div><div><p>${esc(v.stage)}</p></div><div><span class="eyebrow">Next</span><p>${esc(s[2])} · ${esc(s[3])}</p></div><div>→</div></div>`}).join('')||'<div class="empty-state">No matching videos.</div>'}</div></section>`
}
applyDiagnosis=function(c,constraint=null){__v11ApplyDiagnosis(c,constraint);c.v12PlanStep=1;state.view='plan';save();render();window.scrollTo(0,0)}
v11CompleteMonth=function(c,choice){
 const p=ensureQuarterPlan(c);if(!p)return;const i=p.activeMonth-1,cur=p.months[i];cur.status='complete';cur.snapshot=clone(c.month);cur.review=$('#v11CheckpointLearning')?.value||cur.review||'';
 if(p.activeMonth>=3){v12ArchivePlan(c,'Completed 90-day cycle');c.quarterPlan=null;c.currentConstraint='';c.diagnosis={index:0,answers:{},result:null,manual:false,applied:false,updatedAt:''};c.v12PlanStep=0;save();closeModal();state.view='plan';render();toast('90-day cycle complete · start a fresh diagnosis');return}
 p.activeMonth++;
 if(choice==='diagnose'){v12ArchivePlan(c,`Plan before Month ${p.activeMonth} re-diagnosis`);c.diagnosis={index:0,answers:{},result:null,manual:false,applied:false,updatedAt:''};c.currentConstraint='';c.v12PlanStep=0;state.view='plan';save();closeModal();render();window.scrollTo(0,0);return}
 v11ActivateMonth(c,p.activeMonth,false);c.v12PlanStep=2;save();closeModal();state.view='plan';render();window.scrollTo(0,0);if(choice==='adjust')setTimeout(()=>v11EditMonthModal(c,p.activeMonth),60);else toast(`Month ${p.activeMonth} activated`)
}
function v12HandleClick(e){const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,c=creator();if(!String(a).startsWith('v12-'))return;
 if(a==='v12-plan-step'){const i=Number(t.dataset.index);if(i<=v12PlanMax(c)){c.v12PlanStep=i;save();render();window.scrollTo(0,0)}return}
 if(a==='v12-plan-prev'){c.v12PlanStep=Math.max(0,v12PlanStep(c)-1);save();render();window.scrollTo(0,0);return}
 if(a==='v12-plan-next'){if(v12PlanGate(c).length)return toast('Finish the current decision first');if(v12PlanStep(c)>=V12_PLAN_STEPS.length-1){openView('home');return}c.v12PlanStep++;save();render();window.scrollTo(0,0);return}
 if(a==='v12-rediagnose'){if(c.quarterPlan)v12ArchivePlan(c,'Plan before manual re-diagnosis');restartDiagnosis(c);c.currentConstraint='';c.v12PlanStep=0;state.view='plan';save();render();window.scrollTo(0,0);return}
 if(a==='v12-strategy-human'){v12OpenHandoff('Creator strategy handoff',handoffFoundation(c),slug(c.name)+'-strategy.md');return}
 if(a==='v12-strategy-ai'){copyText(v12StrategyAI(c));toast('Strategy context copied for AI');return}
 if(a==='v12-plan-human'){v12OpenHandoff('90-day creator handoff',v12PlanHuman(c),slug(c.name)+'-90-day-plan.md');return}
 if(a==='v12-plan-ai'){copyText(v12PlanAI(c));toast('90-day plan context copied for AI');return}
 if(a==='v12-copy-handoff'){copyText(window.__v12Handoff?.text||'');return}
 if(a==='v12-download-handoff'){const h=window.__v12Handoff||{};download(h.filename||'accelerator-handoff.md',h.text||'');return}
 if(a==='v12-plan-history'){const hist=c.planHistory||[];openDrawer('Previous plan versions',hist.length?`<div class="v12-history-list">${hist.map((h,i)=>`<div class="v12-history-row"><div><h4>${esc(h.label||'Previous plan')}</h4><p>${fmtDate(h.savedAt)} · ${esc(h.diagnosis||'')}</p></div><button class="tinybtn" data-action="v12-open-history" data-index="${i}">Open →</button></div>`).join('')}</div>`:'<div class="empty-state">No previous versions yet.</div>');return}
 if(a==='v12-open-history'){const h=(c.planHistory||[])[Number(t.dataset.index)];if(h)v12OpenHandoff(h.label||'Previous plan',h.text||'',slug(c.name)+'-previous-plan.md');return}
}
document.addEventListener('click',v12HandleClick);
/* Normalize old Strategy tabs and re-render into the simplified architecture. */
try{state.creators.forEach(c=>{if(c.strategyTab==='flow'||c.strategyTab==='overview')c.strategyTab='snapshot';if(c.v12PlanStep==null)c.v12PlanStep=c.diagnosis?.applied?1:0});save()}catch{}
render();
})();
</script>

<script id="v13-guided-inputs-script">
(()=>{if(window.__v13GuidedInputs)return;window.__v13GuidedInputs=true;const __v12RenderStrategyDetail=renderStrategyDetail;
const GUIDE={
'strategy.audience':'Name the specific person or group this channel is trying to help. Specific enough that you can picture them.','strategy.channelGoal':'What should YouTube become better at doing for this creator over the next 90 days?','strategy.businessGoal':'Choose the main business result YouTube should support right now.','strategy.offer':'What is the clearest next step for a viewer who is ready for more help?','strategy.capacity':'Use the number you can sustain for 90 days without heroic effort.',
'audience.onePerson':'A quick shorthand for the person you have in mind. Example: “Dale, 60, wants golf to feel fun again.”','audience.situation':'What is true in their life or work right now when they find this channel?','audience.surfaceProblems':'What would they complain about out loud or type into YouTube?','audience.language':'Use their words, not marketer words. Pull phrases from comments, calls, DMs or search.','audience.immediateResult':'What useful win do they want soon, before the bigger transformation?','audience.stakes':'Why does solving this matter beyond the surface problem?','audience.lifeStage':'What season, role, age, experience level or circumstance changes how they think?','audience.trigger':'What happened recently that makes them care about this now?','audience.deeperProblem':'What is underneath the obvious problem?','audience.failedAttempts':'What have they already tried that did not fully work?','audience.fears':'What are they worried might happen if this stays unsolved?','audience.identityTension':'Who do they feel they are now, versus who they want to be?','audience.deeperDesire':'What do they really want this result to give them?','audience.desiredIdentity':'How do they want to feel or describe themselves after this works?','audience.trustNeeds':'What do they need to see or hear before they believe this creator?','audience.evidence':'What real evidence do we have for this audience insight?','audience.assumptions':'What are we currently guessing and should test?','audience.values':'What do they care about enough that it should shape tone, examples and recommendations?','audience.skepticism':'What might make them doubt the advice, creator or offer?','audience.beforeState':'Describe their real starting point before the channel helps.','audience.afterState':'Describe the practical and emotional state we want to move them toward.','audience.firstStep':'What is the first useful move they can realistically make?','audience.notFor':'Who should this channel deliberately not optimize for?',
'message.head':'What practical thing do they get better at, solve or achieve?','message.heart':'Why does that practical result matter emotionally or personally?','message.approach':'What is different about how this creator explains or solves the problem?','message.proof':'What makes this credible: experience, outcomes, credentials, demonstrations or case evidence?','message.belief':'What do you want the audience to believe after spending time with this channel?','message.channelPromise':'In one sentence, what can a returning viewer expect from this channel?','message.standAgainst':'What common approach, belief or behavior does this channel intentionally push against?','message.creed':'A short piece of language that captures the creator’s core worldview.','message.startingMoment':'What moment or experience made this perspective matter to the creator?','message.creationStory':'The relevant creator story that helps the audience understand why this channel exists.','message.banner':'Short enough to work on a channel banner. Lead with the viewer result, not the creator bio.','message.about':'A plain-language description of who this is for, what they get and how this creator helps.','message.ritualLine':'Optional recurring phrase that reinforces the channel identity without feeling forced.',
'business.path':'What happens after someone is ready for more? Map the simplest useful path from video to next step.','business.measurement':'What real behavior tells us YouTube is helping the business?','business.notes':'Anything important about the business path that should affect content decisions.','roadmap.destination':'What should be meaningfully different after 90 days if this plan works?','roadmap.hypothesis':'What do we currently believe will create that change?','roadmap.capability':'What skill should the creator or team get noticeably better at this quarter?','roadmap.system':'What repeatable process or operating system needs to improve?','month.outcome':'What does this month need to accomplish before you call it useful?','month.learningQuestion':'What important uncertainty should these videos help us answer?',
'viewer.state':'How much does this person already know before they click? New = they may barely know the problem or creator. Problem-aware = they know the problem and are looking for answers. Warm / returning = they already know the creator or topic. High-intent / buyer = they are actively comparing options or ready to act.','viewer.moment':'Describe the scene that makes them reach for YouTube. Use a real moment, not a demographic.','viewer.problem':'Write the problem the way they would say it, not as an expert diagnosis.','viewer.desire':'What do they want to be true after watching this video?','viewer.language':'Words or phrases you want the title, hook or examples to borrow.','research.notes':'What did the evidence change? Capture the conclusion, not your entire research process.','promise.viewer':'Who specifically is this promise for in this video?','promise.problem':'What are they trying to get away from or solve?','promise.result':'What concrete result should they expect from the click?','promise.mechanism':'What makes the explanation or method specific rather than generic?','package.workingTitle':'Write the strongest current title. It can still change as the thumbnail gets clearer.','package.finalTitle':'Only lock this when the title and thumbnail work together as one promise.','package.thumbnailConcept':'Describe the one visual idea the viewer should understand in a glance.','package.thumbnailText':'Optional. Use words only when the image cannot carry the idea by itself.','hook.draft':'Write the actual opening, not a summary. Confirm the click, create movement, then get useful.','structure.notes':'Turn the chosen progression into the actual beats, proof, examples, demos and transitions for this video.','cta.midDraft':'Keep it brief and connected to what the viewer just learned, then reopen the next beat.','cta.endDraft':'Finish the payoff first, then make one clear next move feel like the natural continuation.','cta.publishDate':'The planned publish date. This drives the review checkpoints on the Calendar.','cta.publishedUrl':'Add the live URL after publishing so learning and handoff records stay connected.','handoff.owner':'Who is responsible for moving this video through production next?','handoff.dueDate':'When should the production handoff be ready, not just when should the video publish?','handoff.assets':'List anything that must be captured before or during filming: thumbnail photos, proof, demos, B-roll, screenshots, objects or locations.','handoff.checklist':'Turn the structure and proof plan into the practical shots, sections and edit requirements.','handoff.notes':'Anything the creator or editor needs to know that is not obvious from the build above.','analytics.observe':'Facts only. What happened without explaining why yet?','analytics.interpret':'What is the simplest current explanation for those facts?','analytics.confidence':'How confident are you that this explanation is real rather than noise?','analytics.decision':'What should actually change because of what you learned?','analytics.route':'Where in the system should this learning go?','analytics.nextMove':'What is the next concrete action created by this learning?'};
function guide(path,label,type){if(GUIDE[path])return GUIDE[path];const l=String(label||'').toLowerCase();if(l.includes('url'))return'Paste the direct link you or the creator will actually use later.';if(l.includes('title'))return'Write the clearest useful version first. Polish it after the underlying decision is clear.';if(l.includes('notes'))return'Capture only what will matter when you come back to this decision later.';if(l.includes('date'))return'Use the real working date so the next checkpoint can surface automatically.';if(l.includes('owner'))return'Name the person who owns the next action, not everyone involved.';if(type==='select')return'Choose the option that best matches the current evidence. Change it later only if a later decision exposes a mismatch.';if(type==='textarea')return'Write enough to make the next decision easier. You do not need a polished paragraph.';return'Use the shortest clear answer that will still make sense when you return later.'}
field=function(label,path,value,opts={}){const {type='text',full=false,help='',placeholder='',scope='creator',rows=3,options=[]}=opts;const attr=`data-bind="${esc(path)}" data-scope="${scope}"`;let el='';if(type==='textarea')el=`<textarea ${attr} rows="${rows}" placeholder="${esc(placeholder)}">${esc(value||'')}</textarea>`;else if(type==='select')el=`<select ${attr}>${options.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;else if(type==='checkbox')el=`<label class="publish-check" style="margin:0"><input ${attr} type="checkbox" ${value?'checked':''}><span><b>${esc(label)}</b>${help?`<span>${esc(help)}</span>`:''}</span></label>`;else el=`<input ${attr} type="${esc(type)}" value="${esc(value||'')}" placeholder="${esc(placeholder)}">`;if(type==='checkbox')return el;const g=help||guide(path,label,type);return `<div class="field ${full?'full':''}"><label>${esc(label)}</label><small class="field-guide">${esc(g)}</small>${el}</div>`}
actionField=function(label,id,value='',type='text',help=''){const g=help||guide(id,label,type),el=type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`;return `<div class="field ${type==='textarea'?'full':''}"><label>${esc(label)}</label><small class="field-guide">${esc(g)}</small>${el}</div>`}
function diagStatus(c){if(!c.diagnosis?.applied||!c.diagnosis?.result)return{label:'Diagnosis due',detail:'Run diagnosis before setting the 90-day direction.',due:true};const d=v11ReviewDue(c),rv=Math.max(0,d.stats.total-d.stats.published),rd=Math.max(0,30-d.days);if(d.due)return{label:'Review ready',detail:d.reason,due:true};return{label:'Diagnosis current',detail:`Next review after ${rv} more planned video${rv===1?'':'s'} or about ${rd} days.`,due:false}}
function homeQuarter(c){const p=ensureQuarterPlan(c);if(!p)return'';return`<div class="v12-home-months v13-home-quarter"><div class="v12-quarter">${p.months.map((m,i)=>`<article class="v12-quarter-card ${m.status}"><div class="v12-qtop"><span class="v12-qnum">${m.status==='complete'?'✓':i+1}</span><span class="v12-qstate">${m.status==='active'?'Active':m.status==='complete'?'Complete':'Provisional'}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.why)}</p><div class="v12-qmix"><span>${m.mix.Reach} Reach</span><span>${m.mix.Trust} Trust</span><span>${m.mix.Convert} Convert</span></div><div class="v12-qdetails"><div class="v12-qdetail"><label>Favor</label><p>${esc(m.videoTypes.join(' · '))}</p></div><div class="v12-qdetail"><label>Coach</label><p>${esc(m.focus)}</p></div><div class="v12-qdetail"><label>Learn</label><p>${esc(m.learning)}</p></div></div></article>`).join('')}</div></div>`}
renderHome=function(){const c=creator(),next=nextDecision(c),p=ensureQuarterPlan(c),a=p?.activeMonth||1,due=diagStatus(c),open=(c.commitments||[]).filter(x=>!x.done);syncMonthSlots(c);return `<section class="page"><div class="hero"><div><div class="kicker">Coach desk · ${esc(c.name)}</div><h1>Move the next real decision.</h1><p class="lead">One creator. One current plan. One next decision.</p><div class="actions"><button class="btn dark" data-action="${next.videoId?'open-video':'go-view'}" ${next.videoId?`data-id="${next.videoId}"`:`data-target="${next.action}"`}>Continue where I left off →</button><button class="btn" data-action="open-session">Run coaching call</button></div></div><div class="hero-side"><div class="next-line current"><span class="next-dot"></span><div><strong>${esc(next.area)} · ${esc(next.title)}</strong><span>${esc(next.desc)}</span></div><b>Now</b></div><div class="next-line"><span class="next-dot"></span><div><strong>${esc(due.label)}</strong><span>${esc(due.detail)}</span></div><b>Plan</b></div><div class="next-line"><span class="next-dot"></span><div><strong>${open.length} open commitment${open.length===1?'':'s'}</strong><span>${open[0]?esc(open[0].what):'Nothing waiting on you.'}</span></div><b>Open</b></div></div></div><div class="rule"></div>${p?`<div class="section-head"><div><div class="kicker">90-day direction</div><h2>Month ${a} is active.</h2></div><button class="btn ghost" data-view="plan">Open plan</button></div>${homeQuarter(c)}`:`<div class="section-head"><div><div class="kicker">Plan</div><h2>No 90-day direction yet.</h2></div><button class="btn dark" data-view="plan">Start diagnosis →</button></div>`}<div class="v12-attention"><div><div class="section-head"><div><div class="kicker">Current month</div><h2>Planned videos</h2></div><button class="btn ghost" data-view="videos">All videos</button></div>${monthSlotTable(c)}</div><aside class="v12-attention-side"><div class="v11-side-icon">${v11Icon('check')}</div><div class="kicker">Coach commitments</div><h3>${open.length?`${open.length} open`:'Nothing outstanding'}</h3>${open.slice(0,4).map(x=>`<p>• ${esc(x.what)} · ${fmtDate(x.when)}</p>`).join('')||'<p>You are clear.</p>'}<div class="actions" style="margin-top:14px"><button class="tinybtn" data-action="add-commitment">+ Add commitment</button></div></aside></div></section>`}
renderStrategyDetail=function(c,tab){if(tab==='snapshot')return `<div class="v12-strategy-summary"><div class="v12-summary-block"><div class="v11-mini-icon">${v11Icon('people')}</div><div class="eyebrow">Audience</div><h3>${esc(c.strategy.audience||c.audience.onePerson||'Not set')}</h3><p>${esc(c.audience.situation||c.audience.surfaceProblems||'')}</p><button class="side-action" data-action="strategy-tab" data-tab="audience">Open audience →</button></div><div class="v12-summary-block"><div class="v11-mini-icon">${v11Icon('strategy')}</div><div class="eyebrow">Message</div><h3>${esc(c.message.head||c.message.channelPromise||'Not set')}</h3><p>${esc(c.message.heart||c.message.approach||'')}</p><button class="side-action" data-action="strategy-tab" data-tab="message">Open message →</button></div><div class="v12-summary-block"><div class="v11-mini-icon">${v11Icon('plan')}</div><div class="eyebrow">Business</div><h3>${esc(c.strategy.offer||c.strategy.businessGoal||'Not set')}</h3><p>${esc(c.business.path||c.business.measurement||'')}</p><button class="side-action" data-action="strategy-tab" data-tab="business">Open business →</button></div></div>`;return __v12RenderStrategyDetail(c,tab)}
function beatPurpose(b,v,i,n){b=String(b).toLowerCase();if(/problem|context|setup|before|situation|question/.test(b))return`Make ${v.viewer.problem||'the viewer’s real situation'} feel immediately recognizable.`;if(/cause|why|mechanism|model|criteria|diagnos/.test(b))return`Explain why the problem happens so ${v.promise.mechanism||'the mechanism'} makes sense.`;if(/proof|evidence|example|test|finding|result|after/.test(b))return'Show enough evidence that the claim feels earned, not asserted.';if(/solution|step|fix|process|method|intervention|recommend/.test(b))return`Move into the usable answer and connect it directly to ${v.promise.result||'the promised result'}.`;if(/mistake|obstacle|risk|trade|limitation|weakness/.test(b))return'Handle the thing most likely to make the viewer fail, doubt the answer, or choose wrong.';if(/application|action|lesson|takeaway|fit|decision|verdict|conclusion|meaning/.test(b))return'Turn the insight into a clear decision, action or takeaway.';if(i===0)return'Start where the viewer immediately understands why this matters.';if(i===n-1)return`Land the payoff and make ${v.promise.result||'the result'} feel usable.`;return'Move the viewer one meaningful step closer to the payoff.'}
function beatMap(v,name){const b=String(name||'').split('→').map(x=>x.trim()).filter(Boolean);return`<div class="v13-beat-map">${b.map((x,i)=>`<div class="v13-beat"><div class="v13-beat-num">${i+1}</div><b>${esc(x)}</b><span>${esc(beatPurpose(x,v,i,b.length))}</span></div>`).join('')}</div>`}
decisionStructure=function(c,v){const rec=structureRecs(v),all=(P.SOURCE_DATA.structures||[]).map(x=>x.name);return `${decisionHead('Build the flow','What progression makes the promise easiest to understand and satisfy?','Choose a structure, then turn it into beats specific to this video. The structure is a progression, not a rigid script.',`${v.archetype} · ${v.hook.type||'Hook not set'}`)}${optionsBlock('structure',rec,all,v.structure.type,c,v)}${v.structure.type?`<div class="selected-guide"><div class="grid"><div><b>Best for</b><p>${esc(detailBest('structure',v.structure.type))}</p></div><div><b>Progression</b><p>${esc(v.structure.type)}</p></div></div><div class="v13-script-label">What each beat is doing</div>${beatMap(v,v.structure.type)}<div class="actions" style="margin-top:12px"><button class="tinybtn" data-action="use-structure-starter">Build beat starter</button></div></div>`:''}<div class="fields">${field('Structure / beat notes','structure.notes',v.structure.notes,{scope:'video',type:'textarea',full:true,rows:9})}</div>`}
function ctaVariants(v,type,mid){const c=creator(),lead=(c.business?.leadMagnets||[]).find(x=>x&&x.name&&x.active!==false)?.name||'',paid=(c.business?.offers||[]).find(x=>x&&x.name&&x.active!==false)?.name||'',legacy=(!/[→>|]/.test(c.strategy?.offer||'')&&String(c.strategy?.offer||'').length<60)?c.strategy.offer:'',offer=(v.job==='Convert'?(paid||lead||legacy):(lead||paid||legacy))||'the resource below',result=v.promise.result||v.viewer.desire||'take the next step',natural=ctaScript(v,type,mid);if(mid&&type==='No mid-roll CTA')return[{label:'Keep the flow',script:'No mid-roll CTA here. Let the current section move directly into the next beat.'}];let short='',direct='';if(mid){if(/Watch Next|Continue/.test(type)){short='I linked the next piece below. Keep going here first, because the next beat sets it up.';direct='The next step is linked below. Now let’s finish this part.'}else if(/Conversation/.test(type)){short='Tell me where this breaks for you below. Now let’s keep going.';direct='Drop your specific question below, then come right back to the next step.'}else{short=`${offer} is linked below so you can use this after the video. Now let’s keep going.`;direct=`Use ${offer} for the implementation piece. It’s below. Now back to the video.`}}else{if(/Watch Next|Series|Continue/.test(type)){short='The next video picks up right where this one ends. Watch that next.';direct='Go to the next video on screen and keep building from here.'}else if(/Conversation/.test(type)){short='Tell me the exact part you’re stuck on below.';direct='Drop your situation below so we know what to break down next.'}else if(/Application|Direct|Fit|Process/.test(type)){short=`The next step is ${offer}. The details are below.`;direct=`If you’re ready to ${result.toLowerCase()}, start with ${offer} below.`}else{short=`${offer} gives you the next practical step. It’s linked below.`;direct=`Use ${offer} to apply this to your situation. It’s below.`}}return[{label:'Natural',script:natural},{label:'Short + clean',script:short},{label:'More direct',script:direct}].filter(x=>x.script)}
function scriptCards(v,type,mid){return`<div class="v13-script-label">Script starters</div><div class="v13-script-grid">${ctaVariants(v,type,mid).map((x,i)=>`<button class="v13-script-card" data-action="v13-use-cta-starter" data-mid="${mid?'1':'0'}" data-index="${i}"><b>${esc(x.label)}</b><span>${esc(x.script)}</span><em>Use this starter →</em></button>`).join('')}</div>`}
decisionCTA=function(c,v){const end=endCtaRecs(v),allEnd=Object.keys(P.SOURCE_DATA.cta||{}),mid=midCtaRecs(v),allMid=uniq([...Object.keys(P.MID_CTA_DETAILS||{}),'No mid-roll CTA']);return `${decisionHead('Plan the next move','Where should the viewer go next, and how do we bridge there without breaking the video?','Plan the optional mid-roll only where value has been earned. Then finish with one primary end move that continues the exact promise and viewer state.',`${v.job} · ${configuredNextAsset(c,v.job)||'No next-step asset set'}`)}<div class="section-head" style="margin-top:20px"><div><div class="kicker">1 · Mid-roll CTA</div><h3>Is there a useful next step before the final payoff?</h3><p>Optional. Skip it when it would interrupt the experience.</p></div></div><div class="recommend-note"><b>Placement for this video</b><span>${esc(midCtaPlacement(v))}</span></div>${optionsBlock('midcta',mid,allMid,v.cta.midType,c,v)}${v.cta.midType?`<div class="selected-guide"><div class="grid"><div><b>Use it when</b><p>${esc(detailBest('midcta',v.cta.midType))}</p></div><div><b>Rule</b><p>Build from the beat before it, make one relevant ask, then reopen the next question immediately.</p></div></div>${scriptCards(v,v.cta.midType,true)}</div>`:''}<div class="fields">${field('Mid-roll CTA draft','cta.midDraft',v.cta.midDraft,{scope:'video',type:'textarea',full:true,rows:4})}</div><div class="section-head" style="margin-top:24px"><div><div class="kicker">2 · End CTA / continuation</div><h3>What should the payoff naturally lead to?</h3><p>Finish the promise, create the next logical question or action, then end.</p></div></div>${optionsBlock('cta',end,allEnd,v.cta.endType,c,v)}${v.cta.endType?`<div class="selected-guide"><div class="grid"><div><b>When to use it</b><p>${esc(detailBest('cta',v.cta.endType))}</p></div><div><b>Rule</b><p>Finish the value first. Then make one next move feel like the natural continuation.</p></div></div>${scriptCards(v,v.cta.endType,false)}</div>`:''}<div class="fields">${field('End CTA draft','cta.endDraft',v.cta.endDraft,{scope:'video',type:'textarea',full:true,rows:4})}</div><div class="flow-impact"><b>What this changes next:</b> the Handoff inherits both CTA scripts and placement logic.</div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action="v13-use-cta-starter"]');if(!t)return;const v=video();if(!v)return;const mid=t.dataset.mid==='1',type=mid?v.cta.midType:v.cta.endType,item=ctaVariants(v,type,mid)[Number(t.dataset.index)||0];if(!item)return;if(mid)v.cta.midDraft=item.script;else v.cta.endDraft=item.script;save();render();toast('Script starter added')});
render();})();
</script>

<script id="v14-connected-logic-script">
(()=>{
if(window.__v14ConnectedLogic)return;window.__v14ConnectedLogic=true;

const __v14RenderTop=renderTop;

const __v14RecommendedRoles=recommendedRoles,__v14RecommendedResearch=recommendedResearch,__v14WhyNow=whyNow;
recommendedRoles=function(v){
 const mode=creator()?.month?.mode||'Exploit',all=P.JOB_ROLES[v.job]||[],pref=mode==='Explore'
   ?['Experiment / Exploration',...all]
   :v.job==='Reach'?['Follow-Up / Sequel','Evergreen Lead Asset','Attention Acquisition',...all]
   :v.job==='Trust'?['Repeatable Format Rep','Follow-Up / Sequel','Binge / Bridge',...all]
   :['Conversion Asset','Follow-Up / Sequel','Evergreen Lead Asset',...all];
 return uniq(pref.filter(x=>all.includes(x))).slice(0,3);
};
recommendedResearch=function(c,v){
 const base=__v14RecommendedResearch(c,v),mode=c?.month?.mode||'Exploit',
   pref=mode==='Explore'?['Adjacent-niche formats','Outside-niche inspiration','Direct-niche outliers','Audience evidence']
                         :['Own-channel evidence','Catalogue / post-publish evidence','Packaging-pattern research','Audience evidence'];
 return uniq([...pref,...base]).slice(0,3);
};
whyNow=function(kind,name,c,v){
 const mode=c?.month?.mode||'Exploit';
 if(kind==='role'){
   if(mode==='Explore'&&name==='Experiment / Exploration')return 'This month is in Explore mode, so this slot should reduce a real uncertainty instead of only repeating familiar work.';
   if(mode==='Exploit'&&['Follow-Up / Sequel','Repeatable Format Rep','Evergreen Lead Asset','Conversion Asset'].includes(name))return 'This month is in Exploit mode, so this role builds directly on evidence the creator already earned.';
 }
 if(kind==='research'){
   if(mode==='Explore'&&['Adjacent-niche formats','Outside-niche inspiration','Direct-niche outliers','Audience evidence'].includes(name))return 'Explore mode favors evidence that can reveal a new angle, format, audience signal or transferable pattern.';
   if(mode==='Exploit'&&['Own-channel evidence','Catalogue / post-publish evidence','Packaging-pattern research'].includes(name))return 'Exploit mode starts with the creator’s own evidence and proven patterns before looking for novelty.';
 }
 return __v14WhyNow(kind,name,c,v);
};

capacityNumber=function(c){
 const raw=String(c?.strategy?.capacity||'4 videos / month');
 if(/^custom/i.test(raw)){
   const n=Math.round(Number(c?.strategy?.capacityCustom));
   return Math.max(1,Math.min(30,Number.isFinite(n)?n:4));
 }
 const m=raw.match(/\d+/);
 return Math.max(1,Math.min(30,Number(m?.[0]||4)));
};

window.v14Ensure=function(c){
 c.strategy=c.strategy||{};c.month=c.month||{};
 if(c.strategy.capacityCustom==null)c.strategy.capacityCustom=5;
 if(c.month.mixUserAdjusted==null)c.month.mixUserAdjusted=false;
};
window.v14ActiveQuarterMonth=function(c){const p=ensureQuarterPlan(c),a=p?.activeMonth||1;return p?.months?.[a-1]||null};
window.v14PlanRecommendedMix=function(c){v14Ensure(c);const m=v14ActiveQuarterMonth(c);return m?.mix?{Reach:Number(m.mix.Reach)||0,Trust:Number(m.mix.Trust)||0,Convert:Number(m.mix.Convert)||0}:recommendedMix(c)};
window.v14CurrentMix=function(c){v14Ensure(c);return c.month.mixUserAdjusted?activeMix(c):v14PlanRecommendedMix(c)};
window.v14MixAllocationValid=function(c){
 v14Ensure(c);if(!c.month.mixUserAdjusted)return true;
 return ['Reach','Trust','Convert'].reduce((a,k)=>a+(Number(c.month.mix?.[k])||0),0)===capacityNumber(c);
};
function v14NormalizeManualMix(c,total){
 const cur=c.month.mix||{},sum=['Reach','Trust','Convert'].reduce((a,k)=>a+(Number(cur[k])||0),0);
 if(!sum)return v14PlanRecommendedMix(c);

}
window.v14ReflowCapacity=function(c){
 v14Ensure(c);const p=ensureQuarterPlan(c),total=capacityNumber(c);
 if(p){
   p.months.forEach((m,i)=>{if(m.status==='complete')return;const mix=v11MixFor(c,p.diagnosis||c.currentConstraint,i+1);m.mix={...mix};m.jobs=v11JobList(mix)});
   const active=p.months[(p.activeMonth||1)-1];
   if(c.month.mixUserAdjusted)c.month.mix={manual:true,...v14NormalizeManualMix(c,total)};
   else if(active?.mix)c.month.mix={manual:true,...active.mix};
 }
 syncMonthSlots(c);
};
window.v14CapacityControl=function(c){
 v14Ensure(c);const value=String(c.strategy.capacity||'4 videos / month'),options=['1 video / month','2 videos / month','3 videos / month','4 videos / month','6 videos / month','8 videos / month','Custom'];
 return `<div class="v14-capacity ${value==='Custom'?'':'single'}"><div class="field"><label>Realistic monthly capacity</label><small class="field-guide">How many videos can this creator sustain in a normal month?</small><select data-v14-capacity>${options.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${value==='Custom'?`<div class="field"><label>Custom videos / month</label><small class="field-guide">Use the real number the plan should build around.</small><input type="number" min="1" max="30" value="${capacityNumber(c)}" data-v14-custom-capacity></div>`:''}</div>`;
};
window.v14CapacitySection=function(c){return `<div class="v14-field-section"><div class="v14-section-head"><div><div class="eyebrow">Publishing capacity</div><h3>How many video decisions should this month contain?</h3></div></div>${v14CapacityControl(c)}</div>`};
window.v14RecommendedMode=function(c){v14Ensure(c);const m=v14ActiveQuarterMonth(c);if(m?.mode)return m.mode;const q=String(c.currentConstraint||'').toLowerCase();return /discovery|audience|no obvious|unclear/.test(q)?'Explore':'Exploit'};
function v14ModeWhy(c,mode){const m=v14ActiveQuarterMonth(c);if(mode==='Explore')return m?.learning?`This chapter still needs evidence around: ${m.learning}`:'Use Explore when an important topic, package, format or audience assumption still needs a real test.';return m?.focus?`This chapter is designed to repeat and sharpen evidence while focusing on: ${m.focus}`:'Use Exploit when something has already earned enough evidence to deserve another deliberate version.'}
window.v14ModeUI=function(c){const rec=v14RecommendedMode(c);return `<div class="kicker" style="margin-top:18px">Explore / exploit</div><div class="v14-mode-grid">${['Explore','Exploit'].map(mode=>`<button class="v14-mode ${c.month.mode===mode?'selected':''} ${rec===mode?'recommended':''}" data-v14-mode="${mode}"><b>${mode}</b><span>${mode==='Explore'?'Test a meaningful unknown without turning the whole month into experiments.':'Repeat and sharpen something that has already earned evidence.'}</span></button>`).join('')}</div><div class="v14-mode-why"><b>${rec} is the best fit for this chapter.</b> ${esc(v14ModeWhy(c,rec))}</div>`};
window.v14MixUI=function(c){
 v14Ensure(c);const total=capacityNumber(c),recommended=v14PlanRecommendedMix(c),mix=v14CurrentMix(c),allocated=['Reach','Trust','Convert'].reduce((a,k)=>a+(Number(c.month.mix?.[k])||0),0),editing=!!c.month.mixUserAdjusted;
 return `<div class="v14-mix-editor"><div class="v14-mix-top"><div><div class="kicker">${editing?'Custom RTC mix':'Recommended RTC mix'}</div><h3>${mix.Reach} Reach · ${mix.Trust} Trust · ${mix.Convert} Convert</h3><p>Built around ${total} video${total===1?'':'s'} and the current diagnosis.</p></div><div class="actions">${editing?`<span class="v14-allocation ${allocated===total?'good':'bad'}">${allocated} of ${total} allocated</span><button class="tinybtn" data-v14-reset-mix>Use recommendation</button>`:`<button class="tinybtn" data-v14-customize-mix>Adjust mix</button>`}</div></div>${editing?`<div class="v14-mix-controls">${['Reach','Trust','Convert'].map(j=>`<div class="v14-mix-control"><label>${j}</label><strong>${Number(c.month.mix?.[j])||0}</strong><input type="number" min="0" max="${total}" value="${Number(c.month.mix?.[j])||0}" data-v14-mix="${j}"></div>`).join('')}</div>`:`<div class="v12-mixbar"><div class="v12-mixcell"><span>Reach</span><strong>${recommended.Reach}</strong></div><div class="v12-mixcell"><span>Trust</span><strong>${recommended.Trust}</strong></div><div class="v12-mixcell"><span>Convert</span><strong>${recommended.Convert}</strong></div></div>`}</div>`;
};

function v14Section(kicker,title,content,sub=''){return `<section class="v14-field-section"><div class="v14-section-head"><div><div class="eyebrow">${esc(kicker)}</div><h3>${esc(title)}</h3>${sub?`<p>${esc(sub)}</p>`:''}</div></div>${content}</section>`}

 };

<script id="v143-stable-capacity-script">
(()=>{
 if(window.__v143StableCapacity)return;window.__v143StableCapacity=true;
 const later=()=>setTimeout(()=>{try{render()}catch(err){console.error(err)}},0);
 document.addEventListener('change',e=>{
   const t=e.target;if(!t||!t.matches)return;
   const isCapacity=t.matches('[data-v14-capacity]');
   const isCustom=t.matches('[data-v14-custom-capacity]');
   const isMix=t.matches('[data-v14-mix]');
   if(!isCapacity&&!isCustom&&!isMix)return;
   e.stopImmediatePropagation();
   const c=creator();
   if(isCapacity){
     c.strategy.capacity=t.value;
     if(t.value!=='Custom')c.strategy.capacityCustom=capacityNumber(c);
     c.month.mixUserAdjusted=false;
     v14ReflowCapacity(c);save();later();return;
   }
   if(isCustom){
     c.strategy.capacity='Custom';
     c.strategy.capacityCustom=Math.max(1,Math.min(30,Math.round(Number(t.value)||1)));
     c.month.mixUserAdjusted=false;
     v14ReflowCapacity(c);save();later();return;
   }
   if(isMix){
     v14Ensure(c);c.month.mixUserAdjusted=true;c.month.mix=c.month.mix||{manual:true,Reach:0,Trust:0,Convert:0};c.month.mix.manual=true;
     c.month.mix[t.dataset.v14Mix]=Math.max(0,Math.round(Number(t.value)||0));
     if(v14MixAllocationValid(c))syncMonthSlots(c);save();later();
   }
 },true);
})();
</script>

.fw-page{padding-top:34px;padding-bottom:72px}

.fw-hero-note h3{font-size:13px;margin-bottom:12px}

.fw-toc .eyebrow{margin-bottom:11px}.fw-toc a{display:block;padding:7px 0;font-size:10px;color:var(--muted);line-height:1.25}.fw-toc a:hover{color:var(--ink)}
.fw-toc .fw-toc-rule{border-top:1px solid var(--line);margin:12px 0}.fw-toc p{font-size:9px;color:var(--muted2);line-height:1.5}
.fw-main{min-width:0;max-width:1030px}
.fw-section{scroll-margin-top:96px;padding:8px 0 48px;border-bottom:1px dashed var(--line2)}
.fw-section+.fw-section{padding-top:48px}.fw-section:last-child{border-bottom:0}
.fw-section-head{display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:start;margin-bottom:24px}
.fw-num{font-size:10px;color:var(--muted2);font-weight:850;letter-spacing:.08em;padding-top:7px}
.fw-section h2{font-size:34px}.fw-section-head p{font-size:12px;line-height:1.6;color:var(--muted);max-width:780px;margin-top:8px}
.fw-thesis{background:var(--primary2);border:1px solid color-mix(in srgb,var(--primary) 65%,var(--line));border-radius:10px;padding:18px 20px;margin:22px 0}
.fw-thesis b{font-size:11px}.fw-thesis p{font-size:11px;line-height:1.55;color:var(--muted);margin-top:5px}
.fw-map{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2);border-left:1px solid var(--line2);margin-top:20px}
.fw-map-step{min-height:126px;padding:15px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface)}
.fw-map-step small{font-size:8px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted2);font-weight:850}.fw-map-step h3{font-size:13px;margin-top:7px}.fw-map-step p{font-size:9.5px;line-height:1.48;color:var(--muted);margin-top:7px}.fw-map-step b{display:block;font-size:8.5px;color:var(--ink);margin-top:10px}
.fw-chain{border-top:1px solid var(--line2);margin-top:22px}.fw-chain-row{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}
.fw-chain-row>div:first-child{font-size:10px;font-weight:850}.fw-chain-row p{font-size:9.7px;line-height:1.5;color:var(--muted)}.fw-chain-head{font-size:8px!important;text-transform:uppercase;letter-spacing:.09em;color:var(--muted2)!important;font-weight:850!important}
.fw-lane{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding:18px 0;border-top:1px solid var(--line)}.fw-lane:last-child{border-bottom:1px solid var(--line)}
.fw-lane-name{font-size:20px;font-weight:760;letter-spacing:-.035em}.fw-lane-name span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin-top:5px}.fw-lane-body{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.fw-lane-cell label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);font-weight:850}.fw-lane-cell p{font-size:9.8px;line-height:1.52;color:var(--muted);margin-top:5px}.fw-lane-cell b{color:var(--ink)}
.fw-mode{display:grid;grid-template-columns:145px minmax(0,1.35fr) minmax(0,1fr);gap:22px;padding:17px 0;border-top:1px solid var(--line)}.fw-mode:last-child{border-bottom:1px solid var(--line)}.fw-mode h3{font-size:17px}.fw-mode p{font-size:10px;line-height:1.55;color:var(--muted)}.fw-mode strong{font-size:9.5px;line-height:1.45;display:block}
.fw-callout{border-left:3px solid var(--line2);padding:10px 0 10px 14px;margin:18px 0}.fw-callout[data-tone="green"]{border-color:#91ad8b}.fw-callout[data-tone="blue"]{border-color:#8aa7bb}.fw-callout[data-tone="rose"]{border-color:#b99792}.fw-callout b{font-size:9px;text-transform:uppercase;letter-spacing:.08em}.fw-callout p{font-size:10px;line-height:1.55;color:var(--muted);margin-top:4px}
.fw-details{border-top:1px solid var(--line2)}.fw-details details{border-bottom:1px solid var(--line)}.fw-details summary{list-style:none;display:grid;grid-template-columns:26px 220px minmax(0,1fr) 18px;gap:13px;align-items:start;padding:13px 0;cursor:pointer}.fw-details summary::-webkit-details-marker{display:none}.fw-details summary:after{content:'+';font-size:15px;color:var(--muted);line-height:1}.fw-details details[open] summary:after{content:'−'}.fw-details .fw-index{font-size:8px;color:var(--muted2);font-weight:850;padding-top:2px}.fw-details summary b{font-size:10.5px}.fw-details summary span{font-size:9.5px;color:var(--muted);line-height:1.45}.fw-detail-body{padding:0 0 18px 259px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}.fw-detail-body div{min-width:0}.fw-detail-body label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);font-weight:850}.fw-detail-body p{font-size:9.7px;color:var(--muted);line-height:1.52;margin-top:4px}.fw-detail-body .full{grid-column:1/-1}
.fw-type-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2)}.fw-type-group{background:var(--surface);padding:17px}.fw-type-group h3{font-size:15px}.fw-type-group>p{font-size:9.5px;line-height:1.5;color:var(--muted);margin-top:6px}.fw-type-list{margin-top:13px}.fw-type-list button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 0;font-size:9.5px;color:var(--ink);cursor:default}.fw-type-list button:first-child{border-top:0}
.fw-rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);margin-top:18px}.fw-rule-col{background:var(--surface);padding:17px}.fw-rule-col h3{font-size:14px}.fw-rule-col h4{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin:16px 0 6px}.fw-chipline{font-size:9.6px;line-height:1.55;color:var(--muted)}
.fw-ppp{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line2);margin:18px 0}.fw-ppp>div{padding:18px;border-right:1px solid var(--line2)}.fw-ppp>div:last-child{border-right:0}.fw-ppp b{font-size:18px}.fw-ppp p{font-size:9.8px;line-height:1.55;color:var(--muted);margin-top:7px}
.fw-checklist{counter-reset:fwcheck;border-top:1px solid var(--line2)}.fw-check{counter-increment:fwcheck;display:grid;grid-template-columns:36px 180px minmax(0,1fr);gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.fw-check:before{content:counter(fwcheck,decimal-leading-zero);font-size:8px;color:var(--muted2);font-weight:850}.fw-check b{font-size:10px}.fw-check p{font-size:9.7px;line-height:1.52;color:var(--muted)}
.fw-example{border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--surface)}.fw-example-head{padding:18px 20px;background:var(--primary2);border-bottom:1px solid var(--line2)}.fw-example-head h3{font-size:18px}.fw-example-head p{font-size:10px;color:var(--muted);margin-top:5px}.fw-example-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:18px;padding:13px 20px;border-bottom:1px solid var(--line)}.fw-example-row:last-child{border-bottom:0}.fw-example-row label{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);font-weight:850}.fw-example-row b{font-size:10px}.fw-example-row p{font-size:9.6px;line-height:1.5;color:var(--muted)}
.fw-footer-note{padding-top:22px;font-size:9px;color:var(--muted2);line-height:1.6}
@media(max-width:1120px){.fw-hero{grid-template-columns:1fr}.fw-hero-note{border-left:0;border-top:1px solid var(--line2);padding:20px 0 0}.fw-layout{grid-template-columns:1fr}.fw-toc{position:static;border-right:0;border-bottom:1px dashed var(--line2);padding:0 0 16px;display:flex;gap:14px;overflow:auto}.fw-toc .eyebrow,.fw-toc .fw-toc-rule,.fw-toc p{display:none}.fw-toc a{white-space:nowrap}.fw-lane-body{grid-template-columns:1fr 1fr}.fw-map{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.fw-page{padding-top:22px}.fw-hero h1{font-size:40px}.fw-section-head{grid-template-columns:1fr;gap:6px}.fw-section h2{font-size:29px}.fw-map,.fw-type-groups,.fw-rule-grid,.fw-ppp{grid-template-columns:1fr}.fw-lane,.fw-mode,.fw-chain-row,.fw-example-row{grid-template-columns:1fr;gap:7px}.fw-lane-body{grid-template-columns:1fr}.fw-details summary{grid-template-columns:24px 1fr 18px}.fw-details summary span{grid-column:2}.fw-detail-body{padding-left:37px;grid-template-columns:1fr}.fw-detail-body .full{grid-column:auto}.fw-ppp>div{border-right:0;border-bottom:1px solid var(--line2)}.fw-ppp>div:last-child{border-bottom:0}.fw-check{grid-template-columns:30px 1fr}.fw-check p{grid-column:2}}
</style>
<style id="v151-darkmode-qa-style">
html[data-theme="dark"]{--bg:#141512;--surface:#1c1e1a;--ink:#f3f3ed;--muted:#b2b3aa;--muted2:#8f9189;--soft:#252722;--line:#353832;--line2:#4b4f47;--primary:#70673c;--primary2:#2d2a1e;--green:#223126;--greenInk:#b9d5ba;--blue:#212c34;--blueInk:#bdd1de;--rose:#352724;--roseInk:#dfbbb5;--orange:#342d23;--shadow:0 10px 30px rgba(0,0,0,.18),0 1px 4px rgba(0,0,0,.24);--warnBg:#312b1d;--warnLine:#665b35;--warnInk:#e1cf88;--dangerInk:#e3a496;--accentInk:#d8c978;--accentLine:#857a43;color-scheme:dark}
html[data-theme="dark"] body,html[data-theme="dark"] input,html[data-theme="dark"] textarea,html[data-theme="dark"] select,html[data-theme="dark"] button{color-scheme:dark}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:var(--muted2);opacity:1}
html[data-theme="dark"] select option{background:var(--surface);color:var(--ink)}
html[data-theme="dark"] .v12-quarter-card.provisional{background:color-mix(in srgb,var(--soft) 72%,var(--surface));color:var(--ink)}
html[data-theme="dark"] .v12-qnum,html[data-theme="dark"] .v12-qmix span{background:var(--surface);color:var(--ink);border-color:var(--line2)}
html[data-theme="dark"] .v12-quarter-card.active .v12-qnum{background:var(--ink);color:var(--bg);border-color:var(--ink)}
html[data-theme="dark"] .v12-quarter-card.active{border-color:var(--accentLine);box-shadow:inset 0 3px 0 var(--accentLine)}

html[data-theme="dark"] .choice.selected{border-color:var(--accentLine)}
html[data-theme="dark"] .choice.recommended:before{color:var(--accentInk)}
html[data-theme="dark"] .v14-mode.recommended:before{color:var(--accentInk);border-color:var(--accentLine);background:var(--primary2)}

html[data-theme="dark"] .v14-allocation.bad{color:var(--dangerInk)}
html[data-theme="dark"] .v14-formula-use,html[data-theme="dark"] .v13-script-card em{color:var(--blueInk)}

html[data-theme="dark"] .confirmed-pill{border-color:var(--accentLine)}
html[data-theme="dark"] .v11-month.active,html[data-theme="dark"] .v11-checkpoint.due{border-color:var(--accentLine)}
html[data-theme="dark"] .v11-month.complete{border-color:color-mix(in srgb,var(--greenInk) 38%,var(--line))}
html[data-theme="dark"] .fw-callout[data-tone="green"]{border-color:color-mix(in srgb,var(--greenInk) 72%,var(--line2))}
html[data-theme="dark"] .fw-callout[data-tone="blue"]{border-color:color-mix(in srgb,var(--blueInk) 68%,var(--line2))}
html[data-theme="dark"] .fw-callout[data-tone="rose"]{border-color:color-mix(in srgb,var(--roseInk) 65%,var(--line2))}
