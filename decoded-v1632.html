y Cash Flow Problems Usually Aren’t Finance Problems","avoid":"Mystery with no stakes, vague 'you won’t believe' language, withholding basic context.","jobs":"Reach · Trust"},"title::Proof / Authority":{"kind":"TITLE APPROACH","best":"Skeptical audiences, expert-led channels, case studies, tests, data, credentials, demonstrations.","why":"Reduces uncertainty by making the reason to believe visible in the package.","research":"Case results, credentials, data, years/volume, tests, before/after evidence, receipts.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"What [NUMBER] [CASES/TESTS] Taught Me About [TOPIC] · How [SUBJECT] Got [RESULT] · [EXPERT] Explains [PROBLEM]","formulaLabel":"Starting formulas","example":"What 100 Channel Audits Taught Me About YouTube Growth · How This Business Fixed a Cash Flow Crisis","avoid":"Authority theater, irrelevant credentials, proof that is not actually connected to the claim.","jobs":"Trust · Convert · Reach"},"title::Belief / Reframe":{"kind":"TITLE APPROACH","best":"POV, myths, counterintuitive expertise, leadership, category differentiation.","why":"Creates tension between the viewer’s current model and a new interpretation.","research":"Dominant belief, evidence against it, creator experience, counterarguments, replacement model.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"[COMMON ADVICE] Is Wrong for [AUDIENCE] · Stop Thinking About [TOPIC] Like This · [PROBLEM] Isn’t a [THING] Problem","formulaLabel":"Starting formulas","example":"Cash Flow Isn’t a Finance Problem — It’s a Leadership Problem · Why 'Work Harder' Is Bad Advice for Burned-Out Leaders","avoid":"Contrarianism without evidence, straw-man beliefs, overly abstract titles.","jobs":"Trust · Reach"},"title::Comparison / Decision":{"kind":"TITLE APPROACH","best":"A vs B, tool choices, methods, products, services, high-intent decisions.","why":"Meets the viewer at a real decision moment and promises clarity.","research":"Real alternatives, decision criteria, audience segments, trade-offs, price/use cases.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"[A] vs [B]: Which Is Better for [AUDIENCE]? · [OPTION] or [OPTION]? · Which [THING] Should You Choose?","formulaLabel":"Starting formulas","example":"DIY vs Done-for-You: Which Is Actually Cheaper? · Renting vs Buying: Which Makes Sense Right Now?","avoid":"Fake universal winners, biased criteria, comparison where the viewer is not actually choosing.","jobs":"Reach · Convert"},"title::Beginner / Start Here":{"kind":"TITLE APPROACH","best":"New viewers, newly diagnosed audiences, complex topics, onboarding sequences.","why":"Reduces overwhelm and makes the video an obvious entry point.","research":"First questions, beginner mistakes, terminology, early decisions, what to ignore.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"If You’re New to [TOPIC], Start Here · The Beginner Guide to [RESULT] · Before You [ACTION], Watch This","formulaLabel":"Starting formulas","example":"If You’re Over 40 and in Perimenopause, Start Here · New to Investing? Start Here","avoid":"Trying to cover the entire field, jargon, title so broad it has no immediate payoff.","jobs":"Reach · Trust"},"title::Story / Stakes":{"kind":"TITLE APPROACH","best":"Personal stories, founder stories, failure, journeys, documentaries, high-emotion lessons.","why":"Creates narrative tension around a person, decision, consequence, or turning point.","research":"Conflict, stakes, before/after, turning point, consequence, lesson.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"I Almost [CONSEQUENCE] · The Decision That Changed [THING] · What Happened After [EVENT]","formulaLabel":"Starting formulas","example":"The Decision That Nearly Broke My Business · The Day I Realized My YouTube Strategy Was Backwards","avoid":"Biography without stakes, titles that require caring about the creator before the story begins.","jobs":"Trust · Reach"},"title::Specificity / Constraint":{"kind":"TITLE APPROACH","best":"Challenges, experiments, routines, quantified outcomes, deadlines, limited resources.","why":"A concrete constraint makes an otherwise familiar idea feel testable and distinct.","research":"Time, number, budget, rule, limitation, measurable baseline/result.","researchLabel":"Research / evidence","build":"Choose the formula only after the exact viewer, promise, discovery mode and evidence are clear.","buildLabel":"Selection logic","formula":"I Tried [THING] for 30 Days · [RESULT] With Only [CONSTRAINT] · [NUMBER] Habits for [OUTCOME]","formulaLabel":"Starting formulas","example":"5 Daily Habits for Peak Performance Under Pressure · I Built a Patio With 24-Inch Pavers","avoid":"Arbitrary numbers, fake deadlines, adding numbers only because list titles are common.","jobs":"Reach · Trust"},"thumbnail::Visual Proof":{"kind":"THUMBNAIL STRATEGY","best":"Transformations, demonstrations, experiments, physical results, case studies.","why":"The image itself provides evidence that something changed, worked, broke, or is worth investigating.","research":"Before/after assets, result screenshots, physical evidence, demo frames, charts, receipts.","researchLabel":"Assets / research needed","build":"Show the result clearly. Remove anything that does not help the viewer understand the proof in one glance.","buildLabel":"How to build it","formula":"Pairs especially well with Result, Curiosity, Proof and Case Study titles.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Tiny proof, fake/ambiguous results, too many screenshots, proof requiring explanation before it makes sense.","jobs":"Reach · Trust · Convert"},"thumbnail::Problem / Tension":{"kind":"THUMBNAIL STRATEGY","best":"Mistakes, warnings, pain points, broken systems, negative consequences.","why":"Makes the problem visually recognizable before the viewer reads the title.","research":"What the problem looks like, recognizable objects/symptoms, strongest consequence.","researchLabel":"Assets / research needed","build":"One obvious visual problem, strong contrast, limited text if necessary, clear focal hierarchy.","buildLabel":"How to build it","formula":"Pairs with Problem/Mistake/Risk titles without repeating the exact same words.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Generic red arrows, visual chaos, fear imagery unrelated to the actual video.","jobs":"Reach · Convert"},"thumbnail::Transformation / Before-After":{"kind":"THUMBNAIL STRATEGY","best":"Makeovers, performance improvements, health/fitness, business results, skill change.","why":"Creates instant contrast and a built-in question: what caused the change?","research":"Matched before/after images, time frame, credible proof, visible difference.","researchLabel":"Assets / research needed","build":"Make the two states easy to compare. Use consistent angle/context where possible.","buildLabel":"How to build it","formula":"Strong with titles that explain method, timeframe, cause, or surprising lesson.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Misleading before/after, dramatically different lighting/angles that exaggerate the result.","jobs":"Reach · Trust · Convert"},"thumbnail::Comparison / Choice":{"kind":"THUMBNAIL STRATEGY","best":"A vs B, methods, tools, services, options, decisions.","why":"Visually externalizes the choice and lets the title explain the deciding factor.","research":"Distinct visual symbols for each option, key trade-off, what audience recognizes immediately.","researchLabel":"Assets / research needed","build":"Two clear sides or objects. Make the decision readable at thumbnail size.","buildLabel":"How to build it","formula":"Comparison title can ask the decision while thumbnail shows the alternatives or consequence.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Four-way comparisons, unreadable labels, showing two options that look nearly identical.","jobs":"Reach · Convert"},"thumbnail::Object as Stakes":{"kind":"THUMBNAIL STRATEGY","best":"Products, money, tools, documents, physical objects central to the consequence or result.","why":"A concrete object can symbolize the entire problem more quickly than text.","research":"Which object represents the risk/result? Cash, contract, phone, product, chart, tool, scorecard, etc.","researchLabel":"Assets / research needed","build":"Make the object large and unmistakable. Add face/reaction only if it contributes.","buildLabel":"How to build it","formula":"Works with titles that explain why the object matters or what happens to it.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Decorative props that do not carry meaning.","jobs":"Reach · Convert"},"thumbnail::Face + Visual Clue":{"kind":"THUMBNAIL STRATEGY","best":"Creator-led channels, reactions, emotional stakes, stories, expert diagnosis.","why":"Human expression provides emotion while the second element communicates the subject or tension.","research":"Which emotion is actually appropriate? What object/screen/result completes the meaning?","researchLabel":"Assets / research needed","build":"Face should be readable, expression believable, clue large enough to understand without text.","buildLabel":"How to build it","formula":"Title supplies the unresolved question; visual clue supplies context.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Overacted faces, face taking space without adding meaning, five visual clues around the face.","jobs":"Reach · Trust"},"thumbnail::Number / Result":{"kind":"THUMBNAIL STRATEGY","best":"Quantified outcomes, lists, milestones, money, time, scores, performance.","why":"A large number can create specificity and proof with almost no cognitive load.","research":"Which number actually matters to the viewer and is credible?","researchLabel":"Assets / research needed","build":"One number/result as dominant element, supported by one contextual visual.","buildLabel":"How to build it","formula":"Title explains what the number means or how it happened.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Multiple competing numbers, meaningless vanity metrics, tiny units/context.","jobs":"Reach · Trust · Convert"},"thumbnail::No-Text Scene":{"kind":"THUMBNAIL STRATEGY","best":"Strong visual storytelling, transformations, challenges, products, unusual access.","why":"When the scene itself carries the tension, adding text can make the thumbnail slower and less cinematic.","research":"Find the single frame/scene that creates the strongest unanswered question.","researchLabel":"Assets / research needed","build":"One clear subject, readable stakes, strong composition, no explanatory clutter.","buildLabel":"How to build it","formula":"Title does more verbal work; thumbnail creates emotion or curiosity.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Using no text when the image is actually ambiguous.","jobs":"Reach · Trust"},"thumbnail::Diagram / Whiteboard":{"kind":"THUMBNAIL STRATEGY","best":"Mechanisms, strategy, systems, finance, business, analysis.","why":"Makes an abstract relationship visually concrete and implies explanation/clarity.","research":"What single diagram, arrow, number, relationship, or before/after model can be understood instantly?","researchLabel":"Assets / research needed","build":"Extremely simplified model. One focal insight, not the whole whiteboard.","buildLabel":"How to build it","formula":"Title promises the decision or insight; thumbnail shows the model or surprising relationship.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Tiny writing, full screenshots of complex boards, dozens of boxes/arrows.","jobs":"Trust · Reach · Convert"},"thumbnail::Contradiction / Unexpected Visual":{"kind":"THUMBNAIL STRATEGY","best":"Myths, experiments, curiosity, counterintuitive results, investigations.","why":"Shows something that appears wrong, impossible, or inconsistent with the viewer’s expectation.","research":"What visual contradiction is truthful to the video? What assumption does it violate?","researchLabel":"Assets / research needed","build":"Make the contradiction obvious without relying on deceptive editing.","buildLabel":"How to build it","formula":"Excellent with Reframe, Curiosity and Investigation titles.","formulaLabel":"Title + thumbnail pairing","example":"The thumbnail should communicate the visual idea at phone size before the viewer reads small details.","avoid":"Manufactured deception that the video immediately walks back.","jobs":"Reach · Trust"},"hook::Problem Recognition":{"kind":"HOOK APPROACH","best":"Pain-aware Reach videos, mistakes, diagnosis, tutorials, urgent business problems.","why":"The viewer immediately feels understood and knows the video is about their actual situation.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Name the recognizable moment → make the consequence clear → promise the direction of the fix.","buildLabel":"Opening pattern","formula":"Name the recognizable moment → make the consequence clear → promise the direction of the fix.","formulaLabel":"Hook progression","example":"“If your cash flow keeps getting tighter even though revenue looks fine, the problem usually isn’t your finance team. It’s what leadership is doing before the numbers get there.”","avoid":"Generic “Have you ever…” questions, long setup, describing a pain the title already made obvious without adding anything.","jobs":"Reach"},"hook::Clear Goal":{"kind":"HOOK APPROACH","best":"Tutorials, challenges, experiments, routines, transformations.","why":"A concrete destination gives the viewer an immediate reason to stay.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"State goal → constraint/stakes → first move.","buildLabel":"Opening pattern","formula":"State goal → constraint/stakes → first move.","formulaLabel":"Hook progression","example":"“By the end of this video, you’ll know the exact three moves that stop an over-the-top swing without rebuilding your entire motion.”","avoid":"Overly broad goals, promises that take 45 seconds to explain.","jobs":"Reach · Trust"},"hook::Contradiction":{"kind":"HOOK APPROACH","best":"Myths, reframes, POV, surprising mechanisms, expert commentary.","why":"Creates cognitive tension between what the viewer expects and what the creator is about to prove.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Common belief → contradiction → evidence tease.","buildLabel":"Opening pattern","formula":"Common belief → contradiction → evidence tease.","formulaLabel":"Hook progression","example":"“Cash flow is not a finance problem. In a downturn, it becomes a leadership problem, and the distinction changes what you do next.”","avoid":"Contrarian statement with no evidence or relevance.","jobs":"Reach · Trust"},"hook::Proof First":{"kind":"HOOK APPROACH","best":"Case studies, transformations, product demos, skeptical audiences, authority-led teaching.","why":"Shows evidence before asking the viewer to trust the explanation.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Result/proof → what caused it → what the viewer will learn.","buildLabel":"Opening pattern","formula":"Result/proof → what caused it → what the viewer will learn.","formulaLabel":"Hook progression","example":"“This company recovered $400,000 in working capital in 90 days. The interesting part is they didn’t start by cutting costs.”","avoid":"Cherry-picked proof, result with no context, bragging before relevance.","jobs":"Trust · Convert · Reach"},"hook::Story in Motion":{"kind":"HOOK APPROACH","best":"Personal stories, documentaries, journeys, failures, behind-the-scenes.","why":"Starts inside a consequential moment rather than explaining the story from the beginning.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Active moment → unresolved stakes → minimal context.","buildLabel":"Opening pattern","formula":"Active moment → unresolved stakes → minimal context.","formulaLabel":"Hook progression","example":"“Ten minutes before the meeting, I realized the plan we’d spent three months building was based on the wrong audience.”","avoid":"“Let me take you back…” followed by two minutes of chronology.","jobs":"Trust · Reach"},"hook::Decision Callout":{"kind":"HOOK APPROACH","best":"Comparisons, buyer FAQs, pricing, worth-it, service/product decisions.","why":"Signals that the video is designed to resolve a real choice the viewer is already making.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Decision → criterion that changes the answer → promise of clarity.","buildLabel":"Opening pattern","formula":"Decision → criterion that changes the answer → promise of clarity.","formulaLabel":"Hook progression","example":"“If you’re deciding whether to hire this out or do it yourself, price is actually the wrong first question.”","avoid":"Sales pressure in the first sentence or pretending only one choice can ever be right.","jobs":"Convert · Reach"},"hook::Immediate Result / Cold Open":{"kind":"HOOK APPROACH","best":"Challenges, transformations, investigations, demonstrations, documentaries.","why":"Gives the viewer a high-value moment immediately, then creates curiosity about how it happened.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Show result/moment → raise question → rewind only as much as needed.","buildLabel":"Opening pattern","formula":"Show result/moment → raise question → rewind only as much as needed.","formulaLabel":"Hook progression","example":"“This is the swing after one drill. Thirty minutes earlier, he couldn’t stop cutting across the ball.”","avoid":"Spoiling every payoff, confusing montage without context.","jobs":"Reach · Trust"},"hook::Question / Mystery":{"kind":"HOOK APPROACH","best":"Investigations, experiments, explainers, documentaries, curiosity-led browse.","why":"Creates a clear unresolved question that can structure the entire video.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Specific question → why answer matters → evidence path.","buildLabel":"Opening pattern","formula":"Specific question → why answer matters → evidence path.","formulaLabel":"Hook progression","example":"“Why do businesses with plenty of revenue still run out of cash? The answer shows up long before the bank balance does.”","avoid":"Questions with obvious answers or mystery that is unrelated to viewer stakes.","jobs":"Reach · Trust"},"hook::Stakes / Deadline":{"kind":"HOOK APPROACH","best":"Challenges, launches, crisis/problem videos, time-sensitive decisions, builds.","why":"Time, consequence or constraint creates urgency inside the story without fake scarcity.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"What must happen → by when / or else what → immediate action.","buildLabel":"Opening pattern","formula":"What must happen → by when / or else what → immediate action.","formulaLabel":"Hook progression","example":"“We have seven days to get this patio base ready before the weather turns, and the grade is still wrong.”","avoid":"Artificial deadlines, manufactured drama, stakes only the creator cares about.","jobs":"Reach · Trust · Convert"},"hook::Identity / Viewer Callout":{"kind":"HOOK APPROACH","best":"Highly specific audiences, leadership, life stage, profession, diagnosis, buyer fit.","why":"Makes the right viewer recognize immediately that the video was made for their exact situation.","research":"The hook inherits the title/thumbnail promise. Identify the exact expectation the package created and the first proof/tension needed to fulfill it.","researchLabel":"What to know first","build":"Specific viewer → exact moment/problem → promise.","buildLabel":"Opening pattern","formula":"Specific viewer → exact moment/problem → promise.","formulaLabel":"Hook progression","example":"“If you’re a leader who is still hitting targets but feels completely drained by every decision, this routine is built for that version of you.”","avoid":"Broad demographic labels with no situational specificity.","jobs":"Reach · Trust · Convert"}},"cta":{"Next Problem / Watch Next":{"job":"Reach","why":"A Reach viewer is often not ready for a business ask yet. The strongest continuation is usually the next problem created by the result they just learned.","when":"Use after tutorials, mistakes, explainers, comparisons, beginner videos, experiments and other discovery-led content.","transition":"Resolve the current promise first, then expose the next obstacle naturally: “Now that X is fixed, the next thing that usually gets in the way is Y.”","examples":["“Now that you know how to fix the slice, the next thing that usually kills your distance is what your trail arm does in the downswing.”","“This solves the cash-flow visibility problem. The next issue is what leaders do when the numbers start forcing hard decisions.”","“You’ve got the setup. The next step is making sure the first 30 seconds actually hold the click.”"],"avoid":"“If you want to watch another video…” · “Before you go…” · “That’s it for today…” · unrelated recommended videos.","measure":"End-screen CTR, next-video views, session continuation, returning viewers."},"Series / Playlist Bridge":{"job":"Reach + Trust","why":"A series CTA turns one useful video into a pathway. It is especially strong when the viewer’s problem naturally unfolds in stages.","when":"Use for beginner sequences, transformations, recurring shows, build-in-public, multi-part teaching and topic clusters.","transition":"Place the current video inside a progression: “This is step one. Step two is where most people lose momentum…”","examples":["“This gets your first month stable. Month two is where we start building discovery and packaging around real demand.”","“That fixes the setup. The next video in this series is the move that stops the club from coming over the top.”"],"avoid":"Generic “check out the playlist” language without explaining why the next episode matters.","measure":"Playlist starts, episode-to-episode continuation, returning/regular viewers."},"Resource Bridge":{"job":"Reach + Trust","why":"A practical resource can help the viewer implement what they just learned without forcing a commercial jump.","when":"Use when a checklist, template, calculator, guide, worksheet or reference genuinely makes implementation easier.","transition":"Tie the resource to friction the viewer now feels: “Doing this from memory is the hard part, so I put the full checklist in one place…”","examples":["“The hard part is remembering all ten points while you’re actually reviewing cash flow, so I put the full checklist into a one-page guide.”","“You’ve got the framework. I put the exact planning questions into a worksheet so you can run this on your own channel.”"],"avoid":"Dropping a lead magnet simply because one exists. Avoid “if you want my free PDF…” as the default framing.","measure":"Qualified clicks, opt-ins, resource use, downstream next-step behavior."},"Continue the Idea":{"job":"Trust","why":"Trust grows through depth and consistency. The CTA should feel like the next chapter of the same thought, not a change of subject.","when":"Use after POV, stories, deep teaching, whiteboards, case studies, interviews and belief-shift videos.","transition":"End on a meaningful implication, then continue it: “That changes how you think about X. It also changes how you should approach Y…”","examples":["“Once you stop treating cash flow as a finance problem, the next question becomes how leaders make decisions when the numbers get uncomfortable.”","“That belief shift is only useful when it changes the way you structure the video. That’s what I break down next.”"],"avoid":"Recapping everything, announcing the ending, or inserting an unrelated offer after an emotional/story payoff.","measure":"Next-video CTR, returning viewers, watch depth, subscriber/lead movement."},"Lead Magnet / Deeper Resource":{"job":"Trust","why":"A warm viewer may be ready to move from anonymous viewer to known lead when the resource extends the value rather than interrupting it.","when":"Use when the viewer has enough context to appreciate a more complete system, template, checklist, guide, assessment or email course.","transition":"Make the deeper resource the natural implementation layer: “The video gives you the model. The worksheet lets you actually apply it to your own situation.”","examples":["“You’ve got the five-part framework. I built the worksheet around those exact five decisions so you can map your own plan.”","“The video shows what to look for. The checklist gives you every question in one place while you’re reviewing your channel.”"],"avoid":"Over-selling “free.” Do not interrupt a strong trust moment with aggressive scarcity or a hard sales pitch.","measure":"Opt-in rate, lead quality, email engagement, downstream conversion."},"Conversation / Community":{"job":"Trust","why":"Sometimes the best next action is participation. Comments, community, polls and live interaction can strengthen identification and reveal future content demand.","when":"Use for POV, stories, community questions, debates, live content and videos where audience experience is genuinely valuable.","transition":"Ask for a specific contribution that advances the conversation: “The part I’m most curious about is where this breaks for you…”","examples":["“What’s the part of this process that still feels messy on your side? Drop that below, because those answers will shape the next breakdown.”","“I want to know which of these decisions is hardest in your business right now, not just whether you agree.”"],"avoid":"“Comment below!” with no meaningful question. Engagement bait that does not improve the relationship or research.","measure":"Comment quality, replies, recurring themes, community participation, future topic evidence."},"Fit Bridge":{"job":"Convert","why":"A qualified viewer needs help deciding whether the next step is right for them. Fit clarity reduces pressure and increases trust.","when":"Use after case studies, buyer FAQs, comparisons, pricing/ROI, who-it’s-for, service walkthroughs and offer-led teaching.","transition":"Connect the situation in the video to the viewer’s own situation: “This is built for the person who has X but is stuck at Y…”","examples":["“This is built for creators who already know what they want to say but need a system for turning that into a repeatable content engine.”","“The people who get the most from this already have demand. What they’re missing is the process and accountability to convert it.”"],"avoid":"Pretending everyone is a fit. Avoid “if you’re serious…” pressure language.","measure":"Qualified clicks, applications, booked calls, lead quality, close rate."},"Process Clarity":{"job":"Convert","why":"Uncertainty about what happens next is a major decision barrier. Explaining the next steps makes action feel safer and more concrete.","when":"Use for coaching, consulting, services, healthcare, programs, demos and applications.","transition":"Move from value into process: “The next step isn’t a giant commitment. Here’s exactly what happens first…”","examples":["“The first step is a short strategy call where we identify the actual constraint. From there, you’ll know whether the program even makes sense for you.”","“You start with the assessment, we map the issue, and then you leave with the next 90 days clearly sequenced.”"],"avoid":"Vague “book a call to learn more” CTAs. Hiding what happens after the click.","measure":"Click-to-book rate, application completion, no-show rate, quality of sales conversations."},"Direct Invitation":{"job":"Convert","why":"Once the viewer has enough value, proof, fit and clarity, a direct invitation can be the most respectful next step.","when":"Use when the video is already buyer-stage and the offer directly solves the problem the viewer came to solve.","transition":"The offer should be introduced as the implementation path: “You can build this yourself using what we covered. The program is for the person who wants help installing it faster and with feedback.”","examples":["“You can take this framework and build it yourself. Accelerator is the version where we build the system with you, pressure-test the decisions, and keep it moving every month.”","“The workshop gives you the strategy. The coaching is where we apply it to your actual channel and make the decisions together.”"],"avoid":"Abrupt “buy now” energy, fake urgency, hiding price/process, or pitching before the video has earned the ask.","measure":"Qualified clicks, sales, applications, revenue, lead quality, assisted conversion."},"Application / Booking":{"job":"Convert","why":"For high-consideration services, the action is often not purchase. It is starting a qualification or diagnostic process.","when":"Use for coaching, consulting, premium services, health/professional services and custom offers.","transition":"Explain why the call/application exists and what the viewer gets from taking it.","examples":["“The next step is the Momentum Call. We use that conversation to figure out what you should actually be selling and whether there’s a fit for us to help.”","“The application gives us enough context to tell whether the problem you’re dealing with is something we can actually solve.”"],"avoid":"“Book a call” with no context. Making a sales call sound like a free consulting session if it is not.","measure":"Application starts/completions, booked calls, show rate, qualified opportunity rate, sales."},"Customer / Next-Stage CTA":{"job":"Convert + Retention","why":"The viewer journey does not stop after purchase. Content can move customers toward activation, adoption, retention, referral or the next product.","when":"Use for onboarding videos, implementation walkthroughs, customer education, product updates and advanced training.","transition":"Continue from purchase to progress: “Now that you’re inside, the fastest way to get the first win is…”","examples":["“Your first job isn’t to watch every lesson. Start with the audience section and finish the one-page strategy before touching the video planner.”","“You’ve got the tool installed. The next step is setting up the one workflow that will actually save you time this week.”"],"avoid":"Treating the sale as the end of the funnel or immediately upselling before the customer gets value.","measure":"Activation, completion, product usage, retention, expansion, referrals."}},"portfolio":{"Attention Acquisition":{"title":"Attention Video","what":"A video whose reason for existing is to bring the right new people into the ecosystem.","when":"Use when the current constraint is insufficient qualified discovery or the channel needs a stronger top-of-funnel entry point.","rtc":"Usually Reach","examples":"Outlier topic · high-demand search · browse-led idea · collaboration · transformation · challenge","not":"This is not simply “a video with lots of views.” It should attract people who plausibly belong in the creator’s future audience."},"Evergreen Lead Asset":{"title":"Evergreen Discovery Asset","what":"A durable video designed to keep attracting qualified viewers over time and give some of them a natural path deeper into the business.","when":"Use when the channel needs compounding discovery around a recurring problem, query or buyer-relevant question.","rtc":"Usually Reach + Convert","examples":"Search tutorial · exact buyer question · evergreen comparison · high-intent problem guide","not":"It does not need to hard-pitch. The business movement can come through a resource, lead magnet or next-step path."},"Statement of Intent":{"title":"“This Is What We’re About” Video","what":"A flagship piece that makes the channel’s identity, promise or worldview unusually clear.","when":"Use when new viewers can watch individual videos but still do not understand why they should remember, subscribe or return to this creator.","rtc":"Usually Reach + Trust","examples":"Defining framework · signature belief · big channel promise · flagship problem/solution","not":"This is not a channel trailer. It still needs to be a compelling standalone video."},"Differentiation / POV":{"title":"Differentiation / POV Video","what":"A video designed to make the creator’s judgment, beliefs or unique perspective memorable.","when":"Use when content is useful but interchangeable with competitors, or the audience needs a stronger reason to trust this particular creator.","rtc":"Usually Trust","examples":"Myth/reframe · contrarian-but-defensible POV · “why I do this differently” · belief shift","not":"It should not be a hot take for attention alone. The goal is durable differentiation."},"Repeatable Format Rep":{"title":"Repeat a Proven Format","what":"Another episode or execution of a format that already shows evidence of working.","when":"Use after a format or series has demonstrated audience fit and is worth reinforcing rather than constantly inventing something new.","rtc":"Usually Reach + Trust","examples":"Another audit · another challenge · another interview format · another recurring show episode","not":"Do not repeat the exact topic mechanically. The viewing experience can stay familiar while the episode-level promise stays fresh."},"Binge / Bridge":{"title":"Watch-Next / Bridge Video","what":"A video intentionally designed to connect one viewer problem or idea to the next piece of content.","when":"Use when the channel needs stronger session depth, returning behavior or a clearer sequence between related topics.","rtc":"Usually Trust","examples":"Part two · companion lesson · next problem · playlist bridge · prerequisite/follow-up","not":"This is not “make part 2” by default. The bridge only matters when the next video is genuinely the next useful step."},"Follow-Up / Sequel":{"title":"Follow-Up / Sequel","what":"A video created because existing evidence already says the audience wants more around a proven topic, problem, person or format.","when":"Use after an outlier, strong comment cluster, high-performing section, recurring audience question or clear catalogue winner.","rtc":"Any RTC job","examples":"Deeper version · part two · adjacent problem · new angle · creator/guest follow-up","not":"The follow-up should exploit the signal, not merely repeat the first video."},"Experiment / Exploration":{"title":"Experiment","what":"A deliberate test used to reduce uncertainty and acquire signal about topic, format, package, audience or business response.","when":"Use when there is not enough evidence yet to confidently exploit a direction.","rtc":"Any RTC job","examples":"New format · new topic lane · new title/thumbnail style · new audience angle · different production approach","not":"An experiment needs a hypothesis. Random novelty is not strategic exploration."},"Conversion Asset":{"title":"Decision / Conversion Video","what":"A video created because qualified viewers need help resolving a decision, objection, fit question or next step.","when":"Use when attention and trust exist but the business is not getting enough meaningful action.","rtc":"Usually Convert","examples":"Buyer FAQ · case study · pricing/ROI · service walkthrough · who it’s for · competitor comparison","not":"This is not automatically a sales pitch. The primary value is decision clarity."}},"structures":[{"name":"Problem → Cause → Solution → Application","best":"Tutorials, diagnosis, explainers","jobs":"Reach / Trust"},{"name":"Mistake → Consequence → Correction → Priority","best":"Warnings, audits","jobs":"Reach"},{"name":"Question → Investigation → Discovery → Answer","best":"Tests, investigations","jobs":"Reach / Trust"},{"name":"Comparison → Criteria → Evidence → Trade-offs → Recommendation","best":"Versus, reviews","jobs":"Reach / Convert"},{"name":"Goal → Attempt → Obstacle → Adjustment → Result","best":"Challenges, builds, journeys","jobs":"Reach / Trust"},{"name":"Before → Process → After → Mechanism → Replication","best":"Transformations, cases","jobs":"Reach / Trust / Convert"},{"name":"Story → Conflict → Turn → Lesson → Viewer Application","best":"Personal/founder stories","jobs":"Trust"},{"name":"Old Belief → Evidence → New Belief → Meaning","best":"POV, myths","jobs":"Trust / Reach"},{"name":"Case → Problem → Decisions → Result → Lesson → Fit","best":"Case studies","jobs":"Trust / Convert"},{"name":"Audit → Criteria → Findings → Fixes → Priority","best":"Teardowns, analysis","jobs":"Trust / Reach / Convert"},{"name":"Thesis → Evidence → Counterpoint → Conclusion","best":"Essays, commentary","jobs":"Trust / Reach"},{"name":"Promise → Modules → Examples → Synthesis → Application","best":"Masterclasses","jobs":"Trust / Convert"},{"name":"Objection → Evidence → Decision Criteria → Recommendation","best":"Objection handling","jobs":"Convert"},{"name":"Problem → Proof → Solution → Fit → Action","best":"Offer-led education","jobs":"Convert"},{"name":"Demo → Use Case → Steps → Result → Fit → Action","best":"Product/service demos","jobs":"Convert"},{"name":"FAQ → Direct Answer → Proof → Qualification → Action","best":"Buyer FAQ","jobs":"Convert"},{"name":"Hook → Open Loop → Progression → Payoff → Next Loop","best":"Retention-led long-form","jobs":"All"},{"name":"Immediate Premise → Intrigue → Escalation → Satisfy","best":"Shorts","jobs":"Reach / Trust"}],"experience":{"modes":{"Education":"Viewer primarily returns to learn, solve, understand, or implement.","Entertainment":"Viewer primarily returns for tension, surprise, spectacle, curiosity, or fun.","Companionship":"Viewer primarily returns for the creator, familiarity, access, or shared experience.","Hybrid":"Intentionally combine modes without losing the core promise."},"formats":{"Long-form":"Depth, narrative, teaching, decision support.","Shorts":"Fast discovery, sampling, compressed payoff.","Live":"Real-time interaction, coaching, demos, launches.","Podcast":"Depth, authority, recurring relationship.","Series / Show":"Repeatable viewer expectation and continuation.","Collaboration":"Audience crossover wrapper.","Premiere / Event":"Shared launch moment.","Clip / Highlight":"Self-contained sample into a larger idea."},"layouts":{"Talking Head":"Speaker/message is the value.","Talking Head + B-roll":"Human authority plus visual proof/context.","Screen Recording":"Tutorial, demo, audit, workflow.","Whiteboard / Annotation":"Mechanisms, frameworks, decision logic.","Interview / Dual Cam":"Story, authority, podcast, testimonial.","Roundtable / Panel":"Multiple viewpoints and useful disagreement.","On-location / Field":"Reality, proof, physical process, challenge.","Documentary / VO + B-roll":"Investigation, essay, profile, transformation.","Slides / Presentation":"Masterclass, webinar, data-heavy teaching.","Animation / Motion":"Invisible process or abstract clarity.","Live Multi-source":"Host plus screen plus guest plus chat plus demo.","Hybrid by Beat":"Change presentation only when story, clarity, or proof requires it."}}},"STEPS":[{"id":"strategy","n":"01","name":"Creator Strategy","short":"Source of truth"},{"id":"constraint","n":"02","name":"What’s holding us back right now","short":"Find bottleneck"},{"id":"month","n":"03","name":"What matters this month","short":"Set direction"},{"id":"job","n":"04","name":"Reach / Trust / Convert","short":"Choose job"},{"id":"role","n":"05","name":"Why this video belongs","short":"Why this video"},{"id":"viewer","n":"06","name":"Exact viewer","short":"Who / moment"},{"id":"research","n":"07","name":"Research","short":"Gather evidence"},{"id":"archetype","n":"08","name":"Video type","short":"Choose type"},{"id":"promise","n":"09","name":"Promise","short":"Define payoff"},{"id":"package","n":"10","name":"Title + thumbnail","short":"Get the click"},{"id":"hook","n":"11","name":"Hook","short":"Prove the click"},{"id":"structure","n":"12","name":"Structure","short":"Build the flow"},{"id":"cta","n":"13","name":"Mid-roll + End CTA","short":"Plan both CTAs"},{"id":"handoff","n":"14","name":"Production Handoff","short":"Get it made"},{"id":"learn","n":"15","name":"Publish + learn","short":"Learn from it"},{"id":"final","n":"16","name":"Final video plan","short":"See the build"}],"DEFAULT_STATE":{"step":0,"visitedMax":0,"strategy":{"audience":"","channelGoal":"Qualified growth","businessGoal":"Leads","offer":"","capacity":"4 videos / month"},"constraint":"","diagnosis":{"index":0,"answers":{},"result":null,"manual":false,"applied":false},"mode":"Explore","monthOutcome":"","monthlyMix":{"manual":false,"Reach":0,"Trust":0,"Convert":0},"selectedSlot":0,"job":"","role":"","viewer":{"state":"","stateManual":false,"moment":"","problem":"","desire":"","language":""},"research":[],"archetype":"","promise":{"viewer":"","problem":"","result":"","mechanism":""},"title":"","workingTitle":"","thumbnail":"","thumbnailConcept":"","hook":"","hookDraft":"","structure":"","structureNotes":"","experience":"","format":"","layout":"","production":{"formatManual":false,"layoutManual":false},"midCta":"","midCtaDraft":"","cta":"","ctaDraft":"","handoff":{"owner":"","date":"","assets":""},"learn":{"happened":"","meaning":"","change":"","route":"Next Video"}},"CONSTRAINTS":[["Discovery / not enough qualified viewers","We need more of the right people finding the channel."],["Wrong audience / weak audience fit","Views may exist, but the people arriving are not the people we really want."],["Packaging / weak click","The idea may be strong, but title / thumbnail are not earning the click."],["Retention / satisfaction","People click, but the viewing experience is not holding or satisfying them."],["Trust / returning viewers","Attention exists, but people do not yet believe, remember, return, or deepen the relationship."],["Leads / deeper relationship","The audience watches, but not enough qualified viewers move into a deeper relationship."],["Sales / decision friction","Qualified viewers exist, but they are stuck on proof, fit, process, objections, or action."],["Execution / capacity","The strategy may be fine, but production capacity or consistency is the bottleneck."]],"DIAGNOSIS_QUESTIONS":[{"id":"execution","question":"Are you actually publishing consistently enough to learn from what you’re doing?","help":"Before we blame the strategy, make sure the videos are actually getting out consistently enough for us to learn anything.","checkWhat":"We’re checking whether the biggest problem is simply getting videos made and published. If the plan keeps getting delayed, skipped, or stuck in production, that comes before almost everything else.","evidence":["Planned vs actually published videos","Missed deadlines / stalled edits","How often scope gets reduced or abandoned","Whether the creator/team can sustain the current cadence"],"yesWhen":"Choose YES when the planned cadence is being hit often enough that you have a real sample of published videos to learn from, and production is not the main reason progress is slow.","noWhen":"Choose NO when videos are regularly not shipping, production consistently overruns capacity, or the team spends more time trying to finish videos than learning from them.","unsureWhen":"Choose NOT SURE when you do not know the planned-vs-published rate, the cadence changes constantly, or you cannot tell whether the problem is strategy or simply lack of execution.","example":"Example: The strategy calls for four videos per month, but only one or two consistently publish because scripting/editing keeps slipping. Execution is likely the first constraint.","constraint":"Execution / capacity","noWhy":"The system cannot learn or compound if the plan is not consistently getting produced and published.","unsureWhy":"Before optimizing the channel, verify whether you have enough consistent publishing to trust the rest of the data.","focus":"Simplify scope, remove production bottlenecks, reset cadence, clarify ownership, and make shipping reliable.","check":"Look at the last 6–8 planned uploads. Were they actually produced and published on a repeatable cadence?"},{"id":"discovery","question":"Are enough of the right people actually getting a chance to see the videos?","help":"Before we judge the title, thumbnail, or retention, we need to know whether enough relevant people are even seeing the video.","checkWhat":"We’re not asking whether the views are huge. We’re asking whether enough new, relevant people are actually getting the chance to discover the video.","evidence":["Impressions / browse exposure","Search traffic and search queries","New viewers","Traffic sources","Whether videos reach beyond the existing core audience","Topic demand relative to similar videos"],"yesWhen":"Choose YES when videos are regularly getting meaningful exposure to relevant viewers, enough new people are entering the channel to evaluate what happens next, and discovery is not obviously the weakest link.","noWhen":"Choose NO when strong videos rarely get meaningful exposure, new-viewer entry is weak, search/browse opportunities are limited, or the channel mostly circulates content to the same small existing audience.","unsureWhen":"Choose NOT SURE when you have not looked at impressions, new viewers, traffic sources, or topic demand, or when the channel is too early/small to know whether the current exposure is normal.","example":"Example: A video appears to have decent retention among the people who watch, but it receives very few impressions and almost no new-viewer traffic. Discovery may be the first break.","constraint":"Discovery / not enough qualified viewers","noWhy":"The channel is not creating enough qualified entry points for the rest of the viewer journey to compound.","unsureWhy":"Before diagnosing clicks or retention, verify whether the channel is creating enough qualified discovery opportunities.","focus":"Improve topic selection, demand research, search/browse entry points, outlier research, and qualified audience acquisition.","check":"Look at impressions, traffic sources, new viewers, topic demand, and whether videos are being exposed beyond the existing core audience."},{"id":"audiencefit","question":"Are the people watching actually the kind of people we want more of?","help":"A video can get views and still attract the wrong audience. We want to know whether the people showing up actually fit the channel and the business.","checkWhat":"We’re checking quality, not just size. Are these people likely to care about more videos from this creator, trust them over time, and potentially fit the business?","evidence":["Comments and questions from viewers","Which topics attract the most views","Returning viewers by topic","Lead quality","Subscriber behavior","Whether high-view videos connect naturally to the channel's core promise"],"yesWhen":"Choose YES when the people engaging with the strongest videos sound like the intended audience, the topics that grow the channel are aligned with the creator's long-term promise, and leads/viewers are generally qualified.","noWhen":"Choose NO when the biggest videos attract people who only care about a side topic, leads are poorly qualified, comments reveal a different audience than intended, or growth repeatedly pulls the channel away from its real positioning.","unsureWhen":"Choose NOT SURE when you have not compared who watches different topics, lead quality, viewer comments, or returning behavior, and you are mostly judging by total views.","example":"Example: A leadership channel gets its biggest views from generic celebrity reactions, but those viewers rarely watch the leadership videos or become qualified leads. Audience fit is likely the issue.","constraint":"Wrong audience / weak audience fit","noWhy":"Attention exists, but it is coming from viewers who are poorly aligned with the channel's real audience, promise, or business path.","unsureWhy":"Before optimizing packaging or conversion, verify whether the attention you are earning is coming from the right people.","focus":"Clarify the exact viewer, positioning, topic boundaries, channel promise, and the language/problems that attract the intended audience.","check":"Compare top-performing topics, comments, returning viewers, lead quality, and who is actually responding to the content."},{"id":"packaging","question":"When the right people see the video, do they actually want to click it?","help":"This helps us separate a click problem from a content problem.","checkWhat":"We’re checking whether the idea, title, and thumbnail make the video feel worth clicking. Don’t judge this from one CTR number. Compare similar videos, topics, and traffic sources on the same channel.","evidence":["CTR in context","Browse vs search CTR","Title clarity / tension / specificity","Thumbnail clarity and focal point","Whether title + thumbnail complement each other","Whether strong topics underperform only at the click"],"yesWhen":"Choose YES when relevant viewers are clicking at a healthy rate relative to similar videos/traffic sources on this channel, packages are generally clear, and weak performance is more likely happening after the click.","noWhen":"Choose NO when videos receive relevant impressions but consistently earn weak clicks compared with similar opportunities, titles/thumbnails feel unclear or generic, or stronger packaging tests materially improve performance.","unsureWhen":"Choose NOT SURE when you are looking at one raw CTR number without traffic-source context, the videos have too few impressions to compare fairly, or you have not reviewed title/thumbnail patterns across multiple videos.","example":"Example: Browse impressions are healthy, but multiple videos aimed at the right audience get clicked far less than comparable videos on the same channel. Packaging is a likely constraint.","constraint":"Packaging / weak click","noWhy":"The channel is earning opportunities with relevant viewers, but the package is not making the value of the click compelling or clear enough.","unsureWhy":"Before changing the content itself, verify whether relevant viewers are choosing the video when they see it.","focus":"Improve topic framing, promise clarity, title direction, thumbnail concept, packaging-pattern research, and package-to-hook alignment.","check":"Review CTR in context, traffic source, topic strength, title/thumbnail clarity, and whether the package accurately represents the payoff."},{"id":"retention","question":"Once they click, do they actually stay and get what they came for?","help":"Getting the click is only half the job. The video still has to quickly show them they made the right choice and keep delivering.","checkWhat":"We’re checking what happens after the click. Does the opening match the promise? Is the video easy to follow? Does it stay useful and actually deliver the payoff?","evidence":["First 30-second retention","Early drop-offs","Average percentage viewed","Top moments / dips","Comments about pacing or clarity","Whether viewers reach the promised payoff","Watch-next behavior"],"yesWhen":"Choose YES when viewers generally survive the opening, the biggest retention losses have understandable context rather than a systemic pattern, and the video delivers enough satisfaction for viewers to continue or respond positively.","noWhen":"Choose NO when clicks are healthy but viewers consistently leave early, intros take too long to fulfill the package, major sections lose attention, or the payoff is delayed/weak relative to the promise.","unsureWhen":"Choose NOT SURE when you have not reviewed the retention curve, are only looking at average view duration, or do not know whether the main drop-offs happen before or after the promise is fulfilled.","example":"Example: A video gets strong CTR, but a large share of viewers leave during a long introduction before the promised teaching starts. Retention/satisfaction is likely the first break.","constraint":"Retention / satisfaction","noWhy":"The package is earning the click, but the viewing experience is losing interest, engagement, or satisfaction after the click.","unsureWhy":"Before diagnosing trust or leads, verify whether viewers are actually staying long enough and feeling the promise was fulfilled.","focus":"Improve hook alignment, structure, pacing, proof, examples, progression, payoff timing, and remove repetition or unnecessary runway.","check":"Review first-30-second retention, major drop-offs, top moments, average percentage viewed, comments, and whether the payoff arrives when expected."},{"id":"trust","question":"Do people come back, remember the creator, and want more from them?","help":"Someone can like one video and still never come back. We’re checking whether the channel is actually building a relationship over time.","checkWhat":"We’re checking whether one good view turns into familiarity, trust, repeat viewing, and a clearer reason to keep watching this creator.","evidence":["Returning / casual / regular viewers","Subscribers relative to relevant views","Comments that reflect belief or connection","Next-video / playlist behavior","Recurring-format performance","Whether viewers can articulate the creator's unique POV/value"],"yesWhen":"Choose YES when viewers increasingly return, watch multiple videos, respond to the creator's POV/proof, and the relationship appears to deepen beyond one-off utility.","noWhen":"Choose NO when individual videos perform but viewers rarely return, the creator feels interchangeable, comments are mostly transactional one-off questions, or there is weak continuation into other content.","unsureWhen":"Choose NOT SURE when you have not looked at returning viewers, repeat viewing, subscriber behavior, or whether viewers move from one useful video into a broader relationship with the creator.","example":"Example: Tutorials get decent views and retention, but almost every viewer arrives for one answer and disappears. The channel may have a Trust/continuity constraint.","constraint":"Trust / returning viewers","noWhy":"Individual videos may work, but the audience relationship is not compounding into familiarity, belief, differentiation, or continuation.","unsureWhy":"Before pushing harder on leads, verify whether viewers are actually becoming warmer and more connected to the creator/channel.","focus":"Create stronger proof, POV, recurring formats, stories, process access, continuity, watch-next paths, and reasons to return.","check":"Look at returning/casual/regular viewers, subscribers, comments, repeat viewing, next-video behavior, and whether people can explain why this creator is different."},{"id":"leads","question":"Do the right viewers actually take the next step after watching?","help":"This checks whether the content is actually moving people into the business, not just getting watched.","checkWhat":"We’re checking the bridge between the video and the next step, like a resource, email list, registration, inquiry, consultation, or community.","evidence":["Qualified link clicks","Opt-ins / registrations","Lead magnet conversion","CTA response","Inquiry quality","Video-to-funnel continuity","Which videos actually create leads"],"yesWhen":"Choose YES when qualified viewers reliably take the intended deeper step and the lead path feels like a natural continuation of the content.","noWhen":"Choose NO when viewers watch and trust the content but rarely click, opt in, inquire, register, or move deeper, or when the CTA/lead magnet feels disconnected from the video's promise.","unsureWhen":"Choose NOT SURE when tracking is weak, links/UTMs are missing, you do not know which videos create leads, or you cannot distinguish lead quantity from lead quality.","example":"Example: The channel has strong returning viewers and comments, but almost nobody moves into the email list or consultation path. Leads/viewer journey may be the constraint.","constraint":"Leads / deeper relationship","noWhy":"The audience is watching and warming up, but the content journey is not creating enough qualified opt-ins, clicks, registrations, inquiries, or deeper relationships.","unsureWhy":"Before diagnosing sales, verify whether qualified viewers are actually entering the business/funnel path in meaningful numbers.","focus":"Improve CTA continuation, lead magnet/resource fit, funnel alignment, transition language, offer relevance, and the path between video and next step.","check":"Look at qualified clicks, opt-ins, registrations, inquiries, lead quality, CTA behavior, and whether the next step logically continues the video's promise."},{"id":"sales","question":"When good leads get close to buying, do they actually take action?","help":"At this point, getting more views probably isn’t the main issue. Something about the decision, proof, fit, process, price, risk, or offer may still be getting in the way.","checkWhat":"We’re checking what stops good prospects once they’re already close to a decision. That could be the content, the sales process, the positioning, or the offer itself.","evidence":["Booking/application conversion","Close rate","Common sales objections","Reasons qualified people say no","Price / ROI concerns","Case-study/proof gaps","Process confusion","Offer fit"],"yesWhen":"Choose YES when qualified leads generally understand the offer, the close/decision process works reasonably well, and there is no obvious repeated objection or conversion break.","noWhen":"Choose NO when qualified people consistently hesitate on the same objections, applications/bookings do not convert, proof is insufficient, fit/process is unclear, or the offer itself appears misaligned.","unsureWhen":"Choose NOT SURE when you do not have enough sales-call notes, conversion data, objection tracking, or lead-quality context to know why qualified people do not act.","example":"Example: YouTube creates qualified consultation bookings, but many prospects repeatedly hesitate because they do not understand ROI or what happens after they buy. Sales/decision friction is likely the constraint.","constraint":"Sales / decision friction","noWhy":"Qualified people are reaching the decision stage, but something is preventing the intended purchase, booking, application, or commitment.","unsureWhy":"Before increasing top-of-funnel volume, verify what is happening with qualified people who already reach the decision stage.","focus":"Address objections, proof, fit, price/ROI, alternatives, process clarity, buyer FAQs, case studies, and offer alignment.","check":"Review sales calls, booking/application quality, close rate, objections, support questions, drop-off points, and common reasons qualified people do not act."}],"RTC_MIX_WEIGHTS":{"Discovery / not enough qualified viewers":{"Reach":0.7,"Trust":0.3,"Convert":0},"Wrong audience / weak audience fit":{"Reach":0.5,"Trust":0.5,"Convert":0},"Packaging / weak click":null,"Retention / satisfaction":{"Reach":0.25,"Trust":0.55,"Convert":0.2},"Trust / returning viewers":{"Reach":0.2,"Trust":0.65,"Convert":0.15},"Leads / deeper relationship":{"Reach":0.2,"Trust":0.5,"Convert":0.3},"Sales / decision friction":{"Reach":0.15,"Trust":0.25,"Convert":0.6},"Execution / capacity":null},"BUSINESS_MIX_WEIGHTS":{"Leads":{"Reach":0.4,"Trust":0.4,"Convert":0.2},"Sales":{"Reach":0.3,"Trust":0.3,"Convert":0.4},"Authority":{"Reach":0.3,"Trust":0.6,"Convert":0.1},"Audience growth":{"Reach":0.6,"Trust":0.3,"Convert":0.1}},"JOBS":{"Reach":{"purpose":"Get the right people to notice you","viewer":"Mostly new viewers who may not know you yet","measure":"Qualified discovery, impressions, views, new viewers, traffic sources, CTR in context, first-30-second retention."},"Trust":{"purpose":"Help people trust and remember you","viewer":"People who already know you a little and need more reason to believe","measure":"Watch time, retention quality, returning viewers, comments, subscribers, next-video behavior, opt-ins."},"Convert":{"purpose":"Help the right people take the next step","viewer":"People who are already considering a decision or next step","measure":"Qualified clicks, opt-ins, bookings, applications, registrations, purchases, conversion rate, lead quality."}},"PRIMARY_ARCH":{"Reach":["How-To","Start Here","Mistakes","Explainer","Myth/Reframe","Comparison","Ranking","Review","Reaction","Experiment","Challenge","Investigation","Transformation","Documentary","Collaboration"],"Trust":["Personal Story","Failure/Lesson","POV","Behind the Scenes","Day in the Life","Process Breakdown","Masterclass","Whiteboard","Case Study","Audit","Interview","Roundtable","Live Q&A","Build in Public","Recurring Show"],"Convert":["Product Demo","Service Walkthrough","Buyer FAQ","Objection Handling","Pricing/ROI","Worth It?","Who It's For","Competitor Comparison","DIY vs DFY","Testimonial","Webinar","Launch","Before You Buy"]},"JOB_RESEARCH":{"Reach":["Direct-niche outliers","Audience evidence","Search / explicit intent","Packaging-pattern research"],"Trust":["Audience evidence","Story / proof research","Own-channel evidence","Catalogue / post-publish evidence"],"Convert":["Buyer research","Story / proof research","Search / explicit intent","Audience evidence"]},"CONSTRAINT_RESEARCH":{"Discovery / not enough qualified viewers":["Direct-niche outliers","Search / explicit intent","Packaging-pattern research","Own-channel evidence"],"Wrong audience / weak audience fit":["Audience evidence","Own-channel evidence","Direct-niche outliers"],"Packaging / weak click":["Packaging-pattern research","Direct-niche outliers","Own-channel evidence"],"Retention / satisfaction":["Catalogue / post-publish evidence","Own-channel evidence","Story / proof research"],"Trust / returning viewers":["Audience evidence","Story / proof research","Own-channel evidence"],"Leads / deeper relationship":["Audience evidence","Buyer research","Catalogue / post-publish evidence"],"Sales / decision friction":["Buyer research","Story / proof research","Search / explicit intent"],"Execution / capacity":["Own-channel evidence","Audience evidence"]},"CONSTRAINT_JOBS":{"Discovery / not enough qualified viewers":["Reach"],"Wrong audience / weak audience fit":["Reach","Trust"],"Packaging / weak click":["Reach","Trust"],"Retention / satisfaction":["Trust","Reach"],"Trust / returning viewers":["Trust"],"Leads / deeper relationship":["Trust","Convert"],"Sales / decision friction":["Convert"],"Execution / capacity":[]},"JOB_ROLES":{"Reach":["Attention Acquisition","Evergreen Lead Asset","Follow-Up / Sequel","Experiment / Exploration","Statement of Intent"],"Trust":["Differentiation / POV","Repeatable Format Rep","Binge / Bridge","Follow-Up / Sequel","Statement of Intent","Experiment / Exploration"],"Convert":["Conversion Asset","Evergreen Lead Asset","Follow-Up / Sequel","Experiment / Exploration"]},"JOB_TITLES":{"Reach":["Problem / Mistake / Risk","Result / Transformation","Search / Explicit Intent","Curiosity / Open Loop","Beginner / Start Here"],"Trust":["Belief / Reframe","Proof / Authority","Story / Stakes","Curiosity / Open Loop","Specificity / Constraint"],"Convert":["Comparison / Decision","Proof / Authority","Problem / Mistake / Risk","Specificity / Constraint","Search / Explicit Intent"]},"JOB_THUMBS":{"Reach":["Problem / Tension","Visual Proof","Comparison / Choice","Transformation / Before-After","Contradiction / Unexpected Visual"],"Trust":["Visual Proof","Face + Visual Clue","Diagram / Whiteboard","No-Text Scene","Transformation / Before-After"],"Convert":["Visual Proof","Comparison / Choice","Object as Stakes","Number / Result","Diagram / Whiteboard"]},"JOB_HOOKS":{"Reach":["Problem Recognition","Clear Goal","Contradiction","Immediate Result / Cold Open","Question / Mystery"],"Trust":["Proof First","Story in Motion","Contradiction","Identity / Viewer Callout","Clear Goal"],"Convert":["Decision Callout","Proof First","Identity / Viewer Callout","Clear Goal","Stakes / Deadline"]},"JOB_CTA":{"Reach":["Next Problem / Watch Next","Series / Playlist Bridge","Resource Bridge"],"Trust":["Continue the Idea","Lead Magnet / Deeper Resource","Conversation / Community","Resource Bridge"],"Convert":["Fit Bridge","Process Clarity","Direct Invitation","Application / Booking","Customer / Next-Stage CTA"]},"MID_CTA_DETAILS":{"No mid-roll CTA":{"what":"Keep the video uninterrupted. This is a real strategic choice when a CTA would hurt the flow more than it helps.","when":"Best for Shorts, very story-driven videos, emotional sections, or videos where there is no natural next step yet."},"Resource Bridge":{"what":"Briefly point to a useful checklist, guide, tool, template, or related resource that helps the viewer apply what you just taught.","when":"Best when the viewer has just understood the problem and a practical resource genuinely makes the next step easier."},"Lead Magnet / Deeper Resource":{"what":"Offer a free deeper resource while the viewer is actively feeling the need for it.","when":"Best when Leads matter and the resource is a direct continuation of the exact problem being discussed."},"Conversation / Community":{"what":"Invite the viewer into a useful conversation, comment prompt, group, or community without stopping the video for a hard pitch.","when":"Best for Trust videos, personal stories, POVs, interviews, and recurring shows where relationship is part of the value."},"Fit Bridge":{"what":"Briefly call out who the paid offer is for and connect it to the exact situation the viewer is watching.","when":"Best for high-intent viewers when the offer naturally solves the problem being demonstrated."},"Process Clarity":{"what":"Answer the quick 'what would working with you / using this actually look like?' question without turning the middle of the video into a sales section.","when":"Best for services, coaching, products, demos, case studies, and buyer-focused videos."},"Direct Invitation":{"what":"A short direct invitation to take the business action now, then immediately return to the content.","when":"Best for high-intent Convert videos where the viewer already understands the problem and the offer is highly relevant."}},"PRACTICAL":{"research":{"Own-channel evidence":"Look at your own channel first. What topics, titles, thumbnails, hooks, and formats have already worked or failed? Use this when you have enough history to learn from your own audience instead of guessing.","Audience evidence":"Go straight to the audience. Look at comments, questions, DMs, polls, objections, and repeated frustrations. Use this when you need to hear the problem in the viewer’s own words.","Direct-niche outliers":"Find videos in the niche that did way better than that creator normally does. You’re looking for signals around topic, angle, format, title, and thumbnail, not something to copy word for word.","Adjacent-niche formats":"Study formats working in nearby categories with similar viewer psychology. Use this when your niche feels repetitive and you need a proven format that can be translated into your topic.","Outside-niche inspiration":"Borrow transferable formats from completely different categories, such as challenges, experiments, transformations, rankings, or documentaries. Best when you are exploring and need fresh creative territory.","Search function compressImage(file,cb){
 const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=800,scale=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)
}

 if(a==='add-research-ref'){v.research.refs.push({title:'',url:'',note:''});save();render();return}

 if(a==='handoff-month'){handoffDrawer('Month handoff',handoffMonth(c),slug(c.name)+'-month.md');return}
 if(a==='handoff-video'){handoffDrawer('Video handoff',handoffVideo(c,v),slug(v?.package?.finalTitle||v?.title)+'-handoff.md');return}
 if(a==='handoff-learning'){handoffDrawer('Learning handoff',handoffLearning(c,v),slug(v?.package?.finalTitle||v?.title)+'-learning.md');return}
 if(a==='handoff-calendar'){handoffDrawer('Calendar handoff',handoffCalendar(c),slug(c.name)+'-calendar.md');return}
 if(a==='copy-drawer-handoff'){copyText($('#handoffText')?.value||'');return}
 if(a==='download-drawer-handoff'){download(t.dataset.name||'handoff.md',$('#handoffText')?.value||'');return}
 if(a==='print-view'){window.print();return}
 if(a==='calendar-month'){state.calendarCursor=t.dataset.month;save();render();return}
 if(a==='calendar-today'){state.calendarCursor=monthKey();save();render();return}
 if(a==='calendar-filter'){state.calendarFilter=t.dataset.filter;save();render();return}
 if(a==='calendar-day'){calendarModal(t.dataset.date);return}
 if(a==='add-calendar'){calendarModal(today());return}
 if(a==='edit-event'){const item=c.events.find(x=>x.id===t.dataset.id);calendarModal(item?.date||today(),item);return}

 if(a==='edit-commitment'){const item=c.commitments.find(x=>x.id===t.dataset.id);if(item)commitmentModal(item);return}

 if(a==='override-signal'){v.analytics.signalOverrides[t.dataset.key]=t.dataset.value;save();render();return}

 if(a==='learn-help'){openDrawer('How to read results',`<div class="drawer-section"><h3>Compare like with like</h3><p>Use the creator’s own comparable videos, job, traffic source and maturity before generic benchmarks.</p></div><div class="drawer-section"><h3>Diagnose in order</h3><p>Opportunity → Click → Opening → Experience → Action. Stop at the first meaningful break. Do not blame CTA when the video never earned the click.</p></div><div class="drawer-section"><h3>Learning is not a recap</h3><p>Observe facts, interpret the most likely cause, set confidence, decide what changes, then route it back into the exact system layer.</p></div>`);return}
 if(a==='guide-cat'){state.guideCat=t.dataset.cat;state.guideSearch='';save();render();return}

 if(a==='session-prev'){syncSessionDraft();state.sessionStep=Math.max(0,state.sessionStep-1);renderSessionModal();return}
 if(a==='session-next'){syncSessionDraft();state.sessionStep=Math.min(3,state.sessionStep+1);renderSessionModal();return}
 if(a==='close-modal-go-diagnosis'){syncSessionDraft();closeModal();c.strategyFlowStep=1;c.strategyTab='flow';state.view='strategy';save();render();return}
 if(a==='save-session'){

function refreshFlowGate(){
 const foot=document.querySelector('.flow-footer');if(!foot)return;
 let missing=[];if(state.view==='planner'&&video())missing=videoGate(video());else if(state.view==='strategy')missing=strategyGate(creator());else return;

 if(next)next.disabled=!ready;
}

function handleChange(e){

 if(el.matches('[data-action="switch-creator"]')){state.currentCreatorId=el.value;const c=creator();state.currentVideoId=c.videos?.[0]?.id||'';state.view='home';save();render();window.scrollTo(0,0);return}

   const f=el.files?.[0],i=Number(el.dataset.uploadRef),v=video();if(!f||!v)return;compressImage(f,src=>{v.package.refs[i]={name:f.name,src};save();render();toast('Reference added')});return
 }
 if(el.id==='importJson'&&el.files?.[0]){
   const r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();closeModal();render();toast('Imported')}catch(err){toast('Could not import JSON')}};r.readAsText(el.files[0]);return
 }
 if(el.matches('[data-bind]')){handleInput(e);render()}
}
document.addEventListener('click',handleClick);

document.addEventListener('change',handleChange);

<script id="v12-protocol-surface-script">

function v12MdHtml(text){

  if(line.startsWith('### ')){out+=`<h4>${esc(line.slice(4))}</h4>`;continue}

function v12PlanMonth(c){const p=ensureQuarterPlan(c),a=p?.activeMonth||1,m=p?.months?.[a-1];if(!m)return '<div class="empty-state">Build the 90-day plan first.</div>';if(typeof v14Ensure==='function')v14Ensure(c);return `${decisionHead(`Month ${a} · Current chapter`,'What are we actually trying to accomplish in this batch?','',m.title)}<div class="fields">${field('Month outcome / coaching focus','month.outcome',c.month.outcome,{scope:'creator',type:'textarea',full:true,rows:3})}${field('Learning question','month.learningQuestion',c.month.learningQuestion,{scope:'creator',type:'textarea',full:true,rows:3})}</div>${typeof v14CapacitySection==='function'?v14CapacitySection(c):''}${typeof v14ModeUI==='function'?v14ModeUI(c):''}${typeof v14MixUI==='function'?v14MixUI(c):''}<div class="selected-guide"><div class="grid"><div><b>Video types to favor</b><p>${esc(m.videoTypes.join(' · '))}</p></div><div><b>Why this chapter exists</b><p>${esc(m.why)}</p></div></div></div><div class="actions" style="margin-top:16px"><button class="tinybtn" data-action="v11-edit-month" data-month="${a}">Edit chapter details</button></div>`}

renderVideos=function(){
