<script id="v15-framework-script">
(()=>{
 if(window.__v15Framework)return;window.__v15Framework=true;

 const fwText=v=>Array.isArray(v)?v.join(' · '):(v||'');
 const fwResearch=()=>Object.entries(P.SOURCE_DATA?.research||{}).map(([name,d],i)=>`<details><summary><span class="fw-index">${String(i+1).padStart(2,'0')}</span><b>${esc(name)}</b><span>${esc(d.use||d.what||'')}</span></summary><div class="fw-detail-body"><div><label>What it is</label><p>${esc(d.what||'')}</p></div><div><label>Best use</label><p>${esc(d.use||'')}</p></div><div><label>Questions to answer</label><p>${esc(fwText(d.questions))}</p></div><div><label>Output</label><p>${esc(d.output||'')}</p></div><div><label>What it can change</label><p>${esc(d.change||'')}</p></div><div><label>Avoid</label><p>${esc(d.avoid||'')}</p></div>${d.steps?`<div class="full"><label>Process</label><p>${esc(fwText(d.steps))}</p></div>`:''}</div></details>`).join('');
 const fwTypes=job=>(P.PRIMARY_ARCH?.[job]||[]).map(name=>`<button title="${esc(P.SOURCE_DATA?.archetypes?.[name]?.what||'')}">${esc(name)}</button>`).join('');
 const fwFormulaCol=job=>`<div class="fw-rule-col"><h3>${esc(job)}</h3><h4>Title directions</h4><p class="fw-chipline">${esc(fwText(P.JOB_TITLES?.[job]))}</p><h4>Thumbnail directions</h4><p class="fw-chipline">${esc(fwText(P.JOB_THUMBS?.[job]))}</p><h4>Opening directions</h4><p class="fw-chipline">${esc(fwText(P.JOB_HOOKS?.[job]))}</p><h4>Natural CTA families</h4><p class="fw-chipline">${esc(fwText(P.JOB_CTA?.[job]))}</p></div>`;
 const fwResearchDetails=fwResearch();

 function renderFramework(){
   const c=creator?.();
   const currentVideo=c?.videos?.find(x=>x.id===state.currentVideoId)||c?.videos?.[0];
   const exampleTitle=currentVideo?.package?.finalTitle||currentVideo?.package?.workingTitle||currentVideo?.title||'The 3-Second Activation Before Every Senior Golf Shot';
   const exampleJob=currentVideo?.job||'Reach';
   const exampleRole=currentVideo?.role||'Follow-Up / Sequel';
   return `<section class="page fw-page">
    <div class="fw-hero">
      <div><div class="kicker">Framework guide</div><h1>The whole system, without putting the whole system in your face.</h1><p class="lead">Use the normal workflow to make the next decision. Use this guide when you need to understand the full process, why a decision exists, what evidence should drive it, and what that decision changes downstream.</p></div>
      <div class="fw-hero-note"><h3>Two layers, one system</h3><p><b>Workflow:</b> the few decisions you need right now.</p><p><b>Framework:</b> the reasoning, dependencies, definitions and full process behind those decisions.</p><p><b>Library:</b> the wider universe of formulas, archetypes, research methods and examples.</p><div class="actions"><button class="btn dark" data-view="videos">Use the workflow</button><button class="btn" data-view="library">Open decision library</button></div></div>
    </div>
    <div class="fw-layout">
      <aside class="fw-toc"><div class="eyebrow">In this guide</div>
        <a href="#fw-start">01 · System map</a><a href="#fw-decisions">02 · Decisions compound</a><a href="#fw-funnel">03 · Reach / Trust / Convert</a><a href="#fw-testing">04 · Explore / Exploit</a><a href="#fw-research">05 · Research</a><a href="#fw-types">06 · Video types</a><a href="#fw-package">07 · Packaging</a><a href="#fw-hook">08 · Hook + structure</a><a href="#fw-cta">09 · CTA + conversion</a><a href="#fw-planning">10 · 90-day + monthly</a><a href="#fw-loop">11 · Learning loop</a><a href="#fw-example">12 · Worked example</a><a href="#fw-coach">13 · Coach reasoning</a>
        <div class="fw-toc-rule"></div><p>If an upstream choice changes, re-check every downstream choice that depends on it.</p>
      </aside>
      <div class="fw-main">

       <section class="fw-section" id="fw-start"><div class="fw-section-head"><div class="fw-num">01</div><div><h2>System map</h2><p>The Accelerator is a decision chain, not a collection of disconnected tools. Start upstream, diagnose the real constraint, then let each choice narrow the next one.</p></div></div>
        <div class="fw-thesis"><b>The operating principle</b><p>Strategy sets the destination. Diagnosis identifies the current bottleneck. The 90-day plan chooses the chapter. The month chooses what to learn or scale. Each video gets a specific job. Packaging creates the promise. The content proves it. The CTA continues it. Performance routes learning back to the exact layer that should change.</p></div>
        <div class="fw-map">
          <div class="fw-map-step"><small>01 · Foundation</small><h3>Audience + business</h3><p>Who are we serving, what problem space do we own, and what business outcome should the channel support?</p><b>Sets the boundaries.</b></div>
          <div class="fw-map-step"><small>02 · Diagnosis</small><h3>Find the constraint</h3><p>Discovery, audience fit, packaging, retention, trust, leads, sales, or execution. Do not solve the wrong problem well.</p><b>Sets the priority.</b></div>
          <div class="fw-map-step"><small>03 · Strategy</small><h3>90-day chapter</h3><p>Choose a destination, hypothesis and sequence of monthly chapters that attack the constraint in order.</p><b>Sets the learning agenda.</b></div>
          <div class="fw-map-step"><small>04 · Portfolio</small><h3>Month + funnel mix</h3><p>Explore or exploit, then allocate Reach, Trust and Convert slots based on the actual bottleneck and capacity.</p><b>Sets what gets made.</b></div>
          <div class="fw-map-step"><small>05 · Video</small><h3>Job → viewer → idea</h3><p>Give each upload one primary job, one exact viewer state, one research-backed idea and one content archetype.</p><b>Sets the promise.</b></div>
          <div class="fw-map-step"><small>06 · Execution</small><h3>Package → opening → proof</h3><p>Build the click promise first, confirm it immediately, then structure the proof and experience around delivering it.</p><b>Sets what the viewer experiences.</b></div>
          <div class="fw-map-step"><small>07 · Pathway</small><h3>CTA + next step</h3><p>Move the viewer to the next useful action that matches their readiness, not simply the action the business wants most.</p><b>Sets continuation.</b></div>
          <div class="fw-map-step"><small>08 · Learning</small><h3>Publish → review → route</h3><p>Observe results, interpret the likely cause, choose confidence, decide what changes, and route that learning upstream.</p><b>Improves the next cycle.</b></div>
        </div>
        <div class="fw-callout" data-tone="green"><b>Simple does not mean shallow</b><p>The working screens should hide most of this until it matters. This guide keeps the full logic available so simplicity never turns into context-free clicking.</p></div>
       </section>

       <section class="fw-section" id="fw-decisions"><div class="fw-section-head"><div class="fw-num">02</div><div><h2>How decisions compound</h2><p>Every important decision has inputs and downstream consequences. The easiest way to break the system is to change an upstream assumption without updating the pieces built on top of it.</p></div></div>
        <div class="fw-chain">
          <div class="fw-chain-row"><div class="fw-chain-head">Decision</div><div class="fw-chain-head">Decide it from</div><div class="fw-chain-head">What it changes next</div></div>
          <div class="fw-chain-row"><div>Audience + desired outcome</div><p>Customer evidence, channel history, business model, exact language, stakes and capacity.</p><p>Diagnosis, topic boundaries, viewer callouts, proof, offer fit and success metrics.</p></div>
          <div class="fw-chain-row"><div>Constraint</div><p>Where the chain is actually weak: discovery, fit, click, retention, trust, leads, sales or execution.</p><p>90-day priority, monthly mix, research emphasis and what not to optimize yet.</p></div>
          <div class="fw-chain-row"><div>Month mode + mix</div><p>Strength of evidence, unresolved unknowns, capacity and the current constraint.</p><p>How many bets to make, how repetitive to be, and the balance of Reach, Trust and Convert.</p></div>
          <div class="fw-chain-row"><div>Video job + role</div><p>Monthly objective, funnel need and the specific reason this slot exists.</p><p>Viewer state, research method, archetype, title family, thumbnail direction, metrics and CTA.</p></div>
          <div class="fw-chain-row"><div>Exact viewer state</div><p>What this person already knows, feels, fears and wants at the moment of the click.</p><p>Promise wording, specificity, required proof, opening language and next step.</p></div>
          <div class="fw-chain-row"><div>Research + idea</div><p>The unknown you need to resolve and the evidence source best suited to resolve it.</p><p>Topic priority, angle, format, proof plan, package hypothesis and production assets.</p></div>
          <div class="fw-chain-row"><div>Package</div><p>Proven demand, viewer tension, competitive context and a promise the video can actually deliver.</p><p>Opening, structure, proof sequence, filming assets and expectation management.</p></div>
          <div class="fw-chain-row"><div>Learning</div><p>Performance against comparable videos and the primary job of the upload.</p><p>Next video, monthly plan, strategy, packaging system or research system.</p></div>
        </div>
        <div class="fw-thesis"><b>Dependency rule</b><p>If you change the audience, viewer state, job, idea or package, re-check everything below it. A strong hook for the wrong promise is still wrong. A strong CTA for the wrong stage is still wrong.</p></div>
       </section>

       <section class="fw-section" id="fw-funnel"><div class="fw-section-head"><div class="fw-num">03</div><div><h2>Reach, Trust and Convert</h2><p>These are content jobs, not rigid genres. A video can help more than one layer, but it needs one primary job so the idea, package, experience and measurement stay coherent.</p></div></div>
        ${['Reach','Trust','Convert'].map(job=>{const d=P.JOBS[job]||{};const role=(P.JOB_ROLES[job]||[]).join(' · ');return `<div class="fw-lane"><div class="fw-lane-name">${job}<span>${esc(d.purpose||'')}</span></div><div class="fw-lane-body"><div class="fw-lane-cell"><label>Viewer</label><p>${esc(d.viewer||'')}</p></div><div class="fw-lane-cell"><label>Success looks like</label><p>${esc(d.measure||'')}</p></div><div class="fw-lane-cell"><label>Common roles</label><p>${esc(role)}</p></div><div class="fw-lane-cell"><label>Downstream effect</label><p>${job==='Reach'?'Bias toward clear discovery promises, fast click confirmation and watch-next continuation.':job==='Trust'?'Bias toward depth, proof, POV, memory, returning behavior and a deeper relationship path.':'Bias toward decision support, fit, objection reduction, proof and qualified action.'}</p></div></div></div>`}).join('')}
        <div class="fw-callout" data-tone="blue"><b>Do not chase a fixed ratio</b><p>The mix should respond to the diagnosed constraint and real publishing capacity. A discovery problem needs more Reach. A returning-viewer problem needs more Trust. Decision friction needs more Convert. The current planner calculates a best-fit mix and lets you override it when evidence says otherwise.</p></div>
       </section>

       <section class="fw-section" id="fw-testing"><div class="fw-section-head"><div class="fw-num">04</div><div><h2>Explore, Exploit and maintenance</h2><p>The month also needs a learning posture. This decides how broad the bets should be and how aggressively proven patterns should repeat.</p></div></div>
        <div class="fw-mode"><h3>Explore</h3><p>${esc(P.SOURCE_DATA?.portfolio?.mode?.Explore||'Use Explore when you do not yet have enough evidence to know what deserves repeated investment. Test a wider range intentionally to acquire signal.')}</p><strong>Choose it when the learning would still be valuable even if the video only performs around baseline.</strong></div>
        <div class="fw-mode"><h3>Exploit</h3><p>${esc(P.SOURCE_DATA?.portfolio?.mode?.Exploit||'Use Exploit when you have a clear signal worth repeating. Narrow the range, create follow-ups and put more resources behind what is already working.')}</p><strong>Choose it when you can name the evidence you are trying to repeat, not simply because you need another upload.</strong></div>
        <div class="fw-mode"><h3>Maintain</h3><p>Maintenance is the protected baseline, not a separate mode in the current planner. Keep the proven content, publishing rhythm or funnel path healthy while the month explores or exploits the highest-leverage opportunity.</p><strong>Use it to avoid breaking what already works while you run the next strategic bet.</strong></div>
        <div class="fw-thesis"><b>How to choose</b><p>Ask one question: do we have enough evidence to know what deserves more investment? If no, Explore. If yes, Exploit. Then preserve the minimum healthy baseline around that choice.</p></div>
       </section>

       <section class="fw-section" id="fw-research"><div class="fw-section-head"><div class="fw-num">05</div><div><h2>Research is chosen by the decision</h2><p>Do not “do research” generically. Start with the unknown, then choose the evidence source that can actually resolve it. The output of research must change a decision or it is just browsing.</p></div></div>
        <div class="fw-callout"><b>Research loop</b><p>Question → evidence source → collect → compare → extract mechanism → make a decision → define what would prove or disprove it after publishing.</p></div>
        <div class="fw-details">${fwResearchDetails}</div>
       </section>

       <section class="fw-section" id="fw-types"><div class="fw-section-head"><div class="fw-num">06</div><div><h2>Video types and formats</h2><p>The archetype is the viewer experience and problem-solving shape. The production format is how that experience is delivered. Pick the type because it fits the job, viewer and proof, not because the creator feels like making one.</p></div></div>
        <div class="fw-type-groups">
          <div class="fw-type-group"><h3>Reach archetypes</h3><p>Designed to make the right new viewer care fast.</p><div class="fw-type-list">${fwTypes('Reach')}</div></div>
          <div class="fw-type-group"><h3>Trust archetypes</h3><p>Designed to deepen belief, memory, relationship or understanding.</p><div class="fw-type-list">${fwTypes('Trust')}</div></div>
          <div class="fw-type-group"><h3>Convert archetypes</h3><p>Designed to reduce uncertainty and support a real decision.</p><div class="fw-type-list">${fwTypes('Convert')}</div></div>
        </div>
        <div class="fw-callout" data-tone="green"><b>Type is not a prison</b><p>These are starting recommendations. The same archetype can serve a different job when the promise, viewer state and proof are designed for it. The primary job still determines how the video should be judged.</p></div>
        <div class="fw-details">${Object.entries(P.SOURCE_DATA?.archetypes||{}).map(([name,d],i)=>`<details><summary><span class="fw-index">${String(i+1).padStart(2,'0')}</span><b>${esc(name)}</b><span>${esc(d.best||d.what||'')}</span></summary><div class="fw-detail-body"><div><label>What it is</label><p>${esc(d.what||'')}</p></div><div><label>Best for</label><p>${esc(d.best||d.when||'')}</p></div><div><label>Structure / research</label><p>${esc(d.structure||d.research||'')}</p></div><div><label>Avoid</label><p>${esc(d.avoid||d.not||'')}</p></div></div></details>`).join('')}</div>
       </section>

       <section class="fw-section" id="fw-package"><div class="fw-section-head"><div class="fw-num">07</div><div><h2>Packaging creates the promise</h2><p>The title and thumbnail are not decoration applied after the video. They define the expectation the opening and body must fulfill. Package early enough that filming can capture the proof and visuals the promise requires.</p></div></div>
        <div class="fw-thesis"><b>Title + thumbnail relationship</b><p>They should create one idea together, not repeat the same sentence twice. The title can carry context, specificity or causality. The thumbnail can carry the visual proof, tension, contrast, choice or emotional shorthand. If one works without the other, the pair is usually leaving clarity or curiosity on the table.</p></div>
        <div class="fw-rule-grid">${['Reach','Trust','Convert'].map(fwFormulaCol).join('')}</div>
        <div class="fw-checklist">
          <div class="fw-check"><b>Demand</b><p>Is the problem, desire, person, event, comparison or curiosity engine already supported by evidence?</p></div>
          <div class="fw-check"><b>Promise</b><p>What does the viewer believe they will understand, feel, avoid, choose or achieve after the click?</p></div>
          <div class="fw-check"><b>Visual idea</b><p>Can the thumbnail communicate the core tension in one glance without needing small explanatory text?</p></div>
          <div class="fw-check"><b>Complement</b><p>Do title and thumbnail add different information while pointing to the same promise?</p></div>
          <div class="fw-check"><b>Deliverability</b><p>Can the first 30 seconds and the actual footage immediately prove this package was truthful?</p></div>
          <div class="fw-check"><b>Test hypothesis</b><p>Know what variable you are testing so a win or loss produces usable learning.</p></div>
        </div>
       </section>

       <section class="fw-section" id="fw-hook"><div class="fw-section-head"><div class="fw-num">08</div><div><h2>Hook and structure: Promise → Proof → Plan</h2><p>The opening is not a second title. It should confirm the click, make the result believable, and give the viewer confidence that the video has a clear path to payoff.</p></div></div>
        <div class="fw-ppp"><div><b>Promise</b><p>Confirm the exact problem, desired result or tension the package created. The viewer should know they are in the right video immediately.</p></div><div><b>Proof</b><p>Give a reason to believe. Show the wrong/right contrast, result, mechanism, receipt, authority, example or demonstration as early as the concept allows.</p></div><div><b>Plan</b><p>Explain the route. Give the viewer a simple roadmap, constraint, sequence or question that tells them how the payoff will unfold.</p></div></div>
        <div class="fw-callout" data-tone="rose"><b>Package-to-opening rule</b><p>When the package changes, the opening must be re-checked. If the title promises a specific result but the hook starts with biography, throat-clearing or a different problem, the viewer experiences a broken promise even if the rest of the video is good.</p></div>
        <div class="fw-details">${(P.SOURCE_DATA?.structures||[]).map((d,i)=>`<details><summary><span class="fw-index">${String(i+1).padStart(2,'0')}</span><b>${esc(d.name||'Structure')}</b><span>${esc(d.best||'')}</span></summary><div class="fw-detail-body"><div><label>Best use</label><p>${esc(d.best||'')}</p></div><div><label>Why it works</label><p>Use the progression that makes the promised payoff easiest to follow and believe.</p></div>${d.steps?`<div class="full"><label>Sequence</label><p>${esc(fwText(d.steps))}</p></div>`:''}</div></details>`).join('')}</div>
       </section>

       <section class="fw-section" id="fw-cta"><div class="fw-section-head"><div class="fw-num">09</div><div><h2>CTA and conversion</h2><p>The CTA should continue the viewer’s current problem-solving journey. The business action only makes sense when it matches their readiness and the promise they just received.</p></div></div>
        <div class="fw-rule-grid">${['Reach','Trust','Convert'].map(job=>`<div class="fw-rule-col"><h3>${job}</h3><h4>Best-fit CTA families</h4><p class="fw-chipline">${esc(fwText(P.JOB_CTA?.[job]))}</p><h4>Primary intent</h4><p class="fw-chipline">${job==='Reach'?'Keep the right new viewer moving into another useful problem, sequence or lightweight resource.':job==='Trust'?'Deepen the idea, relationship or implementation path without breaking the experience.':'Reduce decision friction and make the next qualified action obvious.'}</p></div>`).join('')}</div>
        <div class="fw-callout"><b>Mid-roll rule</b><p>No CTA is a valid choice. Add a mid-roll only where the viewer naturally feels a new implementation need, curiosity gap or decision point. The transition should come from the content, not from “before we continue.”</p></div>
        <div class="fw-details">${Object.entries(P.SOURCE_DATA?.cta||{}).map(([name,d],i)=>`<details><summary><span class="fw-index">${String(i+1).padStart(2,'0')}</span><b>${esc(name)}</b><span>${esc(d.when||d.best||d.why||'')}</span></summary><div class="fw-detail-body"><div><label>Why</label><p>${esc(d.why||'')}</p></div><div><label>When</label><p>${esc(d.when||d.best||'')}</p></div><div><label>Transition</label><p>${esc(d.transition||d.formula||d.template||'')}</p></div><div><label>Avoid</label><p>${esc(d.avoid||'')}</p></div></div></details>`).join('')}</div>
       </section>

       <section class="fw-section" id="fw-planning"><div class="fw-section-head"><div class="fw-num">10</div><div><h2>90-day strategy and monthly planning</h2><p>The quarter is the strategic chapter. The month is the operating bet. The video is the individual test or rep. Do not ask a single upload to carry the whole strategy.</p></div></div>
        <div class="fw-checklist">
          <div class="fw-check"><b>Anchor audit</b><p>Establish current audience, channel and business reality. Review performance trends, returning behavior, conversion path, offer, capacity and the strongest existing evidence.</p></div>
          <div class="fw-check"><b>Diagnose</b><p>Name the single current constraint or highest-leverage opportunity. This prevents a packaging fix from being applied to a trust problem or a conversion fix to a discovery problem.</p></div>
          <div class="fw-check"><b>Set 90-day destination</b><p>Define what should be materially different by the end of the quarter and what evidence would make you believe the strategy worked.</p></div>
          <div class="fw-check"><b>Sequence three chapters</b><p>Month 1 learns or repairs. Month 2 repeats and sharpens the strongest signal. Month 3 connects or scales the resulting system.</p></div>
          <div class="fw-check"><b>Choose monthly posture</b><p>Explore when evidence is weak, Exploit when evidence is strong, and preserve the baseline that should not be destabilized.</p></div>
          <div class="fw-check"><b>Allocate the funnel mix</b><p>Assign Reach, Trust and Convert slots according to the constraint and actual capacity. A creator making two videos needs a different operating plan from one making eight.</p></div>
          <div class="fw-check"><b>Give every slot a job</b><p>Each planned video should have a reason to exist before topic ideation begins: acquire attention, follow a signal, build trust, bridge a sequence, convert, or deliberately explore.</p></div>
          <div class="fw-check"><b>Monthly review</b><p>At the end of the month, decide what the evidence means for the next month. Do not simply roll unfinished ideas forward unchanged.</p></div>
        </div>
        <div class="fw-thesis"><b>Capacity rule</b><p>The strategy should compress to the creator’s real publishing capacity. Protect the highest-priority job first, then add the next most important job. Do not force a four-video template onto a one- or two-video creator.</p></div>
       </section>

       <section class="fw-section" id="fw-loop"><div class="fw-section-head"><div class="fw-num">11</div><div><h2>Analytics and the learning loop</h2><p>Analytics are evidence for the next decision. Compare videos against their intended job and the creator’s own comparable baseline before using generic benchmarks.</p></div></div>
        <div class="fw-ppp"><div><b>24h</b><p>Did the opportunity earn enough distribution? Did the package earn the click? Did the opening confirm the click?</p></div><div><b>7d</b><p>Is the experience holding up against comparable same-job videos? Is the intended viewer behavior appearing?</p></div><div><b>28d</b><p>What looks durable enough to change the system, the backlog, a recurring format or the next monthly plan?</p></div></div>
        <div class="fw-thesis"><b>Observe → Interpret → Confidence → Decide → Route</b><p>First record what happened without explanation. Then name the best current explanation. State how confident you are. Decide what changes. Route that change to Next Video, Monthly Plan, Creator Strategy, Packaging System or Research System.</p></div>
        <div class="fw-mode"><h3>2-of-3 logic</h3><p>Use multiple signals rather than declaring victory or failure from one metric. When two of the three relevant performance areas are healthy, protect the underlying win and diagnose the remaining weak link. When only one or none are healthy, avoid scaling the pattern until the failure point is understood.</p><strong>The exact signals should match the video’s job and the evidence available, not a universal vanity metric.</strong></div>
        <div class="fw-mode"><h3>Keep</h3><p>Preserve the part of the hypothesis that evidence supports: topic, package mechanism, format, proof style, CTA path or audience.</p><strong>Do not “keep the video.” Keep the mechanism that appears to be working.</strong></div>
        <div class="fw-mode"><h3>Kill</h3><p>Stop investing in a hypothesis when the evidence is strong enough that repeating it would mostly repeat the same failure.</p><strong>Kill the unsupported bet, not the entire strategic category unless the evidence actually supports that conclusion.</strong></div>
        <div class="fw-mode"><h3>Bridge</h3><p>Carry the strong part of one result into a new test designed to resolve the weak or uncertain part.</p><strong>Bridge is how learning compounds instead of forcing every result into winner or loser.</strong></div>
       </section>

       <section class="fw-section" id="fw-example"><div class="fw-section-head"><div class="fw-num">12</div><div><h2>Worked example</h2><p>One upload moving through the whole system. This is the reasoning chain the normal workflow is quietly helping you build.</p></div></div>
        <div class="fw-example"><div class="fw-example-head"><div class="eyebrow">Example from the current workspace</div><h3>${esc(exampleTitle)}</h3><p>The values below show how each decision should constrain the next one.</p></div>
          <div class="fw-example-row"><label>Strategy</label><b>Senior golfer who wants golf to feel easier and more consistent</b><p>Audience language and channel promise rule out broad fitness content even if it could get views.</p></div>
          <div class="fw-example-row"><label>Current need</label><b>Qualified discovery plus evidence on a proven pain</b><p>The bottleneck tells us to prioritize a discovery-worthy problem without abandoning relevance.</p></div>
          <div class="fw-example-row"><label>Month</label><b>Exploit with a protected Trust baseline</b><p>Existing evidence says stiffness, setup and consistency deserve another rep, so the month narrows instead of scattering.</p></div>
          <div class="fw-example-row"><label>Video job</label><b>${esc(exampleJob)} · ${esc(exampleRole)}</b><p>The upload exists to bring the right senior golfer in around a pain already supported by evidence.</p></div>
          <div class="fw-example-row"><label>Research</label><b>Own-channel evidence + direct-niche outliers + packaging patterns</b><p>Own data validates the pain, outliers validate demand, and packaging research finds the clearest promise mechanism.</p></div>
          <div class="fw-example-row"><label>Type + promise</label><b>How-To · a three-second activation before every shot</b><p>The finite mechanism gives the viewer an easy-to-understand promise and gives production something demonstrable to prove.</p></div>
          <div class="fw-example-row"><label>Package</label><b>Specific fix + immediate visual proof</b><p>The thumbnail should show the physical change or contrast. The title should carry the time/mechanism or outcome, not repeat the thumbnail text.</p></div>
          <div class="fw-example-row"><label>Opening</label><b>Promise → proof → plan</b><p>Confirm stiffness, show the wrong/right movement, then explain the three activation points the viewer will use before each shot.</p></div>
          <div class="fw-example-row"><label>CTA</label><b>Next Problem / Watch Next</b><p>A new viewer is more likely to continue into the next senior-golf problem than jump directly to a high-friction business action.</p></div>
          <div class="fw-example-row"><label>Learning</label><b>Route the weak link, not a vague verdict</b><p>If click is strong but 30-second retention is weak, keep the topic/package signal and change the opening. Do not abandon the whole concept.</p></div>
        </div>
       </section>

       <section class="fw-section" id="fw-coach"><div class="fw-section-head"><div class="fw-num">13</div><div><h2>Coach reasoning: the questions behind the buttons</h2><p>When the recommendation is unclear, work back up the chain. These questions recover the logic without dumping every option onto the working screen.</p></div></div>
        <div class="fw-checklist">
          <div class="fw-check"><b>What are we actually trying to change?</b><p>If the answer is vague, go back to diagnosis or the 90-day destination before choosing tactics.</p></div>
          <div class="fw-check"><b>What evidence do we already have?</b><p>Separate known signals from assumptions. Strong evidence points toward Exploit. Important unknowns point toward Explore.</p></div>
          <div class="fw-check"><b>Why does this video slot exist?</b><p>Choose a primary job and portfolio role before debating the exact topic or format.</p></div>
          <div class="fw-check"><b>Who is the viewer at this exact moment?</b><p>Not the whole avatar. What do they already know, what are they trying to resolve, and how ready are they for a next step?</p></div>
          <div class="fw-check"><b>Which research source can answer the unknown?</b><p>Pick research by the decision you need to make, then stop once the evidence is sufficient to move.</p></div>
          <div class="fw-check"><b>What promise are we making?</b><p>Make the promise concrete enough that title, thumbnail, opening, structure, proof and CTA can all align to it.</p></div>
          <div class="fw-check"><b>What has to be true for the viewer to believe us?</b><p>That answer determines proof, stories, demonstrations, examples, screenshots, footage, expert context and production assets.</p></div>
          <div class="fw-check"><b>What should happen immediately after this video?</b><p>The best CTA is the next useful step for the viewer’s current state, then the business path is designed around that truth.</p></div>
          <div class="fw-check"><b>What would make us change our mind?</b><p>Define the learning hypothesis before publishing so analytics can update the system instead of becoming post-hoc storytelling.</p></div>
        </div>
        <div class="fw-thesis"><b>The goal of the framework</b><p>You should be able to use Accelerator quickly without remembering every rule. But when you ask “why is it recommending this?” or “what does this choice affect?”, the answer should always be available and traceable through the system.</p></div>
        <p class="fw-footer-note">Framework reference aligned to the current Accelerator workspace and the active SOP principles reviewed in Drive, including anchor audit, quarterly outcomes, funnel balance, monthly review, content-job diagnosis, audience feedback routing and post-publish learning. The Decision Library remains the exhaustive option bank; this Framework Guide explains how those options fit together.</p>
       </section>
      </div>
    </div>
    ${typeof window.v163FrameworkPanel==='function'?window.v163FrameworkPanel(c):''}
   </section>`;
 }
 window.renderFramework=renderFramework;

 const __v15RenderTop=renderTop;
 renderTop=function(){
   let html=__v15RenderTop();
   html=html.replace(/V14\.3 · CLARITY/g,'V15 · FRAMEWORK');

     html=html.replace('</nav>',`<button data-view="framework" class="${state.view==='framework'?'active':''}">Framework</button></nav>`);

   $('#app').innerHTML=`<div class="shell">${renderTop()}<main>${renderFramework()}</main></div>`;
 };
 try{render()}catch(err){console.error('V15 framework render',err)}
})();

.v152-review-summary{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}.v152-review-stat{padding:11px 12px;border-right:1px solid var(--line);background:var(--surface)}.v152-review-stat:last-child{border-right:0}.v152-review-stat span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--muted2)}.v152-review-stat strong{display:block;font-size:15px;margin-top:5px}.v152-review-stat small{display:block;font-size:8.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.v152-video-review{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) 70px 1.1fr;gap:10px;align-items:start}.v152-video-review:first-child{border-top:0}.v152-video-review h4{font-size:10.5px}.v152-video-review p{font-size:9px;color:var(--muted);margin-top:3px}.v152-metrics{font-size:8.7px;line-height:1.45;color:var(--muted)}.v152-metrics b{color:var(--ink)}
.v152-review-section{margin-top:18px;border-top:1px dashed var(--line2);padding-top:16px}.v152-review-section h3{font-size:13px}.v152-review-section>p{font-size:10px;color:var(--muted);line-height:1.45;margin-top:4px}.v152-next-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;margin-top:12px}.v152-next-card h3{font-size:14px}.v152-next-card>p{font-size:10px;color:var(--muted);line-height:1.45;margin-top:5px}.v152-next-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.v152-next-detail{padding:9px;background:var(--soft);border-radius:8px}.v152-next-detail label{display:block;font-size:7.7px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--muted2)}.v152-next-detail p{font-size:9.2px;line-height:1.35;margin-top:4px}.v152-review-choice{cursor:pointer}.v152-review-choice.selected{border-color:var(--line2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--soft)}
.v152-report-list{display:grid;gap:8px;margin-top:12px}.v152-report-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface)}.v152-report-row h4{font-size:10.5px}.v152-report-row p{font-size:9px;color:var(--muted);margin-top:3px}.v152-plan-report-block{margin-top:28px;padding-top:20px;border-top:1px dashed var(--line2)}.v152-doc{white-space:pre-wrap;word-break:break-word;font:500 10.5px/1.55 var(--font,inherit);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:60vh;overflow:auto}
html[data-theme="dark"] .v152-panel,html[data-theme="dark"] .v152-resource-row,html[data-theme="dark"] .v152-review-step,html[data-theme="dark"] .v152-review-stat,html[data-theme="dark"] .v152-next-card,html[data-theme="dark"] .v152-report-row{background:var(--surface)}
html[data-theme="dark"] .v152-resource-icon,html[data-theme="dark"] .v152-status-icon,html[data-theme="dark"] .v152-next-detail,html[data-theme="dark"] .v152-commit-result{background:var(--soft)}
@media(max-width:900px){.v152-home-grid{grid-template-columns:1fr}.v152-review-summary{grid-template-columns:1fr 1fr}.v152-review-stat:nth-child(2){border-right:0}.v152-review-stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.v152-next-details{grid-template-columns:1fr}.v152-video-review{grid-template-columns:1fr 70px}.v152-metrics{grid-column:1/-1}}
@media(max-width:760px){.v152-tool span{display:none}.v152-resource-row{grid-template-columns:30px 1fr}.v152-resource-row>.actions{grid-column:2;justify-content:flex-start}.v152-review-progress{grid-template-columns:1fr}.v152-review-summary{grid-template-columns:1fr}.v152-review-stat{border-right:0!important;border-bottom:1px solid var(--line)}.v152-review-stat:last-child{border-bottom:0}.v152-video-review{grid-template-columns:1fr}.v152-video-review>*{grid-column:1}.v152-cycle-line{grid-template-columns:32px 1fr}.v152-cycle-line>.btn{grid-column:1/-1}}
</style>


<script id="v152-client-cycle-script">
(()=>{
if(window.__v152ClientCycle)return;window.__v152ClientCycle=true;

function v152Icon(name){
 const p={link:'<path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/>',folder:'<path d="M3 6h7l2 2h9v10H3z"/>',report:'<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v5h5M8 13h8M8 17h6M8 9h3"/>',check:'<path d="m5 12 4 4L19 6"/>',pin:'<path d="m9 4 6 6m-8 2 5 5m-7-3 5-5 5 5-5 5z"/>',archive:'<path d="M4 7h16v13H4zM3 4h18v4H3zM9 12h6"/>'}[name]||'<circle cx="12" cy="12" r="8"/>';
 return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function v152Ensure(c){
 if(!c)return;
 if(!Array.isArray(c.clientResources))c.clientResources=[];
 if(!Array.isArray(c.monthReports))c.monthReports=[];
 (c.commitments||[]).forEach(x=>{if(x.archived==null)x.archived=false;if(x.completedAt==null)x.completedAt='';if(x.result==null)x.result='';if(x.createdAt==null)x.createdAt=''});
}
state.creators.forEach(v152Ensure);
function v152PlanText(c){
 const p=ensureQuarterPlan(c),a=p?.activeMonth||1;
 return `${handoffQuarter(c)}\n\n## CURRENT OPERATING MONTH\nMonth ${a}\nFocus: ${c.month?.outcome||''}\nMode: ${c.month?.mode||''}\nLearning question: ${c.month?.learningQuestion||''}\n\n${handoffMonth(c)}`;
}
function v152ArchivePlan(c,label='Previous plan'){
 if(!c.quarterPlan)return;c.planHistory=c.planHistory||[];c.planHistory.unshift({id:uid('ph'),savedAt:today(),label,diagnosis:c.currentConstraint||c.quarterPlan.diagnosis||'',text:v152PlanText(c),ai:v152PlanText(c),plan:clone(c.quarterPlan)});c.planHistory=c.planHistory.slice(0,12)
}
function v152DocHtml(text){return `<pre class="v152-doc">${esc(text||'')}</pre>`}

function v152SafeUrl(u){u=String(u||'').trim();if(!u)return'';if(!/^[a-z]+:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return''}}
function v152ResourceTypeIcon(type){return ['Drive','Assets'].includes(type)?'folder':'link'}
function v152ResourceGroups(c){v152Ensure(c);const pinned=c.clientResources.filter(x=>x.pinned),rest=c.clientResources.filter(x=>!x.pinned);return {pinned,rest}}
function v152OpenResources(){
 const c=creator();v152Ensure(c);const {pinned,rest}=v152ResourceGroups(c);
 const rows=arr=>arr.map(r=>`<div class="v152-resource-row ${r.pinned?'pinned':''}"><div class="v152-resource-icon">${v152Icon(v152ResourceTypeIcon(r.type))}</div><div><h4>${esc(r.label||'Untitled resource')}</h4><p>${esc(r.type||'Other')}${r.note?` · ${esc(r.note)}`:''}</p></div><div class="actions"><button class="tinybtn" data-action="v152-open-resource" data-id="${r.id}">Open ↗</button><button class="tinybtn" data-action="v152-edit-resource" data-id="${r.id}">Edit</button></div></div>`).join('');
 openDrawer(`${c.name} · Resources`,`<div class="drawer-section"><div class="v152-panel-head"><div><h3>Client resources</h3><p>Keep the links you actually need for this creator in one place.</p></div><button class="btn dark" data-action="v152-add-resource">+ Add link</button></div></div>${pinned.length?`<div class="v152-resource-group"><div class="v152-resource-group-head"><h3>Pinned</h3><span class="small">${pinned.length}</span></div><div class="v152-resource-list">${rows(pinned)}</div></div>`:''}<div class="v152-resource-group"><div class="v152-resource-group-head"><h3>${pinned.length?'All other links':'Saved links'}</h3><span class="small">${rest.length}</span></div>${rest.length?`<div class="v152-resource-list">${rows(rest)}</div>`:'<div class="v152-resource-empty">No other links saved yet.</div>'}</div>`, `<button class="btn" data-action="close-drawer">Close</button><button class="btn dark" data-action="v152-add-resource">+ Add link</button>`);
}
function v152ResourceModal(item=null){
 const c=creator();v152Ensure(c);item=item||{id:'',label:'',url:'',type:'Doc',note:'',pinned:false};
 const types=['Doc','Drive','Dashboard','Channel','Research','Assets','Project','Other'];
 openModal(item.id?'Edit client resource':'Add client resource',`<div class="fields">${actionField('Label','v152ResLabel',item.label||'','text','What will you look for when you need this link?')}${actionField('URL','v152ResUrl',item.url||'','text','Paste the document, dashboard, folder, channel or project link.')}<div class="field"><label>Type</label><select id="v152ResType">${types.map(x=>`<option ${x===item.type?'selected':''}>${x}</option>`).join('')}</select></div>${actionField('Note','v152ResNote',item.note||'','textarea','Optional context, like “weekly analytics dashboard” or “client working doc.”')}<label class="publish-check" style="margin-top:4px"><input type="checkbox" id="v152ResPinned" ${item.pinned?'checked':''}><span><b>Pin this link</b><span>Keep it at the top of this creator’s resources.</span></span></label></div><input type="hidden" id="v152ResId" value="${esc(item.id||'')}">`, `<button class="btn" data-action="close-modal">Cancel</button>${item.id?`<button class="btn ghost" data-action="v152-delete-resource" data-id="${item.id}">Delete</button>`:''}<button class="btn dark" data-action="v152-save-resource">Save link</button>`);
}

function v152CommitmentCounts(c){v152Ensure(c);const active=(c.commitments||[]).filter(x=>!x.done&&!x.archived),done=(c.commitments||[]).filter(x=>x.done&&!x.archived),arch=(c.commitments||[]).filter(x=>x.archived);return {active,done,arch}}
function v152OpenCommitments(filter=null){
 const c=creator();v152Ensure(c);const counts=v152CommitmentCounts(c);state.v152CommitFilter=filter||state.v152CommitFilter||'Open';const f=state.v152CommitFilter;const arr=f==='Completed'?counts.done:f==='Archived'?counts.arch:counts.active;
 const rows=arr.map(x=>`<div class="v152-commit-row"><div class="v152-check ${x.archived?'archived':x.done?'done':''}">${x.archived?'–':x.done?'✓':'○'}</div><div><h4>${esc(x.what||'Untitled commitment')}</h4><p>${esc(x.who||'')} · ${x.done&&x.completedAt?`completed ${fmtDate(x.completedAt)}`:`due ${fmtDate(x.when)}`}</p>${x.result?`<div class="v152-commit-result"><b>Result:</b> ${esc(x.result)}</div>`:''}</div><div class="actions"><button class="tinybtn" data-action="edit-commitment" data-id="${x.id}">Open</button>${!x.done?`<button class="tinybtn" data-action="v152-complete-commitment" data-id="${x.id}">Done</button>`:x.archived?`<button class="tinybtn" data-action="v152-restore-commitment" data-id="${x.id}">Restore</button>`:`<button class="tinybtn" data-action="v152-archive-commitment" data-id="${x.id}">Archive</button>`}</div></div>`).join('');
 openDrawer(`${c.name} · Commitments`,`<div class="drawer-section"><div class="v152-panel-head"><div><h3>Commitments</h3><p>Active work stays visible. Finished work stays available without cluttering the current list.</p></div><button class="btn dark" data-action="add-commitment">+ Add</button></div></div><div class="v152-commit-tabs">${[['Open',counts.active.length],['Completed',counts.done.length],['Archived',counts.arch.length]].map(([x,n])=>`<button class="subtab ${f===x?'active':''}" data-action="v152-commit-filter" data-filter="${x}">${x} · ${n}</button>`).join('')}</div>${rows||`<div class="v152-resource-empty">No ${f.toLowerCase()} commitments.</div>`}`, `<button class="btn" data-action="close-drawer">Close</button><button class="btn dark" data-action="add-commitment">+ Add commitment</button>`);
}
const __v152CommitmentModal=commitmentModal;
commitmentModal=function(item=null){
 v152Ensure(creator());item=item||null;
 openModal(item?'Edit commitment':'Add commitment',`<div class="fields">${actionField('WHAT','cmWhat',item?.what||'','textarea','The actual deliverable or decision.')}${actionField('WHO','cmWho',item?.who||creator().name)}${actionField('WHEN','cmWhen',item?.when||addDays(today(),7),'date')}${actionField('DONE WHEN','cmDone',item?.doneWhen||'','textarea','The evidence that lets everyone agree it is complete.')}${item?.result?actionField('Last completion result','cmPreviousResult',item.result,'textarea','What happened the last time this was marked complete.') : ''}</div><input type="hidden" id="cmId" value="${item?.id||''}">`, `<button class="btn" data-action="close-modal">Cancel</button>${item?(!item.done?`<button class="btn" data-action="v152-complete-commitment" data-id="${item.id}">Mark done</button>`:`<button class="btn" data-action="v152-reopen-commitment" data-id="${item.id}">Reopen</button>${item.archived?`<button class="btn" data-action="v152-restore-commitment" data-id="${item.id}">Restore</button>`:`<button class="btn" data-action="v152-archive-commitment" data-id="${item.id}">Archive</button>`}`):''}<button class="btn dark" data-action="save-commitment">Save</button>`);
}
function v152CompleteCommitmentModal(item){
 if(!item)return;openModal('Complete commitment',`<div class="selected-guide"><b>${esc(item.what||'Commitment')}</b><p>${esc(item.doneWhen||'Record what happened so this does not disappear from the coaching history.')}</p></div><div class="fields" style="margin-top:14px">${actionField('Completed on','v152CmCompleted',today(),'date')}${actionField('Result / what happened','v152CmResult',item.result||'','textarea','What was delivered, decided or learned? Keep it short and concrete.')}</div><input type="hidden" id="v152CmId" value="${item.id}">`, `<button class="btn" data-action="close-modal">Cancel</button><button class="btn dark" data-action="v152-save-completion">Complete</button>`)
}

function v152MonthVideos(c){syncMonthSlots(c);return (c.month.slots||[]).map((s,i)=>({slot:s,index:i,video:c.videos.find(v=>v.id===s.videoId)||null}))}
function v152MetricWindow(v){if(!v)return {key:'',d:{}};for(const k of ['_28d','_7d','_24h']){const d=v.analytics?.[k]||{};if(Object.values(d).some(x=>String(x||'').trim()))return {key:k.replace('_',''),d}}return {key:'',d:{}}}
function v152ReviewDraft(c){
 const p=ensureQuarterPlan(c),a=p?.activeMonth||1,m=p?.months?.[a-1],key=`${c.id}:${a}:${m?.startedAt||''}`;
 if(!state.v152ReviewDraft||state.v152ReviewDraft.key!==key){const next=p?.months?.[a]||null;state.v152ReviewDraft={key,creatorId:c.id,month:a,step:0,wins:'',misses:'',learning:m?.review||'',evidence:'',commitmentNotes:'',decision:'keep',nextTitle:next?.title||'',nextWhy:next?.why||'',nextFocus:next?.focus||'',nextTypes:(next?.videoTypes||[]).join(', '),nextLearning:next?.learning||''}}
 return state.v152ReviewDraft;
}
function v152SyncReviewDraft(){const d=state.v152ReviewDraft;if(!d)return;[['v152Wins','wins'],['v152Misses','misses'],['v152Learning','learning'],['v152Evidence','evidence'],['v152CommitmentNotes','commitmentNotes'],['v152NextTitle','nextTitle'],['v152NextWhy','nextWhy'],['v152NextFocus','nextFocus'],['v152NextTypes','nextTypes'],['v152NextLearning','nextLearning']].forEach(([id,k])=>{const el=$('#'+id);if(el)d[k]=el.value})}
function v152ReviewProgress(step){return `<div class="v152-review-progress">${[['Results','What happened'],['Learn','What changed'],['Next','Update the plan']].map(([a,b],i)=>`<div class="v152-review-step ${i===step?'active':i<step?'done':''}"><i>${i<step?'✓':i+1}</i><span>${a}<small style="display:block;font-weight:500;margin-top:2px">${b}</small></span></div>`).join('')}</div>`}
function v152VideoReviewRows(c){const rows=v152MonthVideos(c);return rows.map(({slot,video},i)=>{const w=v152MetricWindow(video),d=w.d;const title=video?(video.package?.finalTitle||video.package?.workingTitle||video.title):`Open ${slot.job||'video'} slot`;return `<div class="v152-video-review"><div><h4>${i+1}. ${esc(title)}</h4><p>${esc(slot.job||video?.job||'')} ${video?.role?`· ${esc(video.role)}`:''}</p></div><div><span class="job-pill">${esc(video?.stage||'Open')}</span></div><div class="v152-metrics">${w.key?`<b>${w.key} data</b> · ${d.views?`${esc(d.views)} views · `:''}${d.ctr?`${esc(d.ctr)} CTR · `:''}${d.ret30?`${esc(d.ret30)} 30s · `:''}${d.apv?`${esc(d.apv)} APV`:''}`:'No review data entered yet.'}</div></div>`}).join('')}
function v152ReviewStep0(c,d){const due=v11ReviewDue(c),p=ensureQuarterPlan(c),m=p?.months?.[(p.activeMonth||1)-1];return `${v152ReviewProgress(0)}${decisionHead(`Month ${p.activeMonth} review`,'What happened compared with the plan?','Use the videos and data that exist. You do not need perfect analytics to notice a useful pattern.',due.due?'Review ready':'Reviewing early')}<div class="v152-review-summary"><div class="v152-review-stat"><span>Published</span><strong>${due.stats.published}/${due.stats.total}</strong><small>planned videos</small></div><div class="v152-review-stat"><span>Diagnosis</span><strong style="font-size:11px">${esc(c.currentConstraint||'Not set')}</strong><small>working bottleneck</small></div><div class="v152-review-stat"><span>Month focus</span><strong style="font-size:11px">${esc(m?.title||'')}</strong><small>${esc(c.month.outcome||'')}</small></div><div class="v152-review-stat"><span>Days</span><strong>${due.days}</strong><small>in this phase</small></div></div><div class="v152-review-section"><h3>Planned videos + available data</h3>${v152VideoReviewRows(c)}</div><div class="fields" style="margin-top:16px">${actionField('What worked?','v152Wins',d.wins,'textarea','Patterns, videos, packages, formats, behaviors or results worth keeping.')}${actionField('What did not work or is still unclear?','v152Misses',d.misses,'textarea','Name the miss or uncertainty. Do not force a lesson if the evidence is weak.')}</div>`}
function v152ReviewStep1(c,d){const cnt=v152CommitmentCounts(c),p=ensureQuarterPlan(c),m=p?.months?.[(p.activeMonth||1)-1],start=m?.startedAt||'';const completed=cnt.done.concat(cnt.arch).filter(x=>!start||!x.completedAt||x.completedAt>=start);return `${v152ReviewProgress(1)}${decisionHead(`Month ${p.activeMonth} review`,'What did this month actually teach us?','Turn observations into a useful decision. Keep facts separate from interpretation.','Learning')}<div class="fields">${actionField('Main learning','v152Learning',d.learning,'textarea','What would you now do differently, repeat more confidently, or stop doing?')}${actionField('Evidence behind that learning','v152Evidence',d.evidence,'textarea','Use the strongest numbers, viewer behavior, comments, sales signals or repeated patterns that support it.')}${actionField('Commitment / execution notes','v152CommitmentNotes',d.commitmentNotes,'textarea','Anything about follow-through, production, client execution or process that should change next month?')}</div><div class="v152-review-section"><div class="v152-panel-head"><div><h3>Commitments this cycle</h3><p>Completed commitments become part of the record. Open ones carry forward until you close or archive them.</p></div><button class="tinybtn" data-action="v152-manage-commitments">Manage</button></div><div class="strip cols-3" style="margin-top:12px"><div class="strip-cell"><div class="eyebrow">Completed</div><h3>${completed.length}</h3><p>${completed.slice(0,2).map(x=>esc(x.what)).join(' · ')||'None recorded yet.'}</p></div><div class="strip-cell"><div class="eyebrow">Still open</div><h3>${cnt.active.length}</h3><p>${cnt.active.slice(0,2).map(x=>esc(x.what)).join(' · ')||'Nothing outstanding.'}</p></div><div class="strip-cell"><div class="eyebrow">Archived</div><h3>${cnt.arch.length}</h3><p>Finished items can stay out of the active coaching view.</p></div></div></div>`}
function v152NextPreview(c,d){const p=ensureQuarterPlan(c),a=p?.activeMonth||1,n=p?.months?.[a]||null;if(!n)return `<div class="v152-next-card"><h3>90-day cycle complete</h3><p>The next move is a fresh diagnosis and a new 90-day plan.</p></div>`;return `<div class="v152-next-card"><div class="eyebrow">Provisional Month ${a+1}</div><h3>${esc(n.title)}</h3><p>${esc(n.why)}</p><div class="v152-next-details"><div class="v152-next-detail"><label>Mix</label><p>${n.mix.Reach} Reach · ${n.mix.Trust} Trust · ${n.mix.Convert} Convert</p></div><div class="v152-next-detail"><label>Coach</label><p>${esc(n.focus)}</p></div><div class="v152-next-detail"><label>Learn</label><p>${esc(n.learning)}</p></div></div></div>`}

 if(a==='v152-save-completion'){const item=c.commitments.find(x=>x.id===$('#v152CmId')?.value);if(item){item.done=true;item.archived=false;item.completedAt=$('#v152CmCompleted')?.value||today();item.result=$('#v152CmResult')?.value?.trim()||'';save();closeModal();render();toast('Commitment completed')}return}
 if(a==='v152-reopen-commitment'){const item=c.commitments.find(x=>x.id===t.dataset.id);if(item){item.done=false;item.archived=false;item.completedAt='';save();closeModal();render();toast('Commitment reopened')}return}
 if(a==='v152-archive-commitment'){const item=c.commitments.find(x=>x.id===t.dataset.id);if(item){item.archived=true;item.archivedAt=today();save();closeModal();render();setTimeout(()=>v152OpenCommitments('Completed'),50)}return}
 if(a==='v152-restore-commitment'){const item=c.commitments.find(x=>x.id===t.dataset.id);if(item){item.archived=false;save();closeModal();render();setTimeout(()=>v152OpenCommitments(item.done?'Completed':'Open'),50)}return}
 if(a==='v152-month-review'){closeDrawer();v152OpenMonthReview();return}
 if(a==='v152-review-next'){v152SyncReviewDraft();state.v152ReviewDraft.step=Math.min(2,(state.v152ReviewDraft.step||0)+1);save();v152RenderMonthReview();return}
 if(a==='v152-review-back'){v152SyncReviewDraft();state.v152ReviewDraft.step=Math.max(0,(state.v152ReviewDraft.step||0)-1);save();v152RenderMonthReview();return}
 if(a==='v152-review-choice'){v152SyncReviewDraft();state.v152ReviewDraft.decision=t.dataset.choice;save();v152RenderMonthReview();return}
 if(a==='v152-preview-month-report'){v152SyncReviewDraft();const tmp=v152BuildReportSnapshot(c,state.v152ReviewDraft);tmp.updatedPlanText=state.v152ReviewDraft.decision==='diagnose'?'Re-diagnosis will rebuild the remaining plan after this month is saved.':state.v152ReviewDraft.decision==='adjust'?'The next-month fields shown in this review will replace the provisional chapter when you complete the review.':'The provisional next month will activate as currently planned.';closeModal();v152OpenReport(tmp);return}
 if(a==='v152-finalize-month-review'){v152FinalizeMonthReview();return}
 if(a==='v152-month-report-history'){closeModal();v152ReportHistory();return}
 if(a==='v152-open-report'){const r=(c.monthReports||[]).find(x=>x.id===t.dataset.id);v152OpenReport(r);return}
 if(a==='v152-copy-report'){copyText(window.__v152Report?.text||'');toast('Month report copied');return}
 if(a==='v152-copy-report-ai'){copyText(window.__v152Report?.ai||'');toast('AI context copied');return}
 if(a==='v152-download-report'){const r=window.__v152Report||{};download(r.filename||'month-review.md',r.text||'');return}
}
document.addEventListener('click',v152HandleClick);

/* Add timestamps to commitments created through the existing save action without changing that working handler. */
document.addEventListener('click',e=>{const t=e.target.closest('[data-action="save-commitment"]');if(!t)return;setTimeout(()=>{const c=creator();v152Ensure(c);(c.commitments||[]).forEach(x=>{if(!x.createdAt)x.createdAt=today()});save()},0)});

try{state.creators.forEach(v152Ensure);save();render()}catch(err){console.error('V15.2 init',err)}
})();
</script>
